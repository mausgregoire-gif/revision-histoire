stad en slaan zichzelf in het openbaar met een zweep.","Zo doen ze **boete** en hopen ze God gunstig te stemmen.","Bron: de kroniek van **Gilles Le Muisit**, abt in Doornik. Hij was blind en **dicteerde** zijn werk."]},{t:"Bron 4: de joden als zondebok",p:["**Jan van Boendale** (Antwerpen, ca. 1350) schrijft dat de joden de **waterputten** vergiftigd zouden hebben.","Daarom worden joden gevangengenomen en **verbrand**.","In de middeleeuwen geeft men de joden de schuld van de **dood van Jezus**.","Die verklaringen hangen samen met de middeleeuwse cultuur: ze zijn **standplaatsgebonden**.",{q:"Wat betekent 'standplaatsgebonden' hier?",o:["De verklaring hangt samen met de cultuur van die tijd","De bron ligt in een museum","De verklaring is wetenschappelijk"],a:0}]},{t:"Bron 2: nieuwe inzichten",p:["Archeologen en biologen onderzoeken een **massagraf** in Londen (2011).","Met **DNA-onderzoek** zien ze wie aan de pest stierf.","Vroeger dacht men: **alleen ratten** en hun vlooien. Dat idee is verlaten.","Waarschijnlijk sprongen ook **vlooien en luizen** van mens op mens: mensen sliepen op stro en droegen lang dezelfde kleren.","Misschien was **besmetting via de lucht** nog belangrijker.","Onze kennis over de Zwarte Dood **evolueert** dus nog altijd.",{q:"Welk idee is verlaten?",o:["Alleen ratten verspreidden de pest","De pest kwam uit Azi\xEB","Er waren veel doden"],a:0}]},{t:"Bron 5\u20136: bescherming",p:["**Snaveldokters** dragen een masker met een vogelbek vol kruiden en specerijen.","Het zijn betaalde vrijwilligers die zieken in **quarantaine** plaatsen.","Men bidt tot **pestheiligen**, zoals **Sint-Rochus**.",{q:"Wat zit er in de vogelbek van een snaveldokter?",o:["Kruiden en specerijen","Medicijnen","Niets"],a:0}]},{t:"Bron 7: quarantaine",p:["**1377, Ragusa** (nu Dubrovnik): handelaars moeten **3 weken** in isolement op een eiland.","**Veneti\xEB** (vanaf 1448): schepen blijven **40 dagen** buiten de haven.","In het Venetiaans is veertig **'quarantena'**: zo ontstaat het woord **quarantaine**.",{q:"Waar komt het woord quarantaine vandaan?",o:["'Quarantena' = veertig (dagen)","Een dokter uit Rome","Een eiland"],a:0}]}],lees:[{t:"De verspreiding",x:"De Zwarte Dood is een [[pandemie]]. De [[pestbacterie]] komt uit Azi\xEB en reist mee via de [[handelscontacten]]. In [[1347]] bereikt ze Europa.",k:{1347:"Volgens de kaart (bron 1) duikt de pest dan op in havens aan de Middellandse Zee, zoals Marseille en op Sicili\xEB.",pandemie:"Wereldwijde verspreiding van een besmettelijke ziekte.",pestbacterie:"Leeft in vlooien op knaagdieren en andere kleine zoogdieren; herkomstgebied in Azi\xEB.",handelscontacten:"In de 14e eeuw zijn er intensieve handelscontacten tussen Azi\xEB en Europa: de bacterie reist mee."}},{t:"Middeleeuwse verklaringen",x:"[[Flagellanten|flagellant]] doen boete omdat ze de pest als [[straf van God]] zien. Jan van Boendale beschuldigt de joden van het vergiftigen van [[waterputten]]. Die verklaringen zijn [[standplaatsgebonden]].",k:{flagellant:"Middeleeuwse persoon die zich in het openbaar en in groep met een zweep slaat om boete te doen voor zijn zonden en die van anderen. Zo hoopt hij God gunstig te stemmen.","straf van God":"Middeleeuwers zien de pest als straf voor het slechte gedrag van de mensen.",waterputten:"Joden worden ervan beschuldigd waterputten te vergiftigen; ze worden gevangengenomen en verbrand.",standplaatsgebonden:"Be\xEFnvloed door tijd, ruimte, maatschappelijke positie en persoonskenmerken: de verklaringen hangen samen met de middeleeuwse cultuur."}},{t:"Kennis evolueert",x:"Met [[DNA-onderzoek]] op een [[massagraf]] in Londen stellen historici hun kennis bij: niet alleen de [[rattenvlo]], maar ook [[vlooien en luizen]] en misschien [[besmetting via de lucht]].",k:{"DNA-onderzoek":"Nieuwe techniek om na te gaan of begraven personen aan de pest gestorven zijn.",massagraf:"Graf met veel lichamen; in Londen in 2011 onderzocht door archeologen.",rattenvlo:"Lang dacht men dat alleen ratten en de rattenvlo de pest verspreidden. Dat idee wordt verlaten.","vlooien en luizen":"Sprongen van mens op mens (slapen op stro, kleding lang dragen) en reisden mee met handelaars in kleren en pelzen.","besmetting via de lucht":"Mensen besmetten elkaar ook zonder vlooien; misschien een nog belangrijkere oorzaak."}},{t:"Bescherming",x:"Een [[snaveldokter]] draagt een masker met kruiden. Men bidt tot [[pestheiligen|pestheilige]] zoals Sint-Rochus. Vanaf 1377 komt er [[quarantaine]].",k:{snaveldokter:"Betaalde vrijwilliger met een vogelbekmasker vol kruiden en specerijen, die zieken in quarantaine plaatst.",pestheilige:"Een van de vijf heiligen die tegen de pest aanbeden worden, zoals Sint-Rochus.",quarantaine:"Verplicht isolement om verspreiding van een ziekte te vermijden. Ragusa 1377: drie weken; Veneti\xEB 1448: veertig dagen ('quarantena')."}}],vocab:[["pandemie","Wereldwijde verspreiding van een besmettelijke ziekte."],["Zwarte Dood","Naam voor de pestepidemie van het midden van de 14e eeuw."],["flagellant","Slaat zich in het openbaar met een zweep als boete, om God gunstig te stemmen."],["standplaatsgebonden","Be\xEFnvloed door de tijd, plaats en cultuur van de maker."],["snaveldokter","Pestdokter met een vogelbekmasker vol kruiden en specerijen."],["pestheilige","Heilige die men aanbidt tegen de pest, zoals Sint-Rochus."],["quarantaine","Verplicht isolement om verspreiding van een ziekte te vermijden."],["DNA-onderzoek","Techniek om na te gaan of begraven personen aan de pest stierven."]],quiz:[{t:"mc",q:"In welk jaar duikt de pest voor het eerst op in Europa?",o:["1347","1348","1351","1377"],a:0,e:"Volgens de kaart (bron 1) in 1347, in havens aan de Middellandse Zee.",b:[["Bron 1 \xB7 Kaart van de verspreiding","Legende: rood = 1347 (havens aan de Middellandse Zee, o.a. Marseille en Sicili\xEB), daarna oranje en geel = 1348, 1349, 1350, groen = 1351 en later. De kleuren schuiven van het zuiden naar het noorden en noordoosten."]]},{t:"mc",q:"Waar ligt het herkomstgebied van de pestbacterie?",o:["In Azi\xEB","In Afrika","In Itali\xEB","In Scandinavi\xEB"],a:0,e:"De bacterie komt uit Azi\xEB en reist mee via de handelscontacten."},{t:"mc",q:"Waarin leeft de pestbacterie?",o:["In vlooien op knaagdieren en kleine zoogdieren","In vervuild water","In graan","In de lucht van moerassen"],a:0,e:"Ze leeft in vlooien op knaagdieren en andere kleine zoogdieren."},{t:"mc",q:"Wat hebben de plaatsen die als eerste getroffen worden gemeenschappelijk?",o:["Het zijn havens en handelsplaatsen","Het zijn bergdorpen","Het zijn kloosters","Het zijn hoofdsteden"],a:0,e:"De pest reist mee met de handel: havens aan de Middellandse Zee worden eerst getroffen.",b:[["Bron 1 \xB7 Kaart van de verspreiding","In 1347 (rood) worden eerst havens aan de Middellandse Zee getroffen, zoals Marseille en op Sicili\xEB. De pestbacterie reist mee met de handel tussen Azi\xEB en Europa."]]},{t:"mc",q:"Welke weg volgt de pest in Europa?",o:["Van het zuiden (Middellandse Zee) naar het noorden en noordoosten","Van het noorden naar het zuiden","Van het westen (Atlantische Oceaan) naar het oosten","Ze verschijnt overal tegelijk"],a:0,e:"Vanuit de havens in het zuiden trekt ze in fasen naar het noorden en noordoosten."},{t:"order",q:"Zet de fasen van de kaart (bron 1) in volgorde.",o:["1347","Midden 1348","Eind 1349","1351"],e:"De legende van de kaart gaat van 1347 tot na 1351.",b:[["Bron 1 \xB7 Kaart van de verspreiding","Legende: 1347, midden 1348, begin 1349, eind 1349, 1350, 1351, na 1351. De pest begint in de havens van de Middellandse Zee en eindigt in het noorden en oosten."]]},{t:"mc",q:"Hoeveel pestdoden telt West-Europa volgens historici?",o:["Ongeveer 40 miljoen, een derde tot de helft van de bevolking","Ongeveer 1,6 miljoen","Ongeveer 400 000","Bijna niemand"],a:0,e:"1,6 miljoen is het aantal slachtoffers van corona in 2020, wereldwijd."},{t:"mc",q:"Wat doen flagellanten?",o:["Ze slaan zichzelf in het openbaar met een zweep als boete","Ze verzorgen de zieken","Ze verbranden de lijken","Ze sluiten de stadspoorten"],a:0,e:"Ze doen boete voor hun zonden en die van anderen, om God gunstig te stemmen."},{t:"mc",q:"Waarvan worden de joden beschuldigd in bron 4?",o:["Het vergiftigen van waterputten","Het verspreiden van ratten","Het vervalsen van geld","Het sluiten van de markten"],a:0,e:"Jan van Boendale schrijft dat de joden de waterputten vergiftigd zouden hebben.",b:[["Bron 4 \xB7 Jan van Boendale, ca. 1350","'Alle joden hadden zich voorgenomen de christenen met gif om te brengen en daarom alle waterputten laten vergiftigen.' Men nam de joden gevangen en wierp ze in het vuur."]]},{t:"tf",q:"De verklaringen van de flagellanten en van Jan van Boendale zijn standplaatsgebonden.",a:!0,e:"Juist. Ze hangen samen met de middeleeuwse cultuur: het geloof dat God straft, het idee dat de joden verantwoordelijk zijn voor de dood van Jezus."},{t:"tf",q:"Historici denken vandaag nog steeds dat alleen ratten en de rattenvlo de pest verspreidden.",a:!1,e:"Fout. Dat idee wordt verlaten: het is praktisch niet mogelijk."},{t:"mc",q:"Welke nieuwe techniek helpt archeologen en biologen?",o:["DNA-onderzoek","Radio","Satellietbeelden","R\xF6ntgenfoto's van munten"],a:0,e:"Met DNA-onderzoek gaan ze na of de begraven personen aan de pest gestorven zijn."},{t:"mc",q:"Waarom konden vlooien en luizen makkelijk van mens op mens springen?",o:["Mensen sliepen op stro en droegen hun kleding lang","Mensen hielden ratten als huisdier","Mensen wasten zich nooit in badhuizen","Mensen aten rauw vlees"],a:0,e:"Ze reisden ook mee met handelaars in oude kleren en pelzen."},{t:"mc",q:"Wat stoppen pestdokters in de vogelbek van hun masker?",o:["Een mengsel van kruiden en specerijen","Medicijnen tegen vlooien","Wijwater","Niets"],a:0,e:"Deze betaalde vrijwilligers plaatsen zieken in quarantaine."},{t:"mc",q:"Wie is Sint-Rochus?",o:["Een van de vijf pestheiligen","Een snaveldokter uit Rome","Een abt uit Doornik","De doge van Veneti\xEB"],a:0,e:"Hij wordt in de middeleeuwen aanbeden tegen de pest (bron 6).",b:[["Bron 6 \xB7 Beeld van Sint-Rochus (16e eeuw, Mechelen)","Een van de vijf pestheiligen. Volgens de Kerk raakt Rochus besmet op pelgrimstocht naar Rome; een engel geneest hem en een hond brengt hem brood."]]},{t:"mc",q:"Waar komt het woord 'quarantaine' vandaan?",o:["Venetiaans 'quarantena' = veertig (dagen)","Latijn voor 'ziekte'","De naam van een eiland","De naam van een dokter"],a:0,e:"Veneti\xEB verplicht vanaf 1448 schepen om veertig dagen buiten de haven te blijven."},{t:"mc",q:"Wat beslist Ragusa (Dubrovnik) in 1377?",o:["Handelaars blijven drie weken in isolement op een eiland","De stad sluit voor altijd","Alle joden moeten de stad verlaten","Flagellanten mogen niet meer binnen"],a:0,e:"Zijn ze na die tijd nog in leven, dan vormen ze geen gevaar meer."},{t:"tf",q:"Gilles Le Muisit schreef zijn kroniek tot 1349 helemaal zelf met de hand.",a:!1,e:"Fout. Hij is op dat moment al blind en dicteert zijn werk."},{t:"mc",q:"Wat is een pandemie?",o:["Wereldwijde verspreiding van een besmettelijke ziekte","Een ziekte bij dieren","Een epidemie in \xE9\xE9n stad","Een middeleeuwse boeteprocessie"],a:0,e:"De Zwarte Dood is een pandemie."}],toets:[{k:"Onderzoeksvraag 1\u20133",q:"In welk jaar duikt de pest op in Europa? Wat hebben de getroffen plaatsen gemeenschappelijk? Wanneer bereikt de pest onze streken?",a:["1347.","Het zijn havens en handelsplaatsen: de pest reist mee met de handel.","Onze streken: kijk naar de kleur rond Brugge op de kaart (bron 1) \u2014 rond 1349."],b:[["Bron 1 \xB7 Kaart van de verspreiding","Rood = 1347 (havens aan de Middellandse Zee, o.a. Marseille en Sicili\xEB). Daarna 1348, 1349, 1350 en 1351, steeds verder naar het noorden en oosten. Onze streken (rond Brugge) kleuren rond 1349."]],s:"jaar, plaatsen, onze streken"},{k:"Onderzoeksvraag 4",q:"Wat kun je besluiten over de weg die de pest aflegt? Gebruik windrichtingen.",a:["Ze komt van het zuidoosten (Azi\xEB) over zee naar de Middellandse Zee.","Vandaar trekt ze naar het noorden en het noordoosten van Europa, via havens en handelsroutes."],s:"weg van de pest"},{k:"Onderzoeksvraag 5",q:"Welke oorzaken geeft men in de middeleeuwen voor de pest?",a:["Een straf van God (bron 3: flagellanten doen boete).","De joden zouden de waterputten vergiftigd hebben (bron 4)."],b:[["Bron 3 \xB7 Processie van flagellanten (kroniek, 1349)","Groepen trekken van stad tot stad en slaan zichzelf in het openbaar met een zweep, als boete voor hun zonden en die van anderen."],["Bron 4 \xB7 Jan van Boendale, ca. 1350","De joden zouden de waterputten vergiftigd hebben; ze worden gevangengenomen en verbrand."]],s:"middeleeuwse oorzaken"},{k:"Onderzoeksvraag 6 \xB7 KUNNEN 2",q:"Toon aan dat die verklaringen standplaatsgebonden zijn.",a:["Ze hangen samen met de middeleeuwse cultuur: het geloof dat God de mensen straft voor hun slechte gedrag.","En met het middeleeuwse idee dat de joden verantwoordelijk zijn voor de dood van Jezus."],b:[["Bron 3 \xB7 Flagellanten (kroniek van Gilles Le Muisit)","Ze doen in het openbaar boete met de zweep om God gunstig te stemmen: de pest als straf van God."],["Bron 4 \xB7 Jan van Boendale, ca. 1350","Hij beschrijft hoe God de mensen straft voor hun slechte gedrag, en beschuldigt de joden van het vergiftigen van waterputten. In de middeleeuwen geeft men de joden de schuld van de dood van Jezus."]],s:"standplaatsgebondenheid"},{k:"Onderzoeksvraag 7\u20138 \xB7 KUNNEN 3",q:"Toon met twee argumenten aan dat de kennis over de Zwarte Dood evolueert. Geef twee verklaringen voor de nieuwe inzichten.",a:["Vroeger: alleen ratten en de rattenvlo. Nu: ook vlooien en luizen van mens op mens, en misschien besmetting via de lucht.","Nieuwe technieken zoals DNA-onderzoek op massagraven (Londen 2011).","Samenwerking van archeologen met andere wetenschappers, zoals biologen."],b:[["Bron 2 \xB7 Massagraf in Londen (2011)","Archeologen werken samen met biologen. Met DNA-onderzoek zien ze wie aan de pest stierf. Het idee 'alleen rat
