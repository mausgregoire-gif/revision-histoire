(function(){
var __defProp=Object.defineProperty,__defProps=Object.defineProperties;var __getOwnPropDescs=Object.getOwnPropertyDescriptors;var __getOwnPropSymbols=Object.getOwnPropertySymbols;var __hasOwnProp=Object.prototype.hasOwnProperty,__propIsEnum=Object.prototype.propertyIsEnumerable;var __defNormalProp=(obj,key,value)=>key in obj?__defProp(obj,key,{enumerable:!0,configurable:!0,writable:!0,value}):obj[key]=value,__spreadValues=(a,b)=>{for(var prop in b||(b={}))__hasOwnProp.call(b,prop)&&__defNormalProp(a,prop,b[prop]);if(__getOwnPropSymbols)for(var prop of __getOwnPropSymbols(b))__propIsEnum.call(b,prop)&&__defNormalProp(a,prop,b[prop]);return a},__spreadProps=(a,b)=>__defProps(a,__getOwnPropDescs(b));const{useState,useEffect,useMemo}=React,M={id:"o3",vak:"Geschiedenis",les:"Onderzoek 3",title:"De Zwarte Dood",pages:"Storia 3, p. 73\u201376",color:"#b388ff",draad:[{t:"Waar gaat dit onderzoek over?",p:["In 2020 maakt het coronavirus wereldwijd meer dan 1,6 miljoen slachtoffers. In het Westen waren we dat niet meer gewend, maar eeuwenlang lag de dood altijd en overal op de loer.","De schrik zit er vooral in na de pestepidemie van het midden van de 14e eeuw. Later noemt men die pandemie 'de Zwarte Dood'.","Historici schatten het aantal pestdoden in West-Europa op ongeveer 40 miljoen: een derde tot de helft van de totale bevolking. Op de tijdlijn: 1346\u20131351."]},{t:"Bron 1: de weg van de pest",p:["Het herkomstgebied van de pestbacterie ligt in Azi\xEB. Daar leeft ze in vlooien op knaagdieren en andere kleine zoogdieren.","In de 14e eeuw zijn er al intensieve handelscontacten tussen Azi\xEB en Europa. De pestbacterie reist mee naar Europa.","De kaart toont de verspreiding: in 1347 komt de pest aan in havens aan de Middellandse Zee, zoals Marseille en op Sicili\xEB. Daarna verspreidt ze zich in fasen (1348, 1349, 1350, 1351) naar het noorden en noordoosten, via havens en handelsroutes."]},{t:"Bron 3: de flagellanten",p:["Gilles Le Muisit (1272\u20131352) is abt van de abdij van Sint-Maarten in Doornik. Zijn kroniek is een geschiedenis van de wereld tot 1349. Hij is op dat moment al blind en dicteert zijn werk. Pi\xE9rart van Tielt illustreert het.","Tijdens de pestepidemie trekken groepen flagellanten van stad tot stad. Ze slaan zichzelf in het openbaar met een zweep, als boete voor hun zonden en die van anderen. Zo hopen ze God gunstig te stemmen.","Achter dit gedrag zit het idee dat de pest een straf van God is."]},{t:"Bron 4: de joden als zondebok",p:["Jan van Boendale (ca. 1280\u20131351) werkt als secretaris en raadgever voor het Antwerpse stadsbestuur. In zijn 'Boek van de wraak van God' (ca. 1350) beschrijft hij hoe God de mensen straft voor hun slechte gedrag.","Hij schrijft dat de joden overal de waterputten vergiftigd zouden hebben. Daarom worden joden gevangengenomen en in het vuur geworpen.","In de middeleeuwen leeft het idee dat de joden verantwoordelijk zijn voor de dood van Jezus. Deze verklaringen zijn standplaatsgebonden: ze hangen samen met de middeleeuwse cultuur."]},{t:"Bron 2: nieuwe inzichten",p:["Archeologen onderzoeken samen met andere wetenschappers, zoals biologen, menselijke overblijfselen in (massa)graven, zoals in Londen in 2011. Met DNA-onderzoek gaan ze na of mensen aan de pest gestorven zijn.","Lang dacht men dat alleen ratten en de rattenvlo de pest verspreidden. Dat idee wordt verlaten, omdat het praktisch niet mogelijk is.","Waarschijnlijk sprongen ook vlooien en luizen van mens op mens: mensen sliepen op stro en droegen hun kleding lang. Vlooien en luizen reisden ook mee met handelaars in oude kleren en pelzen.","Opgravingen wijzen erop dat besmetting via de lucht een nog belangrijkere oorzaak kan zijn. Historici stellen hun kennis over de Zwarte Dood dus nog steeds bij."]},{t:"Bron 5\u20136: snaveldokter en pestheilige",p:["Bron 5 toont een snaveldokter in Rome (1656, Paul F\xFCrst). 'Pestdokters' steken een mengsel van kruiden en specerijen in een masker met een vogelbek. Deze betaalde vrijwilligers plaatsen zieken in quarantaine. Het masker wordt nog gedragen tijdens het carnaval van Veneti\xEB.","Bron 6 is een beeld van Sint-Rochus (eerste helft 16e eeuw, Mechelen). Hij is een van de vijf pestheiligen die in de middeleeuwen aanbeden worden. Volgens de Kerk zou Rochus van Montpellier besmet zijn tijdens een pelgrimstocht naar Rome; een engel geneest hem, een hond brengt hem brood."]},{t:"Bron 7: quarantaine",p:["Na de Zwarte Dood nemen lokale besturen maatregelen. Op 27 juli 1377 beslist de republiek Ragusa (nu Dubrovnik): handelaars moeten drie weken in isolement blijven op een eiland voor de kust.","Andere overheden nemen het systeem over. Veneti\xEB verplicht vanaf 1448 schepen om veertig dagen buiten de haven te blijven. In het Venetiaans is veertig 'quarantena': de oorsprong van het woord quarantaine.","De cartograaf Benedetto Bordone tekent in 1528 Veneti\xEB met drie quarantainestations. Die worden vaak vernoemd naar Lazarus."]}],lees:[{t:"De verspreiding",x:"De Zwarte Dood is een [[pandemie]]. De [[pestbacterie]] komt uit Azi\xEB en reist mee via de [[handelscontacten]]. In [[1347]] bereikt ze Europa.",k:{1347:"Volgens de kaart (bron 1) duikt de pest dan op in havens aan de Middellandse Zee, zoals Marseille en op Sicili\xEB.",pandemie:"Wereldwijde verspreiding van een besmettelijke ziekte.",pestbacterie:"Leeft in vlooien op knaagdieren en andere kleine zoogdieren; herkomstgebied in Azi\xEB.",handelscontacten:"In de 14e eeuw zijn er intensieve handelscontacten tussen Azi\xEB en Europa: de bacterie reist mee."}},{t:"Middeleeuwse verklaringen",x:"[[Flagellanten|flagellant]] doen boete omdat ze de pest als [[straf van God]] zien. Jan van Boendale beschuldigt de joden van het vergiftigen van [[waterputten]]. Die verklaringen zijn [[standplaatsgebonden]].",k:{flagellant:"Middeleeuwse persoon die zich in het openbaar en in groep met een zweep slaat om boete te doen voor zijn zonden en die van anderen. Zo hoopt hij God gunstig te stemmen.","straf van God":"Middeleeuwers zien de pest als straf voor het slechte gedrag van de mensen.",waterputten:"Joden worden ervan beschuldigd waterputten te vergiftigen; ze worden gevangengenomen en verbrand.",standplaatsgebonden:"Be\xEFnvloed door tijd, ruimte, maatschappelijke positie en persoonskenmerken: de verklaringen hangen samen met de middeleeuwse cultuur."}},{t:"Kennis evolueert",x:"Met [[DNA-onderzoek]] op een [[massagraf]] in Londen stellen historici hun kennis bij: niet alleen de [[rattenvlo]], maar ook [[vlooien en luizen]] en misschien [[besmetting via de lucht]].",k:{"DNA-onderzoek":"Nieuwe techniek om na te gaan of begraven personen aan de pest gestorven zijn.",massagraf:"Graf met veel lichamen; in Londen in 2011 onderzocht door archeologen.",rattenvlo:"Lang dacht men dat alleen ratten en de rattenvlo de pest verspreidden. Dat idee wordt verlaten.","vlooien en luizen":"Sprongen van mens op mens (slapen op stro, kleding lang dragen) en reisden mee met handelaars in kleren en pelzen.","besmetting via de lucht":"Mensen besmetten elkaar ook zonder vlooien; misschien een nog belangrijkere oorzaak."}},{t:"Bescherming",x:"Een [[snaveldokter]] draagt een masker met kruiden. Men bidt tot [[pestheiligen|pestheilige]] zoals Sint-Rochus. Vanaf 1377 komt er [[quarantaine]].",k:{snaveldokter:"Betaalde vrijwilliger met een vogelbekmasker vol kruiden en specerijen, die zieken in quarantaine plaatst.",pestheilige:"Een van de vijf heiligen die tegen de pest aanbeden worden, zoals Sint-Rochus.",quarantaine:"Verplicht isolement om verspreiding van een ziekte te vermijden. Ragusa 1377: drie weken; Veneti\xEB 1448: veertig dagen ('quarantena')."}}],vocab:[["pandemie","Wereldwijde verspreiding van een besmettelijke ziekte."],["Zwarte Dood","Naam voor de pestepidemie van het midden van de 14e eeuw."],["flagellant","Slaat zich in het openbaar met een zweep als boete, om God gunstig te stemmen."],["standplaatsgebonden","Be\xEFnvloed door de tijd, plaats en cultuur van de maker."],["snaveldokter","Pestdokter met een vogelbekmasker vol kruiden en specerijen."],["pestheilige","Heilige die men aanbidt tegen de pest, zoals Sint-Rochus."],["quarantaine","Verplicht isolement om verspreiding van een ziekte te vermijden."],["DNA-onderzoek","Techniek om na te gaan of begraven personen aan de pest stierven."]],quiz:[{t:"mc",q:"In welk jaar duikt de pest voor het eerst op in Europa?",o:["1347","1348","1351","1377"],a:0,e:"Volgens de kaart (bron 1) in 1347, in havens aan de Middellandse Zee."},{t:"mc",q:"Waar ligt het herkomstgebied van de pestbacterie?",o:["In Azi\xEB","In Afrika","In Itali\xEB","In Scandinavi\xEB"],a:0,e:"De bacterie komt uit Azi\xEB en reist mee via de handelscontacten."},{t:"mc",q:"Waarin leeft de pestbacterie?",o:["In vlooien op knaagdieren en kleine zoogdieren","In vervuild water","In graan","In de lucht van moerassen"],a:0,e:"Ze leeft in vlooien op knaagdieren en andere kleine zoogdieren."},{t:"mc",q:"Wat hebben de plaatsen die als eerste getroffen worden gemeenschappelijk?",o:["Het zijn havens en handelsplaatsen","Het zijn bergdorpen","Het zijn kloosters","Het zijn hoofdsteden"],a:0,e:"De pest reist mee met de handel: havens aan de Middellandse Zee worden eerst getroffen."},{t:"mc",q:"Welke weg volgt de pest in Europa?",o:["Van het zuiden (Middellandse Zee) naar het noorden en noordoosten","Van het noorden naar het zuiden","Van het westen (Atlantische Oceaan) naar het oosten","Ze verschijnt overal tegelijk"],a:0,e:"Vanuit de havens in het zuiden trekt ze in fasen naar het noorden en noordoosten."},{t:"order",q:"Zet de fasen van de kaart (bron 1) in volgorde.",o:["1347","Midden 1348","Eind 1349","1351"],e:"De legende van de kaart gaat van 1347 tot na 1351."},{t:"mc",q:"Hoeveel pestdoden telt West-Europa volgens historici?",o:["Ongeveer 40 miljoen, een derde tot de helft van de bevolking","Ongeveer 1,6 miljoen","Ongeveer 400 000","Bijna niemand"],a:0,e:"1,6 miljoen is het aantal slachtoffers van corona in 2020, wereldwijd."},{t:"mc",q:"Wat doen flagellanten?",o:["Ze slaan zichzelf in het openbaar met een zweep als boete","Ze verzorgen de zieken","Ze verbranden de lijken","Ze sluiten de stadspoorten"],a:0,e:"Ze doen boete voor hun zonden en die van anderen, om God gunstig te stemmen."},{t:"mc",q:"Waarvan worden de joden beschuldigd in bron 4?",o:["Het vergiftigen van waterputten","Het verspreiden van ratten","Het vervalsen van geld","Het sluiten van de markten"],a:0,e:"Jan van Boendale schrijft dat de joden de waterputten vergiftigd zouden hebben."},{t:"tf",q:"De verklaringen van de flagellanten en van Jan van Boendale zijn standplaatsgebonden.",a:!0,e:"Juist. Ze hangen samen met de middeleeuwse cultuur: het geloof dat God straft, het idee dat de joden verantwoordelijk zijn voor de dood van Jezus."},{t:"tf",q:"Historici denken vandaag nog steeds dat alleen ratten en de rattenvlo de pest verspreidden.",a:!1,e:"Fout. Dat idee wordt verlaten: het is praktisch niet mogelijk."},{t:"mc",q:"Welke nieuwe techniek helpt archeologen en biologen?",o:["DNA-onderzoek","Radio","Satellietbeelden","R\xF6ntgenfoto's van munten"],a:0,e:"Met DNA-onderzoek gaan ze na of de begraven personen aan de pest gestorven zijn."},{t:"mc",q:"Waarom konden vlooien en luizen makkelijk van mens op mens springen?",o:["Mensen sliepen op stro en droegen hun kleding lang","Mensen hielden ratten als huisdier","Mensen wasten zich nooit in badhuizen","Mensen aten rauw vlees"],a:0,e:"Ze reisden ook mee met handelaars in oude kleren en pelzen."},{t:"mc",q:"Wat stoppen pestdokters in de vogelbek van hun masker?",o:["Een mengsel van kruiden en specerijen","Medicijnen tegen vlooien","Wijwater","Niets"],a:0,e:"Deze betaalde vrijwilligers plaatsen zieken in quarantaine."},{t:"mc",q:"Wie is Sint-Rochus?",o:["Een van de vijf pestheiligen","Een snaveldokter uit Rome","Een abt uit Doornik","De doge van Veneti\xEB"],a:0,e:"Hij wordt in de middeleeuwen aanbeden tegen de pest (bron 6)."},{t:"mc",q:"Waar komt het woord 'quarantaine' vandaan?",o:["Venetiaans 'quarantena' = veertig (dagen)","Latijn voor 'ziekte'","De naam van een eiland","De naam van een dokter"],a:0,e:"Veneti\xEB verplicht vanaf 1448 schepen om veertig dagen buiten de haven te blijven."},{t:"mc",q:"Wat beslist Ragusa (Dubrovnik) in 1377?",o:["Handelaars blijven drie weken in isolement op een eiland","De stad sluit voor altijd","Alle joden moeten de stad verlaten","Flagellanten mogen niet meer binnen"],a:0,e:"Zijn ze na die tijd nog in leven, dan vormen ze geen gevaar meer."},{t:"tf",q:"Gilles Le Muisit schreef zijn kroniek tot 1349 helemaal zelf met de hand.",a:!1,e:"Fout. Hij is op dat moment al blind en dicteert zijn werk."},{t:"mc",q:"Wat is een pandemie?",o:["Wereldwijde verspreiding van een besmettelijke ziekte","Een ziekte bij dieren","Een epidemie in \xE9\xE9n stad","Een middeleeuwse boeteprocessie"],a:0,e:"De Zwarte Dood is een pandemie."}],toets:[{k:"Onderzoeksvraag 1\u20133",q:"In welk jaar duikt de pest op in Europa? Wat hebben de getroffen plaatsen gemeenschappelijk? Wanneer bereikt de pest onze streken?",a:["1347.","Het zijn havens en handelsplaatsen: de pest reist mee met de handel.","Onze streken: kijk naar de kleur rond Brugge op de kaart (bron 1) \u2014 rond 1349."],s:"jaar, plaatsen, onze streken"},{k:"Onderzoeksvraag 4",q:"Wat kun je besluiten over de weg die de pest aflegt? Gebruik windrichtingen.",a:["Ze komt van het zuidoosten (Azi\xEB) over zee naar de Middellandse Zee.","Vandaar trekt ze naar het noorden en het noordoosten van Europa, via havens en handelsroutes."],s:"weg van de pest"},{k:"Onderzoeksvraag 5",q:"Welke oorzaken geeft men in de middeleeuwen voor de pest?",a:["Een straf van God (bron 3: flagellanten doen boete).","De joden zouden de waterputten vergiftigd hebben (bron 4)."],s:"middeleeuwse oorzaken"},{k:"Onderzoeksvraag 6 \xB7 KUNNEN 2",q:"Toon aan dat die verklaringen standplaatsgebonden zijn.",a:["Ze hangen samen met de middeleeuwse cultuur: het geloof dat God de mensen straft voor hun slechte gedrag.","En met het middeleeuwse idee dat de joden verantwoordelijk zijn voor de dood van Jezus."],s:"standplaatsgebondenheid"},{k:"Onderzoeksvraag 7\u20138 \xB7 KUNNEN 3",q:"Toon met twee argumenten aan dat de kennis over de Zwarte Dood evolueert. Geef twee verklaringen voor de nieuwe inzichten.",a:["Vroeger: alleen ratten en de rattenvlo. Nu: ook vlooien en luizen van mens op mens, en misschien besmetting via de lucht.","Nieuwe technieken zoals DNA-onderzoek op massagraven (Londen 2011).","Samenwerking van archeologen met andere wetenschappers, zoals biologen."],s:"kennis evolueert"},{k:"Onderzoeksvraag 9",q:"Geef drie manieren waarop men zich in de middeleeuwen en de vroegmoderne tijd probeert te beschermen tegen de pest.",a:["Snaveldokters met een masker vol kruiden en specerijen (bron 5).","Pestheiligen aanbidden, zoals Sint-Rochus (bron 6).","Quarantaine: Ragusa 1377 (drie weken), Veneti\xEB 1448 (veertig dagen) (bron 7)."],s:"bescherming tegen de pest"},{k:"Onderzoeksvraag 10 \xB7 KUNNEN 5",q:"Stel een historische vraag waarop je in dit onderzoek nog geen antwoord kreeg.",a:["Eigen vraag. Controleer: gaat ze over het verleden, en geeft dit onderzoek er geen antwoord op?"],s:"eigen historische vraag"},{k:"KUNNEN 4 \xB7 bron 1",q:"Hoe interpreteer je de kaart van bron 1?",a:["Lees de titel: de geografische verspreiding van de Zwarte Dood in Europa.","Bekijk de schaal (500 km) en de legende: elke kleur is een periode (1347 tot na 1351), groen = beperkte epidemie.","Vergelijk de namen van steden voortdurend met de legende."],s:"kaart lezen"}]},C={bg:"#0f0e17",card:"#1a1926",card2:"#232234",line:"#2e2d3d",txt:"#fffffe",muted:"#a7a9be",ok:"#2cb67d",bad:"#ef4565",warn:"#ff8906",yel:"#ffd803",ink:"#272343"},QN=12,KEY="gesch-"+M.id+"-v1",DAG=["zo","ma","di","wo","do","vr","za"],MND=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"],RITS=[null,{n:"Rit 1 \xB7 Leren",sub:"Rode draad, kernwoorden en woordenschat",ph:[["draad","Rode draad",5],["lees","Lees & markeer",5],["w
