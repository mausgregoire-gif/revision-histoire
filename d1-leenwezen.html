(function(){
var __defProp=Object.defineProperty,__defProps=Object.defineProperties;var __getOwnPropDescs=Object.getOwnPropertyDescriptors;var __getOwnPropSymbols=Object.getOwnPropertySymbols;var __hasOwnProp=Object.prototype.hasOwnProperty,__propIsEnum=Object.prototype.propertyIsEnumerable;var __defNormalProp=(obj,key,value)=>key in obj?__defProp(obj,key,{enumerable:!0,configurable:!0,writable:!0,value}):obj[key]=value,__spreadValues=(a,b)=>{for(var prop in b||(b={}))__hasOwnProp.call(b,prop)&&__defNormalProp(a,prop,b[prop]);if(__getOwnPropSymbols)for(var prop of __getOwnPropSymbols(b))__propIsEnum.call(b,prop)&&__defNormalProp(a,prop,b[prop]);return a},__spreadProps=(a,b)=>__defProps(a,__getOwnPropDescs(b));const{useState,useEffect,useMemo}=React,M={id:"d1",vak:"Geschiedenis",les:"D1",title:"Het leenwezen",pages:"Storia 3, p. 60\u201366",color:"#f5a623",draad:[{t:"Waar gaat deze les over?",p:["Onderdeel D gaat over **West-Europa van 900 tot 1450**.","In de 9e eeuw valt het **Karolingische Rijk** uiteen in kleinere vorstendommen.","Veel historici zien de oorzaak in het **leenwezen** (feodaliteit).","De vragen: wat is feodaliteit, **hoe werkt** het, en wat doet het met de vorstendommen?"]},{t:"1. Vazalliteit",p:["In de vroege middeleeuwen is het **onveilig**.","Rijke grootgrondbezitters nemen armere vrije mannen in **krijgsdienst** om hun bezit te beschermen.","Dat heet **vazalliteit**: een vrije man (de vazal) zweert **trouw** aan een machtigere heer.","De heer zorgt voor zijn **levensonderhoud**, een paard en wapens.","Beide partijen hebben **rechten \xE9n plichten**.",{q:"Wie zweert trouw bij vazalliteit?",o:["De vazal","De heer","De koning"],a:0,e:"De vazal zweert trouw aan een machtigere heer."}]},{t:"1. Van vazalliteit naar feodaliteit",p:["De Frankische koningen geven hun vazallen grond als beloning: een **leen** (Latijn: feodum).","Vazalliteit + leen = **feodaliteit**.","Wie het leen geeft, is de **leenheer**. Wie het krijgt, is de **leenman**.","Eerst belooft de vazal trouw: de **leenhulde**.","Dan geeft de heer een symbool van het leen (een kluit aarde, een handschoen\u2026): de **investituur**.",{q:"Wat komt eerst?",o:["De leenhulde","De investituur"],a:0,e:"Eerst trouw beloven (leenhulde), dan het symbool krijgen (investituur)."}]},{t:"1. Drie soorten lenen",p:["**Grondleen**: meestal een heerlijkheid (een of enkele domeinen).","**Ambtsleen**: een ambt of functie. Een graafschap of hertogdom is een ambtsleen met gebied.","Een functie aan het hof is een **ambtsleen zonder gebied**.","**Geldleen**: elk jaar een som geld, of een recht, zoals **tol heffen**.",{q:"Iemand krijgt het recht om tol te heffen. Welk leen?",o:["Geldleen","Grondleen","Ambtsleen"],a:0},"Sterft de leenman, dan gaat het leen **terug naar de leenheer**.","Later worden lenen **erfelijk**."]},{t:"2. Raad en daad",p:["De leenman helpt zijn heer met **raad en daad**.","Daad = **krijgsdienst**. Vanaf de 13e eeuw maximaal **40 dagen** per jaar.","Daad = ook **geld** in 4 gevallen: oudste zoon wordt ridder, oudste dochter trouwt, kruisvaart, losgeld.","Raad = raad geven bij rechtszaken en **recht spreken** in naam van de heer.","De leenheer geeft het leen, **beschermt** zijn leenman en steunt hem bij rechtszaken.",{q:"Hoeveel dagen krijgsdienst vanaf de 13e eeuw?",o:["40","10","365"],a:0}]},{t:"2. De feodale piramide",p:["Graven en hertogen zijn de rechtstreekse vazallen van de koning: de **kroonvazallen**.","Na Karel de Grote beschermen de koningen hun onderdanen niet tegen de **Vikingen**.","Sommige leenmannen worden **machtiger dan de koning**.","Zij geven zelf lenen aan vazallen: een **piramide**, met de koning bovenaan en vrije boeren onderaan.","De vazal van een vazal is een **achtervazal**. De koning heeft **geen gezag** over hem.","Historici noemen dit een **gelaagde samenleving** met ongelijkheid.",{q:"Heeft de koning gezag over een achtervazal?",o:["Nee","Ja"],a:0,e:"Een overheer heeft geen gezag over de vazallen van zijn vazal."},"In de 11e eeuw heeft iemand soms **meerdere leenheren**: de graaf van Holland is leenman van de Duitse keizer \xE9n van de graaf van Vlaanderen."]},{t:"3. Het leenstelsel keert zich tegen de koningen",p:["9e\u201310e eeuw: de koningen beschermen hun gebied niet tegen **Vikingen en Hongaren**.","De leenmannen voelen zich dan **ontslagen** van hun plichten.","Graven en hertogen zien hun gebied als **eigendom**: bijna onafhankelijke vorstendommen.","**Frankrijk**: van de 9e tot de 12e eeuw is de koning maar een **primus inter pares** (eerste onder gelijken).","**Duitse keizer**: verliest zijn macht in de **13e eeuw**.",{q:"Wanneer verliest de Duitse keizer zijn macht?",o:["13e eeuw","9e eeuw","11e eeuw"],a:0}]},{t:"3. Het erfrecht",p:["Vanaf de 9e eeuw zijn lenen **erfelijk**.","Eerst wordt het leen **gelijk verdeeld** onder de zonen: de vorstendommen worden steeds kleiner.","12e eeuw: **eerstgeboorterecht**. De oudste zoon erft alles.","Geen zonen? Dan erft de **oudste dochter**. Een derde gaat naar de andere kinderen.","Nadeel: het leen wordt **priv\xE9bezit** van de familie. De oorspronkelijke eigenaar verliest het.",{q:"Wie erft alles met het eerstgeboorterecht?",o:["De oudste zoon","Alle zonen samen","De leenheer"],a:0}]}],lees:[{t:"De feodaliteit ontstaat",x:"Bij de [[vazalliteit]] zweert een vrije man trouw aan een machtigere heer. Krijgt de vazal ook een [[leen]], dan spreken we van [[feodaliteit]]. Eerst is er de [[leenhulde]], daarna de [[investituur]].",k:{vazalliteit:"Een gewone vrije man (vazal) zweert trouw aan een rijke heer. In ruil krijgt hij bescherming en levensonderhoud.",leen:"Wat de leenheer aan de vazal geeft (Latijn: feodum): grond, een ambt of geld.",feodaliteit:"Ook leenwezen: systeem waarbij leenmannen hun vazallen een leen geven. Meestal ook een deel van het bestuur en de rechtspraak.",leenhulde:"De plechtigheid waarbij de vazal trouw belooft aan de heer.",investituur:"Plechtige benoeming in een ambt of functie: de heer geeft een symbool van het leen."}},{t:"Drie soorten lenen",x:"Een [[grondleen]] is meestal een [[heerlijkheid]]. Bij een [[ambtsleen]] krijgt de leenman een ambt of functie, zoals een graafschap of [[hertogdom]]. Een [[geldleen]] is een som geld of bijvoorbeeld het recht om tol te heffen.",k:{grondleen:"Een leen dat uit grond bestaat: een of enkele domeinen.",heerlijkheid:"Gebied dat een heer mag besturen in naam van de vorst en waar hij vaak bezittingen heeft. Hij mag er meestal ook rechtspreken.",ambtsleen:"Een ambt of functie als leen. Met gebied: graaf, hertog, markgraaf. Zonder gebied: een functie aan het hof.",hertogdom:"Een ambtsgebied dat een hertog bestuurt.",geldleen:"Jaarlijks een som geld, of een recht zoals tol heffen in een gebied."}},{t:"Een gelaagde samenleving",x:"De leenman staat zijn heer bij met [[raad en daad]]. De graven en hertogen van Karel de Grote zijn [[kroonvazallen]]. De vazallen van een vazal heten [[achtervazallen|achtervazal]]. Zo ontstaat een [[gelaagde samenleving]].",k:{"raad en daad":"Daad: krijgsdienst en geldelijke hulp in vier gevallen. Raad: raad geven bij rechtszaken en recht spreken in naam van de heer.",kroonvazallen:"Rechtstreekse vazallen van de koning, zoals graven en hertogen.",achtervazal:"Vazal van een vazal. De overheer heeft geen gezag over hem.","gelaagde samenleving":"Een samenleving in lagen boven elkaar (de piramide), waarin ongelijkheid heerst."}},{t:"De koning verliest macht",x:"De Franse koning is van de 9e tot de 12e eeuw een [[primus inter pares]]. Hij regeert rechtstreeks alleen over het [[kroondomein]]. In de 12e eeuw maakt het [[eerstgeboorterecht]] de erfenis eenvoudiger, maar lenen worden [[priv\xE9bezit]].",k:{"primus inter pares":"'De eerste onder gelijken': de koning regeert alleen in naam.",kroondomein:"Gebied dat rechtstreeks onder het gezag van de koning staat.",eerstgeboorterecht:"De oudste zoon erft alles; zijn er geen zonen, dan de oudste dochter. Een derde gaat naar de andere kinderen.",priv\u00E9bezit:"Door de erfelijkheid beschouwen families het leen als hun eigendom: het vervreemdt van de oorspronkelijke eigenaar."}}],vocab:[["vazalliteit","Een vrije man zweert trouw aan een machtigere heer, in ruil voor bescherming en levensonderhoud."],["feodum (leen)","Wat de leenheer geeft als beloning: grond, een ambt of geld."],["feodaliteit","Systeem waarbij een leenheer zijn vazallen een leen geeft (ook: leenwezen, leenstelsel)."],["leenheer","De heer die het leen geeft."],["leenman","De vazal die het leen ontvangt."],["leenhulde","Plechtigheid waarbij de vazal trouw belooft aan de heer."],["investituur","De heer geeft een symbool van het leen: kluit aarde, staf, handschoen\u2026"],["heerlijkheid","Gebied dat een heer bestuurt in naam van de vorst; hij spreekt er meestal recht."],["hertogdom","Ambtsgebied (ambtsleen) dat een hertog bestuurt."],["kroonvazal","Rechtstreekse vazal van de koning, zoals een graaf of hertog."],["achtervazal","Vazal van een vazal; de koning heeft geen gezag over hem."],["gelaagde samenleving","Samenleving in lagen boven elkaar, waarin ongelijkheid heerst."]],quiz:[{t:"mc",q:"Wat krijgt een vazal in ruil voor zijn trouw?",o:["Bescherming en levensonderhoud","Een deel van het kroondomein","De titel van graaf","Niets"],a:0,e:"De heer zorgt voor zijn levensonderhoud, een paard en een wapenuitrusting, en beschermt hem."},{t:"mc",q:"Wat is het verschil tussen vazalliteit en feodaliteit?",o:["Bij feodaliteit krijgt de vazal ook een leen","Bij feodaliteit is er geen trouw meer","Feodaliteit bestond alleen bij de Romeinen","Er is geen verschil"],a:0,e:"Feodaliteit = vazalliteit + leen. De Frankische koningen geven domeinen in leen om hun vazallen te vergoeden."},{t:"mc",q:"Hoe heet de plechtigheid waarbij de vazal trouw belooft aan de heer?",o:["Leenhulde","Investituur","Kroning","Eerstgeboorterecht"],a:0,e:"Eerst de leenhulde (trouw beloven), daarna de investituur (symbool van het leen)."},{t:"mc",q:"Wat gebeurt er bij de investituur?",o:["De heer geeft een symbool van het leen","De vazal betaalt losgeld","De vazal trekt ten strijde","De koning wordt gekroond"],a:0,e:"Symbolen zijn bijvoorbeeld een kluit aarde, een staf, een vlag, een scepter, een sleutel of een handschoen."},{t:"mc",q:"Een graaf krijgt een graafschap in leen. Welk soort leen is dat?",o:["Ambtsleen","Grondleen","Geldleen"],a:0,e:"Graafschappen, markgraafschappen en hertogdommen zijn ambtsgebieden: een ambtsleen met gebied."},{t:"mc",q:"Iemand krijgt het recht om tol te heffen in een gebied. Welk soort leen is dat?",o:["Geldleen","Ambtsleen","Grondleen"],a:0,e:"Een geldleen is jaarlijks een som geld of een recht, zoals tol heffen."},{t:"mc",q:"Waaruit bestaat een grondleen meestal?",o:["Een heerlijkheid","Een functie aan het hof","Een jaarlijkse som geld"],a:0,e:"Een grondleen bestaat meestal uit een heerlijkheid van een of enkele domeinen."},{t:"tf",q:"Een ambtsleen heeft altijd een gebied.",a:!1,e:"Fout. Een functie aan het hof is een ambtsleen zonder gebied."},{t:"mc",q:"Vanaf de 13e eeuw is de krijgsdienst van de leenman beperkt tot\u2026",o:["40 dagen","1 jaar","10 dagen","Hij is onbeperkt"],a:0,e:"Vanaf de 13e eeuw: 40 dagen. Later kan men die verplichting afkopen."},{t:"mc",q:"In welk geval hoeft de leenman zijn heer NIET met geld te helpen?",o:["Als de heer een nieuw kasteel bouwt","Als de oudste zoon van de heer ridder wordt","Als de oudste dochter van de heer trouwt","Als de heer op kruisvaart gaat"],a:0,e:"De vier gevallen: oudste zoon wordt ridder, oudste dochter trouwt, kruisvaart, losgeld als de heer krijgsgevangen is."},{t:"tf",q:"De leenheer moet zijn leenman beschermen tegen zijn vijanden.",a:!0,e:"Juist. De leenheer geeft een leen, beschermt hem en steunt hem bij rechtszaken."},{t:"mc",q:"Wat doet de leenman met de 'raad' die hij verschuldigd is?",o:["Hij geeft raad bij rechtszaken en spreekt recht in naam van de heer","Hij beslist over oorlog en vrede","Hij kiest de nieuwe koning","Hij int belastingen voor de paus"],a:0,e:"'Raad en daad': raad bij rechtszaken, en recht spreken in naam van de heer."},{t:"mc",q:"Wie zijn de kroonvazallen?",o:["De rechtstreekse vazallen van de koning","De vazallen van een graaf","De vrije boeren onderaan de piramide","De zonen van de koning"],a:0,e:"Graven en hertogen zijn rechtstreekse vazallen van de koning: kroonvazallen."},{t:"tf",q:"De koning heeft gezag over de achtervazallen.",a:!1,e:"Fout. Een overheer heeft geen gezag over de vazallen van zijn vazal."},{t:"order",q:"Zet de feodale piramide van boven naar onder.",o:["Koning","Kroonvazallen","Achtervazallen","Vrije boeren"],e:"Koning \u2192 kroonvazallen (leenmannen) \u2192 achtervazallen \u2192 \u2026 \u2192 eenvoudige vrije boeren."},{t:"order",q:"Zet in de juiste volgorde.",o:["De vazal belooft trouw (leenhulde)","De heer geeft een symbool van het leen (investituur)","De vazal staat de heer bij met raad en daad"],e:"Eerst de leenhulde, daarna de investituur. Daarna volgen de verplichtingen."},{t:"mc",q:"Waarom verliezen de koningen na Karel de Grote macht?",o:["Ze slagen er niet in hun onderdanen te beschermen tegen invallers","Ze hebben geen vazallen meer nodig","De paus neemt hun land af","De boeren komen in opstand"],a:0,e:"Tegen de Vikingen en de Hongaren bieden ze geen bescherming. Leenmannen achten zich daarom ontslagen van hun verplichtingen."},{t:"tf",q:"Van de 9e tot de 12e eeuw is de Franse koning een 'primus inter pares'.",a:!0,e:"Juist: de eerste onder gelijken, die alleen in naam regeert."},{t:"mc",q:"Wanneer verliest de Duitse keizer zijn macht?",o:["In de 13e eeuw","In de 9e eeuw","In de 11e eeuw","In de 15e eeuw"],a:0,e:"Frankrijk ondergaat de ontwikkeling als eerste; de Duitse keizer verliest zijn macht in de 13e eeuw."},{t:"mc",q:"De graaf van Holland is leenman van de Duitse keizer (voor Holland) en van\u2026",o:["de graaf van Vlaanderen (voor Zeeland)","de Franse koning (voor Zeeland)","de graaf van Bonen","de paus"],a:0,e:"In de 11e eeuw wordt men soms leenman van verschillende leenheren."},{t:"mc",q:"Waarom worden de vorstendommen vanaf de 9e eeuw steeds kleiner?",o:["Lenen worden erfelijk en gelijk verdeeld onder de zonen","De koning neemt land terug","De Vikingen veroveren alles","De Kerk koopt de lenen op"],a:0,e:"Gelijke verdeling onder de zonen werkt de opdeling in kleinere vorstendommen in de hand."},{t:"mc",q:"Wat regelt het eerstgeboorterecht (12e eeuw)?",o:["De oudste zoon erft alles","Alle zonen erven evenveel","Het leen gaat terug naar de leenheer","De jongste zoon erft alles"],a:0,e:"De oudste zoon erft alles. Een derde gaat naar de andere kinderen, die leenhulde doen aan hun oudste broer of zus."},{t:"tf",q:"Als er geen zonen zijn, krijgt de oudste dochter het leen.",a:!0,e:"Juist. Voor de vrouw legt de echtgenoot de leeneed af."},{t:"mc",q:"Wat is het nadeel van erfelijke lenen voor de oorspronkelijke eigenaar?",o:["Het leen vervreemdt: families beschouwen het als priv\xE9bezit","Hij krijgt te veel soldaten","Hij moet meer belastingen betalen","Hij verliest zijn adellijke titel"],a:0,e:"Als generaties van dezelfde familie hetzelfde leen krijgen, beschouwen ze het op den duur als priv\xE9bezit."},{t:"mc",q:"Bron 9 (kaart van Frankrijk, 11e eeuw): wat stel je vast over het kroondomein?",o:["Het is klein vergeleken met de lenen van de kroonvazallen","Het beslaat bijna heel Frankrijk","Het ligt in Vlaanderen","Het is groter dan het huidige Frankrijk"],a:0,e:"De koning regeert rechtstreeks alleen over het kleine kroondomein rond Parijs. De rest heeft hij in leen gegeven.",b:[["Bron 9 \xB7 Het feodale Frankrijk (11e eeuw), kaart","De Franse koning regeert rechtstreeks alleen over het kroondomein: een klein gebied rond Parijs. De rest van Frankrijk (Normandi\xEB, Vlaanderen, Bourgondi\xEB\u2026) heeft hij in leen gegeven aan kroonvazallen."]]},{t:"mc",q:"Bron 4 (1200): Thiebaut geeft Jocelyn de heerlijkheid Gillencourt. Wie is de leenheer?",o:["Thiebaut","Jocelyn","De hertog van Bourgondi\xEB","Walter, de kanselier"],a:0,e:"Thiebaut geeft het leen (leenheer), Jocelyn ontvangt het (leenman). Het is een grondleen.",b:[["Bron 4 \xB7 Paltsgraaf Thiebaut van Troyes, 1200","Thiebaut maakt bekend dat hij aan Jocelyn d'Avalon 'en zijn erfgenamen' de heerlijkheid Gillencourt in leen geeft, nu en in de toekomst. Jocelyn wordt zijn vazal."]]}],toets:[{k:"Lesschema 1",q:`Vul aan.

Vazal \u2192 heer: ____`,a:["vazal = gewone vrije man","heer \u2192 vazal: onderhoud / bescherming","vazal \u2192 heer: (krijgs)dienst","Er zijn rechten \xE9n plichten voor vazal en heer."],s:"vazal en heer (lesschema)"},{k:"Lesschema 1",q:`Vul aan.
Feodaliteit = vazalliteit + ____
Leenheer geeft ____ aan vazal \u2192 vazal wordt ____
____ = plechtigheid / trouw zweren \u2192 investituur`,a:["Feodaliteit = vazalliteit + leen","Leenheer geeft een leen \u2192 vazal wordt leenman","Leenhulde = plechtigheid / trouw zweren \u2192 investituur (symbool van het leen)"],s:"leen, leenhulde, investituur (lesschema)"},{k:"Lesschema 1",q:`Vul aan.
Verschillende soorten diensten \u2192 verschillende soorten ____
Ambtsleen met gebied: ____, hertog, markgraaf
Na ____ \u2192 leen terug naar leenheer. Later: lenen ____`,a:["Verschillende soorten lenen","Ambtsleen met gebied: graaf, hertog, markgraaf (\u2192 kroonvazallen); zonder gebied: hofambtenaar","Ook grondleen en geldleen","Na de dood van de leenman \u2192 leen terug naar de leenheer. Later: lenen erfelijk"],s:"soorten lenen (lesschema)"},{k:"Lesschema 2",q:`Vul aan.
Leenman staat leenheer bij met '____ en daad'.
Raad: raadsheer of rechtspreken in ____ van de heer.
Leenheer staat leenman bij: bescherming tegen ____, ____ bij rechtszaken.`,a:["'Raad en daad'","Daad: krijgsdienst (vanaf 13e eeuw 40 dagen) en geldelijke hulp in 4 gevallen","Raad: rechtspreken in naam van de heer","Leenheer: bescherming tegen vijanden, steun bij rechtszaken"],s:"raad en daad (lesschema)"},{k:"Lesschema 2\u20133",q:`Vul aan.
Feodale piramide \u2192 ____ samenleving \u2192 ongelijkheid.
Na Karel de Grote beschermen koningen hun ____ niet tegen Vikingen.
Franse koning verliest macht: ____ eeuw. Duitse keizer: ____ eeuw.`,a:["Gelaagde samenleving","Koningen beschermen hun onderdanen niet \u2192 leenmannen worden machtiger dan de koning","Frankrijk: 9e tot 12e eeuw (primus inter pares)","Duitse keizer: 13e eeuw"],s:"piramide en machtsverlies (lesschema)"},{k:"Lesschema 3",q:`Vul aan.
