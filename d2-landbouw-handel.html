(function(){
var __defProp=Object.defineProperty,__defProps=Object.defineProperties;var __getOwnPropDescs=Object.getOwnPropertyDescriptors;var __getOwnPropSymbols=Object.getOwnPropertySymbols;var __hasOwnProp=Object.prototype.hasOwnProperty,__propIsEnum=Object.prototype.propertyIsEnumerable;var __defNormalProp=(obj,key,value)=>key in obj?__defProp(obj,key,{enumerable:!0,configurable:!0,writable:!0,value}):obj[key]=value,__spreadValues=(a,b)=>{for(var prop in b||(b={}))__hasOwnProp.call(b,prop)&&__defNormalProp(a,prop,b[prop]);if(__getOwnPropSymbols)for(var prop of __getOwnPropSymbols(b))__propIsEnum.call(b,prop)&&__defNormalProp(a,prop,b[prop]);return a},__spreadProps=(a,b)=>__defProps(a,__getOwnPropDescs(b));const{useState,useEffect,useMemo}=React,M={id:"d2",vak:"Geschiedenis",les:"D2",title:"Landbouw, handel en nijverheid",pages:"Storia 3, p. 67\u201372",color:"#7bc950",draad:[{t:"Waar gaat deze les over?",p:["Vandaag kopen we ons voedsel in winkels en op markten. De vragen van deze les: hoe komen mensen in de middeleeuwen aan voedsel? Wat kopen ze via de handel? Hoe verlopen landbouw en handel in de middeleeuwen?"]},{t:"1. Landbouw in de vroege middeleeuwen",p:["In de vroege middeleeuwen (500\u2013900) is West-Europa grotendeels bebost. Mensen wonen op open plekken, die ze als landbouwgrond gebruiken.","In het zuiden overheerst het Romeinse landbouwmodel: graanvelden, wijn- en olijfgaarden. In het Germaanse noorden overweegt de veeteelt.","De voorraden worden aangevuld met bosvruchten, jacht en visvangst. De kloosterorden verspreiden het Romeinse model, dat zich vermengt met de Germaanse methode."]},{t:"1. Ontginningen",p:["Tussen de 10e en de 13e eeuw stijgt de bevolking snel. Om iedereen te voeden, moet er meer landbouwgrond komen.","Er worden nieuwe akkers ontgonnen rond de open plekken in het bos. Dat blijft vaak beperkt, omdat de plaatselijke heren hun jachtgebied niet graag opgeven.","Men zoekt andere terreinen: moerassen worden drooggelegd, dijken gebouwd en polders in cultuur gebracht. De Vlaamse kustvlakte is zo sterk door de mens gevormd.","Op de schorren worden schapen gehouden. Hun wol is de grondstof voor de textielnijverheid die het beroemde Vlaamse laken maakt."]},{t:"1. De kolonisatiegolf naar het oosten",p:["Ten oosten van de Elbe veroveren Duitse vorsten en een ridderorde in de 12e en 13e eeuw gebieden op de Slavische volkeren.","Moerassige gronden moeten er drooggelegd worden. Vlamingen en Hollanders hebben daar veel ervaring mee, dus komt er een kolonisatiegolf naar het 'Oostland' op gang.","Gevolgen: de opbrengsten stijgen en er is zelfs graanuitvoer mogelijk. Onze streken voeren goedkoop Oostzeegraan in. Daarom schakelen veel Vlaamse boeren gedeeltelijk over op vlasteelt; vlas wordt in de textielnijverheid gebruikt om linnen te maken."]},{t:"2. Vernieuwende technieken",p:["Het meeste werk gebeurt met de hand of met primitieve houten werktuigen. Metaal is zeldzaam op het platteland: vaak zijn alleen de sikkel of de pik van ijzer.","Tussen de 10e en de 13e eeuw raken nieuwe technieken in gebruik: het drieslagstelsel, de karploeg, het hoefijzer en de dorsvlegel. Daarnaast de gareelbespanning.","De kloosterorden stimuleren de technische vooruitgang. Door hen raken water- en windmolens snel verspreid."]},{t:"2. Drieslagstelsel en karploeg",p:["Vroeger moest de boer elk jaar de helft van zijn grond braak laten liggen om te herstellen. Bij het drieslagstelsel verdeelt hij zijn grond in drie slagen: wintergraan, zomergraan en braak. Zo gebruikt hij twee derde van zijn velden in plaats van de helft.","De kleine houten ploeg kan de grond alleen ondiep bewerken; de zware kleigronden in het noorden zijn moeilijk. De karploeg staat op twee wielen. De metalen ploegschaar snijdt de grond open en de rister keert hem, zodat hij beter verlucht wordt.","De karploeg is zwaar om te draaien. Daarom maakt men de akkers smaller en langer. Paarden, ossen en zelfs koeien dienen als trekdieren."]},{t:"2. Gareel, hoefijzer, dorsvlegel",p:["De gareelbespanning verplaatst de druk van de nek naar de schouders: het paard trekt makkelijker. Het hoefijzer geeft het paard een beter houvast op de grond.","De boer besteedt driekwart van zijn werktijd aan dorsen. De dorsvlegel maakt dat werk veel lichter.","Toch blijft de voedselproductie laag: gemiddeld oogst men maar drie \xE0 vier keer meer dan men gezaaid heeft. Een misoogst is dramatisch. De voeding is eenzijdig (vooral brood), vlees eet men zelden. Dat verzwakt het lichaam en maakt mensen vatbaar voor ziekten."]},{t:"3. Handel in de vroege middeleeuwen",p:["Na de val van het West-Romeinse Rijk is de handel in West-Europa beperkt. Mensen leven ge\xEFsoleerd in kleine landbouwnederzettingen.","Alleen aan de kusten van de Noordzee, de Oostzee en de Middellandse Zee is er wat handel, bijvoorbeeld via Italiaanse havensteden (Genua, Pisa, Veneti\xEB) waar luxeproducten uit het Oosten binnenkomen: specerijen, zijde, reukwaren.","In de 8e eeuw is er met het Karolingische rijk een tijdelijke heropleving, gedomineerd door Friezen en Noormannen. Plundertochten van Noormannen, islamieten en Magyaren verstoren die handel."]},{t:"3. Heropleving en jaarmarkten",p:["In de 10e eeuw keert de rust grotendeels weer. Een beter klimaat en betere technieken leiden tot overschotten, die op kleine markten verkocht worden. Steden worden centra van handel en nijverheid.","Kooplui drijven handel over steeds grotere afstand, vooral tussen Noordwest-Europa en (Noord-)Itali\xEB. De Italianen brengen oosterse producten; kooplui uit Noordwest-Europa verhandelen onder andere hout en textiel.","Ze ontmoeten elkaar halfweg: op de jaarmarkten van de Champagne. In de 12e en 13e eeuw is de Champagne het centrum van de internationale handel in Europa."]},{t:"3. Nadelen en nieuwe routes",p:["De transcontinentale handel heeft nadelen: slechte wegen verhinderen een vlot transport van veel goederen tegelijk, struikrovers maken de wegen onveilig, en allerhande tolheffingen maken grote winsten moeilijk.","Kooplui zoeken nieuwe routes over zee. Aan het einde van de 13e eeuw pendelen de eerste schepen tussen Itali\xEB en enkele Noordzeehavens.","De steden van de Champagne verliezen hun belang. Brugge, Londen en L\xFCbeck groeien uit tot nieuwe internationale handelscentra."]}],lees:[{t:"Ontginningen",x:"De bevolking groeit, dus volgen [[ontginningen|ontginning]]: bossen, moerassen en [[polders|polder]]. Op de [[schorren|schorre]] lopen schapen. In het oosten komt een [[kolonisatiegolf]] op gang.",k:{ontginning:"Nieuwe landbouwgrond maken van bos of moeras.",polder:"Drooggelegd land achter dijken, in cultuur gebracht.",schorre:"Stuk land bij een zee of rivier dat alleen bij springtij overstroomt.",kolonisatiegolf:"Plotse verhuis van een redelijk grote groep mensen van \xE9\xE9n land naar een ander om daar blijvend te wonen."}},{t:"Nieuwe technieken",x:"Bij het [[drieslagstelsel]] ligt nog maar een derde [[braak]]. De [[karploeg]] heeft een [[rister]] die de grond keert. De [[gareelbespanning]] helpt het paard, de [[dorsvlegel]] helpt bij het [[dorsen]].",k:{drieslagstelsel:"Grond in drie slagen: wintergraan, zomergraan, braak. Zo gebruikt de boer twee derde in plaats van de helft.",braak:"Grond die een jaar niet bebouwd wordt, zodat hij zich kan 'herstellen'.",karploeg:"Zware ploeg op twee wielen met een metalen ploegschaar en een rister.",rister:"Het onderdeel van een ploeg dat de grond omkeert.",gareelbespanning:"Tuig dat de druk van de nek naar de schouders verplaatst: het paard trekt makkelijker.",dorsvlegel:"Werktuig om te dorsen; maakt het werk veel lichter.",dorsen:"Korrels van zaden uit een gewas slaan. De boer besteedt er driekwart van zijn werktijd aan."}},{t:"De handel herleeft",x:"Na de invallen van onder meer de [[Magyaren]] keert in de 10e eeuw de rust weer. Italiaanse kooplui brengen [[specerijen, zijde en reukwaren|oosterse producten]]. Noord en zuid ontmoeten elkaar op de [[jaarmarkten]] van de [[Champagne]].",k:{Magyaren:"Centraal-Aziatische nomadenstammen die in de 8e en 9e eeuw Europa teisteren. Ze vestigen zich uiteindelijk in het huidige Hongarije.","oosterse producten":"Luxeproducten uit het Oosten, ingevoerd via Italiaanse havensteden zoals Genua, Pisa en Veneti\xEB.",jaarmarkten:"Grote markten waar kooplui uit Noordwest-Europa en Itali\xEB elkaar ontmoeten.",Champagne:"Frans vorstendom halfweg tussen Itali\xEB en Noordwest-Europa; in de 12e en 13e eeuw centrum van de internationale handel."}},{t:"Het verval van de Champagne",x:"De [[transcontinentale]] handel heeft drie nadelen: [[slechte wegen]], [[struikrovers]] en [[tolheffingen]]. Daarom kiezen kooplui de [[zeeroute]].",k:{transcontinentale:"Over het continent (werelddeel), dus over land.","slechte wegen":"Ze verhinderen een vlot transport van veel goederen tegelijk.",struikrovers:"Ze maken de wegen onveilig.",tolheffingen:"Allerhande tollen maken het moeilijk om grote winsten te maken.",zeeroute:"Einde 13e eeuw: schepen tussen Itali\xEB en Noordzeehavens. Brugge, Londen en L\xFCbeck worden handelscentra."}}],vocab:[["ontginning","Nieuwe landbouwgrond maken van bos of moeras."],["polder","Drooggelegd land achter dijken, in cultuur gebracht."],["schorre","Land bij zee of rivier dat alleen bij springtij overstroomt."],["kolonisatiegolf","Een grote groep mensen verhuist naar een ander land om er blijvend te wonen."],["drieslagstelsel","Grond in drie delen: wintergraan, zomergraan en braak."],["braak","Grond die een jaar niet bebouwd wordt om te herstellen."],["karploeg","Zware ploeg op twee wielen met metalen ploegschaar en rister."],["rister","Onderdeel van de ploeg dat de grond omkeert."],["gareelbespanning","Tuig dat de druk van de nek naar de schouders van het paard verplaatst."],["dorsen","Korrels van zaden uit een gewas slaan."],["jaarmarkt","Grote markt in de Champagne waar kooplui uit noord en zuid elkaar ontmoeten."],["transcontinentaal","Over het continent (werelddeel), dus over land."]],quiz:[{t:"mc",q:"Waarom worden tussen de 10e en de 13e eeuw nieuwe gronden ontgonnen?",o:["De bevolking stijgt snel","Het klimaat wordt kouder","De heren willen meer jachtgebied","De handel valt stil"],a:0,e:"Om meer mensen te voeden, moet er meer landbouwgrond komen."},{t:"mc",q:"Welke drie soorten ontginningen noemt de les?",o:["Akkers in het bos, moerassen droogleggen, polders achter dijken","Wijngaarden, olijfgaarden, graanvelden","Steden, wegen, kastelen","Mijnen, groeven, bossen planten"],a:0,e:"Nieuwe akkers rond open plekken in het bos, drooggelegde moerassen, en dijken en polders."},{t:"tf",q:"De plaatselijke heren geven hun bossen graag op voor nieuwe akkers.",a:!1,e:"Fout. De ontginningen in het bos blijven beperkt omdat de heren hun jachtgebied niet graag opgeven."},{t:"mc",q:"Waarvoor worden de schorren aan de Vlaamse kust gebruikt?",o:["Schapenteelt, voor wol","Wijnbouw","Graanteelt","Jacht"],a:0,e:"De wol is de grondstof voor het beroemde Vlaamse laken."},{t:"mc",q:"Waarom trekken Vlamingen en Hollanders naar het 'Oostland'?",o:["Ze hebben ervaring met het droogleggen van moerassen","Ze vluchten voor de Vikingen","Ze willen er steden stichten","De paus stuurt hen"],a:0,e:"Ten oosten van de Elbe moeten moerassige gronden drooggelegd worden: daar zijn zij goed in."},{t:"mc",q:"Welk gevolg heeft de kolonisatie in het oosten voor Vlaanderen?",o:["Goedkoop Oostzeegraan, dus boeren schakelen deels over op vlas","Vlaanderen verliest al zijn boeren","Vlaanderen gaat olijven telen","Er komt hongersnood"],a:0,e:"Goedkoop Oostzeegraan wordt ingevoerd. Vlaamse boeren telen meer vlas, voor linnen."},{t:"mc",q:"Hoeveel van zijn velden gebruikt een boer met het drieslagstelsel?",o:["Twee derde","De helft","Een derde","Alles"],a:0,e:"Vroeger lag de helft braak; nu nog maar een derde."},{t:"mc",q:"Welke drie 'slagen' heeft het drieslagstelsel?",o:["Wintergraan, zomergraan, braak","Graan, wijn, olijven","Akker, weide, bos","Vlas, wol, graan"],a:0,e:"Afwisselend verbouwt de boer op de slagen winter- en zomergraan; \xE9\xE9n slag ligt braak."},{t:"mc",q:"Wat doet de rister van de karploeg?",o:["Hij keert de grond om","Hij trekt de ploeg vooruit","Hij maait het graan","Hij houdt de wielen recht"],a:0,e:"Daardoor wordt de grond beter verlucht."},{t:"mc",q:"Waarom worden de akkers smaller en langer?",o:["De karploeg is zwaar om te draaien","Er is minder grond","Dat is mooier","De heren eisen het"],a:0,e:"Zo moet men de zware karploeg minder vaak draaien."},{t:"mc",q:"Wat doet de gareelbespanning?",o:["De druk gaat van de nek naar de schouders van het paard","Het paard krijgt ijzeren hoeven","De ploeg krijgt wielen","Het graan wordt sneller gedorst"],a:0,e:"Het paard kan zo veel makkelijker trekken. Het hoefijzer geeft het dan weer meer houvast."},{t:"mc",q:"Waaraan besteedt de boer driekwart van zijn werktijd?",o:["Dorsen","Ploegen","Zaaien","Jagen"],a:0,e:"De dorsvlegel maakt dat werk veel lichter."},{t:"tf",q:"Op het platteland zijn de meeste werktuigen van metaal.",a:!1,e:"Fout. Metaal is zeldzaam: vaak zijn alleen de sikkel of de pik van ijzer."},{t:"mc",q:"Hoeveel oogst een middeleeuwse boer gemiddeld?",o:["Drie \xE0 vier keer meer dan hij gezaaid heeft","Tien keer meer","Evenveel als hij gezaaid heeft","Twintig keer meer"],a:0,e:"De voedselproductie blijft laag; een misoogst is dramatisch."},{t:"tf",q:"De meeste mensen in de middeleeuwen eten vaak vlees.",a:!1,e:"Fout. De voeding is eenzijdig (grotendeels brood); vlees eet men zelden of nooit."},{t:"mc",q:"Wie stimuleert de technische vooruitgang en verspreidt water- en windmolens?",o:["De kloosterorden","De kooplui","De Magyaren","De koningen"],a:0,e:"Door de kloosterorden raken water- en windmolens snel verspreid."},{t:"mc",q:"Welke producten komen via de Italiaanse havensteden uit het Oosten?",o:["Specerijen, zijde, reukwaren","Hout en textiel","Graan en vlas","Wol en laken"],a:0,e:"Luxeproducten uit het Oosten komen binnen via Genua, Pisa, Veneti\xEB\u2026"},{t:"mc",q:"Wat verhandelen de kooplui uit Noordwest-Europa vooral?",o:["Hout en textiel","Specerijen","Zijde","Olijfolie"],a:0,e:"Zij verhandelen onder andere hout en textiel; de Italianen brengen oosterse producten."},{t:"mc",q:"Waarom worden de jaarmarkten van de Champagne zo belangrijk?",o:["De Champagne ligt halfweg tussen Itali\xEB en Noordwest-Europa","Er is veel wijn","De koning woont er","Er liggen zeehavens"],a:0,e:"Handelaars uit noord en zuid ontmoeten elkaar daar halfweg."},{t:"mc",q:"Welke reden is GEEN nadeel van de transcontinentale handel uit de les?",o:["Er zijn te weinig kooplui","Slechte wegen","Struikrovers","Allerhande tolheffingen"],a:0,e:"De drie nadelen: slechte wegen, struikrovers en tolheffingen."},{t:"mc",q:"Wat is de belangrijkste reden voor het verval van de jaarmarkten van de Champagne?",o:["Nieuwe handelsroutes over zee","Een pestepidemie","Een oorlog met Itali\xEB","De Kerk verbiedt handel"],a:0,e:"Einde 13e eeuw pendelen schepen tussen Itali\xEB en de Noordzeehavens."},{t:"mc",q:"Welke steden worden daarna internationale handelscentra?",o:["Brugge, Londen en L\xFCbeck","Genua, Pisa en Veneti\xEB","Parijs, Troyes en Lyon","Gent, Ieper en Kortrijk"],a:0,e:"Noord-Europese havensteden groeien uit tot nieuwe internationale handelscentra."},{t:"order",q:"Zet in de juiste volgorde.",o:["Friezen en Noormannen domineren de handel (8e eeuw)","De handel herleeft na de invallen (10e eeuw)","De Champagne is het handelscentrum (12e\u201313e eeuw)","Schepen varen tussen Itali\xEB en de Noordzee (einde 13e eeuw)"],e:"Van de Karolingische heropleving tot de nieuwe zeeroute."},{t:"mc",q:"Bron 8: hoe hindert Landry de Dikke de kooplieden?",o:["Hij neemt hun koopwaar af en laat hen tol betalen","Hij verbiedt hun markten","Hij verhoogt de prijs van graan","Hij sluit de havens"],a:0,e:"Hij houdt de kooplui van Langres vast, neemt hun koopwaar af, en heft daarna tol op wie door zijn land trekt."},{t:"mc",q:"Bron 8: wie probeert de belangen van de handelaars te beschermen?",o:["De bisschop van Langres en de monniken van Cluny","De koning van Frankrijk","Joan Evans","De kooplui zelf"],a:0,e:"Zij vragen genoegdoening, en de monniken van Cluny kopen de tol af om reizigers veiligheid te verzekeren."}],toets:[{k:"KENNEN 1",q:"Leg uit: drieslagstelsel, jaarmarkten, transcontinentaal.",a:["Drieslagstelsel: grond in drie slagen (wintergraan, zomergraan, braak); twee derde wordt gebruikt.","Jaarmarkten: grote markten in de Champagne waar kooplui uit noord en zuid elkaar ontmoeten.","Transcontinentaal: over het continent (over land)."],s:"begrippen"},{k:"KENNEN 2",q:"Beschrijf de landbouw in de vroege middeleeuwen.",a:["West-Europa is grotendeels bebost; men werkt op open plekken.","Zuiden: Romeins model (graan, wijn, olijven). Noorden: vooral veeteelt.","Aangevuld met bosvruchten, jacht en visvangst. Kloosters verspreiden het Romeinse model."],s:"landbouw vroege middeleeuwen"},{k:"KENNEN 3",q:"Geef de oorzaak van de ontginningen en noem de drie soorten.",a:["Oorzaak: de bevolking stijgt snel (10e\u201313e eeuw), er is meer voedsel nodig.","Nieuwe akkers rond open plekken in het bos.","Moerassen droogleggen.","Dijken bouwen en polders in cultuur brengen."],s:"ontginningen"},{k:"KENNEN 4",q:"Geef een oorzaak en twee gevolgen van de kolonisatie naar het oosten.",a:["Oorzaak: moerassige gronden ten oosten van de Elbe moeten drooggelegd worden; Vlamingen en Hollanders hebben daar ervaring mee.","Gevolg 1: de opbrengsten stijgen, graanuitvoer wordt mogelijk (goedkoop Oostzeegraan).","Gevolg 2: Vlaamse boeren schakelen gedeeltelijk over op vlasteelt (linnen)."],s:"kolonisatie naar het oosten"},{k:"KENNEN 5",q:"Leg vijf vernieuwende landbouwtechnieken uit.",a:["Drieslagstelsel: twee derde van de grond gebruikt in plaats van de helft.","Karploeg: op wielen, metalen ploegschaar, rister keert de grond.","Gareelbespanning: druk van nek naar schouders, paard trekt makkelijker.","Hoefijzer: beter houvast op de grond.","Dorsvlegel: dorsen wordt lichter."],s:"vijf technieken"},{k:"KENNEN 6\u20137",q:"Leg de herleving van de handel in de 10e eeuw uit, en het ontstaan van de jaarmarkten in de Champagne.",a:["Rust na de invallen, beter klimaat, betere technieken \u2192 overschotten \u2192 markten; steden worden centra van handel en nijverheid.","Handel tussen Noordwest-Europa (hout, textiel) en Itali\xEB (oosterse producten).","Ze ontmoeten elkaar halfweg: in de Champagne (12e\u201313e eeuw centrum van de internationale handel)."],s:"handel en jaarmarkten"},{k:"KENNEN 8\u20139",q:"Noem de drie nadelen van de transcontinentale handel en de belangrijkste reden voor het verval van de jaarmarkten.",a:["Slechte wegen, struikrovers, allerhande tolheffingen.","Verval: nieuwe handelsroutes over zee (einde 13e eeuw schepen tussen Itali\xEB en de Noordzeehavens)."],s:"nadelen handel en verval Champagne"},{k:"Bron 2\u20133",q:"Welke verschillen zie je tussen de schuifploeg en de karploeg? Wat zijn de voordelen van de karploeg?",a:["Schuifploeg: klein, van hout, zonder wielen; bewerkt de grond alleen ondiep.","Karploeg: op twee wielen, metalen ploegschaar, rister; getrokken door dieren.","Voordelen: de grond wordt dieper bewerkt en omgekeerd (beter verlucht); geschikt voor zware kleigrond."],s:"bron 2\u20133 ploegen"},{k:"Bron 1",q:"Piers Plowman (14e eeuw): over welk voedsel beschikt hij? Waaruit blijkt dat hij niet zeker is van de oogst?",a:["Kazen, wrongel en room, haverkoek, bonen- en zemelenbroden, peterselie, sjalotten en kool (en een koe met kalf).","Hij 'hoopt' de oogst te maaien rond Sint-Petrusbanden (1 augustus); tot dan moet hij het met schamele dingen stellen."],s:"bron 1 Piers Plowman"},{k:"Bron 8",q:"Is bron 8 betrouwbaar om vragen over de middeleeuwse handel te beantwoorden? Waarom twijfel je?",a:["Joan Evans (1957) is een geschiedkundige, maar ze geeft geen verdere informatie over Landry de Dikke.","Men weet niet zeker wie hij was (mogelijk Landry le Gros de Brancion, 11e eeuw).","Daarom is voorzichtigheid nodig: vergelijk met andere bronnen."],s:"bron 8 betrouwbaarheid
