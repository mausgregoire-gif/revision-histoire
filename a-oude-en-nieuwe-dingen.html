(function(){
var __defProp=Object.defineProperty,__defProps=Object.defineProperties;var __getOwnPropDescs=Object.getOwnPropertyDescriptors;var __getOwnPropSymbols=Object.getOwnPropertySymbols;var __hasOwnProp=Object.prototype.hasOwnProperty,__propIsEnum=Object.prototype.propertyIsEnumerable;var __defNormalProp=(obj,key,value)=>key in obj?__defProp(obj,key,{enumerable:!0,configurable:!0,writable:!0,value}):obj[key]=value,__spreadValues=(a,b)=>{for(var prop in b||(b={}))__hasOwnProp.call(b,prop)&&__defNormalProp(a,prop,b[prop]);if(__getOwnPropSymbols)for(var prop of __getOwnPropSymbols(b))__propIsEnum.call(b,prop)&&__defNormalProp(a,prop,b[prop]);return a},__spreadProps=(a,b)=>__defProps(a,__getOwnPropDescs(b));const{useState,useEffect,useMemo}=React,M={id:"a",vak:"Geschiedenis",les:"A",title:"Over oude en nieuwe dingen",pages:"Storia 3, p. 8\u201313",color:"#4db6ac",draad:[{t:"Waar gaat deze les over?",p:["Geschiedenis is de wetenschap die het verleden bestudeert. Historisch denken is een methode om dat te doen.","Het bestaat uit vijf onderdelen: vragen stellen, situeren, werken met bronnen, een beeld vormen, en nadenken over de relatie tussen verleden, heden en toekomst."]},{t:"1. Vragen stellen",p:["Historisch denken start met een historische vraag. Een historische vraag is gericht op het menselijke verleden. Er zijn vier soorten:","A. Vragen over het verleden. Voorbeeld: waarom bouwen de oude Egyptenaren piramides?","B. Vragen over de relatie tussen heden en verleden. Voorbeeld: op welke wijze verschilt de Atheense democratie van de hedendaagse democratie in Belgi\xEB?","C. Vragen over hoe we tot kennis over het verleden komen. Voorbeeld: hoe komen we aan onze informatie over de neanderthaler?","D. Vragen over het beeld dat we over iets uit het verleden hebben. Voorbeeld: klopt het beeld dat Julius Caesar van de Belgae schetst?"]},{t:"2. Situeren in de tijd",p:["Het referentiekader is een schema dat je helpt om je te ori\xEBnteren in het verleden. Het deelt zaken in volgens tijd, ruimte (plaats) en maatschappelijk domein.","Hulpmiddelen voor de tijd: jaar, eeuw, millennium. We gebruiken de christelijke tijdrekening (de geboorte van Christus = jaar 1); er zijn ook andere, zoals de islamitische en de joodse.","Het westerse verleden wordt ingedeeld in zeven tijden: prehistorie, oude nabije oosten (vanaf \xB13500 v.C.), klassieke oudheid (\xB1800 v.C.), middeleeuwen (\xB1500), vroegmoderne tijd (\xB11450), moderne tijd (\xB11750) en hedendaagse tijd (1945).","Een belangrijke verandering laat vaak een nieuwe periode beginnen: een breuk. Zaken die hetzelfde blijven, noemen we continu\xEFteit. Elke tijdrekening en indeling is kunstmatig: een afspraak tussen geleerden."]},{t:"2. Ruimte en maatschappelijke domeinen",p:["Gebeurtenissen vinden plaats in een ruimte: een werelddeel, een gebied (de Balkan), een land, een streek (de Kempen), een stad of gemeente, een wijk. De wereld in zijn geheel noemen we mondiaal of wereldwijd.","Er zijn ook verschillen tussen stedelijke en landelijke (rurale) omgevingen, continentale en maritieme samenlevingen, centrum en rand, open en gesloten landschappen.","Menselijke activiteiten delen we in vier maatschappelijke domeinen in. Politiek: het bestuur, wie macht heeft. Economisch: hoe mensen overleven en een inkomen verwerven. Sociaal: hoe groepen en mensen samenleven. Cultureel: kunst, godsdienst, wetenschap, techniek, onderwijs, sport en gewoonten."]},{t:"3. Bronnen kritisch gebruiken",p:["De antwoorden op een historische vraag zoek je in bronnen. Een primaire bron is gemaakt door iemand die rechtstreeks betrokken is, bijvoorbeeld een ooggetuige. Een secundaire bron is gemaakt door iemand die niet rechtstreeks betrokken is, vaak in een andere tijd.","Ook de context van een bron is belangrijk: wie maakte ze, waar, wanneer, waarom en hoe is ze ontstaan?","Kritische vragen: is de bron bruikbaar om de vraag te beantwoorden? Is ze betrouwbaar? Daarbij speelt standplaatsgebondenheid: de maker kan be\xEFnvloed zijn door leeftijd, geslacht, woonplaats, afkomst, opleiding, overtuigingen, godsdienst\u2026 Voor wie is de bron bedoeld, en met welke bedoeling (informeren, overtuigen, ontspannen, ontroeren, activeren)?","Representativiteit: is de bron typisch voor haar tijd en omgeving, of wijkt ze ervan af? Gebruik altijd meer dan \xE9\xE9n bron."]},{t:"3. Een kaart bestuderen",p:["Historische kaarten zijn speciale bronnen. Zo bestudeer je een kaart:","1. Lees de titel: over welke tijd, welk gebied, welk onderwerp gaat het? 2. Welke schaal heeft de kaart? 3. Raadpleeg de legende: wat betekent elk symbool? 4. De bovenkant is meestal het noorden.","Kijk naar de kaart, lees de namen en vergelijk voortdurend met de legende."]},{t:"4. Een historisch beeld vormen",p:["Geschiedenis is een reconstructie van het verleden. Over sommige periodes weten we weinig door het gebrek aan bronnen. Een nieuwe bron of een andere interpretatie kan onze kennis veranderen. Gebruik en vergelijk dus zoveel mogelijk bronnen.","Geschiedkundigen gebruiken typische redeneerwijzen: aanleiding, oorzaak, gevolg, toeval, evolutie, revolutie, continu\xEFteit en verandering.","Historische beelden kloppen vaak niet omdat ze de zaken te simpel of stereotiep voorstellen. In films, boeken, strips en games gedragen figuren zich vaak als hedendaagse mensen."]},{t:"5. Verleden, heden en toekomst",p:["Iedereen kijkt vanuit zijn eigen perspectief naar het heden en het verleden: dat is standplaatsgebondenheid. Onze vragen en beelden worden be\xEFnvloed door onze achtergrond (afkomst, studies, interesses, idee\xEBn).","Voorbeeld (bron 8\u20139): Julius Caesar noemt de Belgae de dappersten van alle Galli\xEBrs. Hij wil zijn successen ophemelen en stelt zijn vijanden heel dapper voor om zijn overwinning groter te laten lijken.","Het prentenboek ''s Lands Glorie' (1949\u20131961) neemt dat beeld over zonder rekening te houden met die context. Het is gebaseerd op een nationalistisch werk dat de belangrijkheid van Belgi\xEB en de Belgen wil aantonen."]}],lees:[{t:"Het referentiekader",x:"Een [[historische vraag]] situeer je met het [[referentiekader]]: tijd, ruimte en de vier [[maatschappelijke domeinen|maatschappelijk domein]]. Een grote verandering is een [[breuk]]; wat blijft is [[continu\xEFteit]].",k:{"historische vraag":"Een vraag gericht op het menselijke verleden. Vier soorten: over het verleden, over heden en verleden, over hoe we kennis krijgen, over ons beeld.",referentiekader:"Schema om je te ori\xEBnteren in het verleden: tijd, ruimte en maatschappelijk domein.","maatschappelijk domein":"Politiek (bestuur, macht), economisch (overleven, inkomen), sociaal (samenleven), cultureel (kunst, godsdienst, wetenschap\u2026).",breuk:"Een belangrijke verandering waardoor een nieuwe periode begint.",continu\u00EFteit:"Zaken die hetzelfde blijven."}},{t:"Bronnen",x:"Een [[primaire bron]] of een [[secundaire bron]] beoordeel je op [[bruikbaarheid]], [[betrouwbaarheid]] en [[representativiteit]].",k:{"primaire bron":"Gemaakt door iemand die rechtstreeks betrokken is, bijvoorbeeld een ooggetuige.","secundaire bron":"Gemaakt door iemand die niet rechtstreeks betrokken is, vaak in een andere tijd.",bruikbaarheid:"Is de bron bruikbaar om de historische vraag te beantwoorden?",betrouwbaarheid:"Is de bron betrouwbaar? Let op standplaatsgebondenheid, doelpubliek en bedoeling van de maker.",representativiteit:"Is de bron typisch voor haar tijd en omgeving, of wijkt ze ervan af?"}},{t:"Beelden van het verleden",x:"Geschiedenis is een [[reconstructie]]. Historische beelden zijn vaak een [[stereotiep]]. Iedereen kijkt vanuit een [[perspectief]]: dat is [[standplaatsgebondenheid]]. ''s Lands Glorie' is [[nationalisme|nationalistisch]].",k:{reconstructie:"Iets wat op basis van bronnen nagebouwd, nagetekend of nagespeeld is; het verleden zoals het op basis van bronnen verteld wordt.",stereotiep:"Clich\xE9: steeds dezelfde omschrijving voor iets gebruiken.",perspectief:"Standpunt van waaruit iemand naar iets kijkt; be\xEFnvloed door de standplaatsgebondenheid.",standplaatsgebondenheid:"Tijd, ruimte, maatschappelijke positie en persoonskenmerken be\xEFnvloeden de blik op (historische) gebeurtenissen.",nationalistisch:"Nationalisme: sterke voorliefde voor het eigen volk of land."}}],vocab:[["historische vraag","Vraag gericht op het menselijke verleden."],["referentiekader","Schema om je te ori\xEBnteren: tijd, ruimte, maatschappelijk domein."],["primaire bron","Gemaakt door iemand die rechtstreeks betrokken is."],["secundaire bron","Gemaakt door iemand die niet rechtstreeks betrokken is, vaak later."],["standplaatsgebondenheid","Tijd, plaats, positie en persoon be\xEFnvloeden je blik op het verleden."],["representativiteit","Is de bron typisch voor haar tijd en omgeving?"],["reconstructie","Het verleden opnieuw opgebouwd op basis van bronnen."],["stereotiep","Clich\xE9: steeds dezelfde omschrijving voor iets."],["perspectief","Standpunt van waaruit iemand naar iets kijkt."],["breuk","Belangrijke verandering waardoor een nieuwe periode begint."],["continu\xEFteit","Zaken die hetzelfde blijven."],["nationalisme","Sterke voorliefde voor het eigen volk of land."]],quiz:[{t:"order",q:"Zet de zeven tijden in chronologische volgorde (de eerste vier).",o:["Prehistorie","Oude nabije oosten (\xB13500 v.C.)","Klassieke oudheid (\xB1800 v.C.)","Middeleeuwen (\xB1500)"],e:"Daarna: vroegmoderne tijd (\xB11450), moderne tijd (\xB11750), hedendaagse tijd (1945)."},{t:"order",q:"Zet de laatste vier tijden in chronologische volgorde.",o:["Middeleeuwen (\xB1500)","Vroegmoderne tijd (\xB11450)","Moderne tijd (\xB11750)","Hedendaagse tijd (1945)"],e:"Elke indeling is kunstmatig: een afspraak tussen geleerden."},{t:"mc",q:"Wanneer beginnen de middeleeuwen ongeveer?",o:["\xB1500","\xB1800 v.C.","\xB11450","\xB11000"],a:0,e:"De vroegmoderne tijd begint rond 1450."},{t:"mc",q:"Wanneer begint de hedendaagse tijd?",o:["1945","1750","1914","1789"],a:0,e:"De moderne tijd begint rond 1750."},{t:"mc",q:"'Waarom bouwen de oude Egyptenaren piramides?' Welk soort historische vraag is dat?",o:["Een vraag over het verleden","Een vraag over de relatie tussen heden en verleden","Een vraag over hoe we tot kennis komen","Een vraag over ons beeld van het verleden"],a:0,e:"Vier soorten: A over het verleden, B heden-verleden, C hoe we kennis krijgen, D ons beeld."},{t:"mc",q:"'Hoe komen we aan informatie over de neanderthaler?' Welk soort vraag?",o:["Hoe we tot kennis over het verleden komen","Over het verleden","Over heden en verleden","Over ons beeld"],a:0,e:"Type C."},{t:"mc",q:"'Klopt het beeld dat Caesar van de Belgae schetst?' Welk soort vraag?",o:["Over het beeld dat we van het verleden hebben","Over het verleden","Over heden en verleden","Over hoe we kennis krijgen"],a:0,e:"Type D."},{t:"mc",q:"Over welk maatschappelijk domein gaat 'Hoe verandert de handel de samenleving in Athene?'",o:["Economisch (en sociaal)","Alleen politiek","Alleen cultureel","Geen enkel"],a:0,e:"Sommige vragen gaan over meer dan \xE9\xE9n domein."},{t:"mc",q:"Welk domein gaat over het bestuur en wie macht heeft?",o:["Politiek","Economisch","Sociaal","Cultureel"],a:0,e:"Economisch: overleven en inkomen. Sociaal: samenleven. Cultureel: kunst, godsdienst, wetenschap\u2026"},{t:"mc",q:"Bij welk domein horen kunst, godsdienst en sport?",o:["Cultureel","Sociaal","Economisch","Politiek"],a:0,e:"Het culturele domein is heel breed: ook wetenschap, techniek, onderwijs en gewoonten."},{t:"mc",q:"Wat is een primaire bron?",o:["Gemaakt door iemand die rechtstreeks betrokken is","Een bron uit een schoolboek","De belangrijkste bron","Een bron uit de prehistorie"],a:0,e:"Een secundaire bron is gemaakt door iemand die niet rechtstreeks betrokken is, vaak later."},{t:"mc",q:"Bron 8 (Caesar over de Belgae) gebruiken om een vraag over de Belgae te beantwoorden: welk soort bron?",o:["Primair: Caesar vocht zelf tegen hen","Secundair: hij leefde 1 000 jaar later","Geen bron","Een reconstructie"],a:0,e:"Caesar veroverde zelf Galli\xEB tussen 58 en 50 v.C. Maar is hij betrouwbaar?"},{t:"mc",q:"Waarom is Caesar niet helemaal betrouwbaar over de dapperheid van de Belgae?",o:["Hij wil zijn overwinning groter laten lijken","Hij kende de Belgae niet","Hij schreef in het Nederlands","Hij was een Belg"],a:0,e:"Hij wil zichzelf ophemelen en zijn daden in Galli\xEB goedpraten."},{t:"mc",q:"Waarom is ''s Lands Glorie' (bron 9) een voorbeeld van een problematisch historisch beeld?",o:["Het neemt Caesars beeld over zonder de context, en is nationalistisch","Het is een foto","Het is te oud","Het toont geen Belgae"],a:0,e:"Het wil de belangrijkheid van Belgi\xEB en de Belgen aantonen."},{t:"mc",q:"Wat betekent standplaatsgebondenheid?",o:["Tijd, plaats, positie en persoon be\xEFnvloeden je blik","Altijd op dezelfde plaats blijven","Een bron uit een museum","Een kaart met een legende"],a:0,e:"Ook wij zijn standplaatsgebonden."},{t:"tf",q:"Elke tijdrekening en indeling van de geschiedenis is kunstmatig.",a:!0,e:"Juist: het is een afspraak tussen geleerden. Niet-westerse samenlevingen gebruiken andere indelingen."},{t:"mc",q:"Wat doe je als eerste bij het bestuderen van een kaart?",o:["De titel lezen","De schaal berekenen","De namen opzoeken","De kaart omdraaien"],a:0,e:"Daarna: schaal, legende, en meestal is boven het noorden."},{t:"mc",q:"Wat betekent representativiteit?",o:["Is de bron typisch voor haar tijd en omgeving?","Is de bron mooi?","Wie heeft de bron gemaakt?","Is de bron oud?"],a:0,e:"Naast bruikbaarheid en betrouwbaarheid."},{t:"tf",q:"Om een historische vraag te beantwoorden, volstaat \xE9\xE9n goede bron.",a:!1,e:"Fout. Bestudeer best meer dan \xE9\xE9n bron en vergelijk ze."},{t:"mc",q:"Bron 2: is het stamgebied van de Belgae groter of kleiner dan Belgi\xEB?",o:["Groter","Kleiner","Precies even groot","Dat kun je niet zien"],a:0,e:"Op de kaart loopt het gebied van de Belgae over de huidige grenzen heen."}],toets:[{k:"KENNEN 1",s:"standplaatsgebondenheid",q:"Leg het begrip 'standplaatsgebondenheid' uit en geef een voorbeeld uit de les.",a:["Tijd, ruimte, maatschappelijke positie en persoonskenmerken be\xEFnvloeden de blik op (historische) gebeurtenissen.","Voorbeeld: Caesar stelt de Belgae dapper voor om zijn eigen overwinning op te hemelen; ''s Lands Glorie' is nationalistisch."]},{k:"KENNEN 2",s:"zeven tijden",q:"Geef de zeven tijden met hun begin- en eindjaar in chronologische volgorde.",a:["Prehistorie \u2192 \xB13500 v.C.","Oude nabije oosten \xB13500 v.C. \u2192 \xB1800 v.C.","Klassieke oudheid \xB1800 v.C. \u2192 \xB1500","Middeleeuwen \xB1500 \u2192 \xB11450","Vroegmoderne tijd \xB11450 \u2192 \xB11750","Moderne tijd \xB11750 \u2192 1945","Hedendaagse tijd 1945 \u2192 nu"]},{k:"KENNEN 3",s:"vier domeinen",q:"Noem de vier maatschappelijke domeinen en leg ze uit.",a:["Politiek: het bestuur, wie macht heeft en hoe groepen samenwerken.","Economisch: hoe mensen overleven en een inkomen verwerven.","Sociaal: hoe groepen en mensen samenleven.","Cultureel: kunst, godsdienst, wetenschap, techniek, onderwijs, sport en gewoonten."]},{k:"KENNEN 4",s:"soorten ruimten",q:"Toon aan dat er verschillende soorten ruimten zijn.",a:["Van groot naar klein: werelddeel, gebied, land, streek, stad of gemeente, wijk; de wereld = mondiaal.","Ook: stedelijk of landelijk (ruraal), continentaal of maritiem, centrum of rand, open of gesloten landschap."]},{k:"KENNEN 5\u20136",s:"primaire en secundaire bronnen",q:"Leg het onderscheid tussen primaire en secundaire bronnen uit. Toon aan dat je afhankelijk bent van bronnen.",a:["Primair: gemaakt door iemand die rechtstreeks betrokken is (ooggetuige). Secundair: niet rechtstreeks betrokken, vaak later.","De antwoorden op een historische vraag vind je in bronnen; over periodes met weinig bronnen weten we weinig, en een nieuwe bron kan onze kennis veranderen."]},{k:"KENNEN 7",s:"historisch beeld",q:"Leg uit wat er onder een historisch beeld verstaan wordt.",a:["Geschiedenis is een reconstructie van het verleden op basis van
