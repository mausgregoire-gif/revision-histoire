  title: "De kleine stad die de wereld veroverde",
  emoji: "🏛️",
  text: "Het jaar is 390 voor Christus. Rome is nog maar een kleine stadstaat aan de rivier de Tiber. En dan... slaan de Kelten toe.\n\nEen woeste stam uit het noorden valt Rome aan en verovert de stad. De Romeinen lijden een vernederende nederlaag. Voor even lijkt alles voorbij.\n\nMaar de Romeinen zijn niet het soort mensen dat zich zomaar gewonnen geeft.\n\nZe herstellen zich. Ze herbouwen. Ze leren van hun fouten. En omstreeks 340 voor Christus is hun heerschappij over Latium \u2014 het gebied rond Rome \u2014 definitief. De inwoners van veroverde steden krijgen het Romeinse burgerrecht: dezelfde rechten \xE9n plichten als echte Romeinen. Slim, toch? Want waarom zou je in opstand komen als je z\xE9lf een Romein bent geworden?"

  text: "Nu heeft Rome een nieuwe vijand. En deze keer is het een die hen echt bang maakt.\n\nZijn naam is Hannibal Barca. Carthaags generaal. Geniaal strateeg. En hij heeft een geheimwapen: oorlogsolifanten.\n\nIn 218 voor Christus doet Hannibal iets wat iedereen voor onmogelijk houdt: hij trekt met zijn leger \u2014 en zijn olifanten \u2014 over de Pyrenee\xEBn en de Alpen. In de winter. Duizenden soldaten en tientallen olifanten sterven in de bergen. Maar Hannibal geraakt erdoor.\n\nEenmaal in Itali\xEB is hij onstuitbaar. Bij het Trasimeense Meer verslaat hij de Romeinen. Bij Cannae \u2014 in 216 voor Christus \u2014 levert hij de Romeinen de grootste militaire ramp uit hun geschiedenis: in \xE9\xE9n enkele dag sneuvelen 50.000 Romeinse soldaten.\n\nVijftigduizend. Op \xE9\xE9n dag.\n\nRome lijkt verloren. Maar de bondgenoten in Midden-Itali\xEB blijven trouw aan Rome. Hannibal heeft geen versterkingen. Hij kan Rome niet innemen. En intussen stuurt Rome zijn eigen generaal \u2014 Scipio 'Africanus' \u2014 naar Spanje en daarna naar Afrika zelf.\n\nIn 202 voor Christus ontmoeten Hannibal en Scipio elkaar bij Zama. Hannibal verliest. Voor de eerste keer in zijn leven."

  text: "Na de Tweede Punische Oorlog is Rome de baas van het westelijke Middellandse Zeegebied. Maar \xE9\xE9n man is er nog niet tevreden mee.\n\nMarcus Porcius Cato \u2014 een rijke Romein die vreest voor de hernieuwde kracht van Carthago. De Carthaagse boeren concurreren met de Romeinse landheren. Dat pikt hij niet.\n\nElke toespraak in de senaat eindigt hij met dezelfde zin, wat het onderwerp ook is:\n\"Ceterum censeo Carthaginem esse delendam.\"\n\u2014 \"Overigens ben ik van mening dat Carthago verwoest moet worden.\"\n\nElke. Keer. Weer.\n\nEn uiteindelijk krijgt hij zijn zin.\n\nIn 149 voor Christus begint de Derde Punische Oorlog. Carthago is nu veel zwakker. In 146 voor Christus wordt de stad volledig verwoest. De Romeinen plegen de grond om. Ze maken er een Romeinse provincie van: Africa.\n\nDe Middellandse Zee is nu een Romeinse zee. Ze noemen het zelf: Mare Nostrum. Onze zee."

  text: "Hoe beheerst Rome al die veroverde gebieden? Met \xE9\xE9n geniaal systeem.\n\nEen veroverd gebied buiten Itali\xEB heet een 'provincia'. En elke provincie wordt anders behandeld \u2014 afhankelijk van hoe trouw ze zijn.\n\nSommige steden krijgen het volledige Romeinse recht: ze mogen kiezen, verkozen worden, eigendommen bezitten en trouwen volgens Romeinse wet. Dit zijn de kolonies en de bevoorrechte steden.\n\nAndere steden krijgen het 'Latijns recht' \u2014 gedeeltelijk. Ze hebben geen politieke rechten, maar wel burgerlijke rechten.\n\nEn dan zijn er de onderworpen steden: geen zelfbestuur, geen rechten. Ze moeten gewoon gehoorzamen.\n\nMaar \u2014 en dit is het slimme \u2014 elke stad kan opklimmen of afzakken. Trouw aan Rome wordt beloond. Opstand wordt bestraft. Zo heeft niemand echt reden om samen te spannen.\n\nOm dat systeem te ondersteunen, bouwen de Romeinen een indrukwekkend netwerk van heerbanen \u2014 rechte, geplaveide wegen die dwars door het rijk lopen. Alle wegen leiden naar Rome. Letterlijk.\n\nMet die wegen kunnen legioenen zich razendsnel verplaatsen. En handelaars ook \u2014 want de wegen zijn niet alleen voor soldaten. Ze verbinden het hele rijk."
