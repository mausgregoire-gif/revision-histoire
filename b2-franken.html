(function(){
var __defProp=Object.defineProperty,__defProps=Object.defineProperties;var __getOwnPropDescs=Object.getOwnPropertyDescriptors;var __getOwnPropSymbols=Object.getOwnPropertySymbols;var __hasOwnProp=Object.prototype.hasOwnProperty,__propIsEnum=Object.prototype.propertyIsEnumerable;var __defNormalProp=(obj,key,value)=>key in obj?__defProp(obj,key,{enumerable:!0,configurable:!0,writable:!0,value}):obj[key]=value,__spreadValues=(a,b)=>{for(var prop in b||(b={}))__hasOwnProp.call(b,prop)&&__defNormalProp(a,prop,b[prop]);if(__getOwnPropSymbols)for(var prop of __getOwnPropSymbols(b))__propIsEnum.call(b,prop)&&__defNormalProp(a,prop,b[prop]);return a},__spreadProps=(a,b)=>__defProps(a,__getOwnPropDescs(b));const{useState,useEffect,useMemo}=React,M={id:"b2",vak:"Geschiedenis",les:"B2",title:"De Franken, nieuwe heersers in het Westen",pages:"Storia 3, p. 20\u201328",color:"#ff8a65",draad:[{t:"Waar gaat deze les over?",p:["De meeste Germaanse rijken verdwijnen snel. Het rijk van de **Franken** blijft lang bestaan.","Hoe komt dat? Wie leidt het? Welke rol speelt de **Kerk**? Hoe werken bestuur, economie en cultuur?","Tijdlijn: **Merovingers** vanaf \xB1480, **Karolingers** vanaf 751, **keizer** in 800."]},{t:"1. De Franken worden machtig",p:["De Franken zijn **stammen langs de Rijn**.","Eerst dienen ze in het Romeinse leger. Later mogen ze als **bondgenoten** in 'Belgica' wonen.","In de 5e eeuw controleren ze **Noord-Galli\xEB** en het Rijnland.","De **Merovingers** worden de leiders, eerst rond **Doornik**.","**Chlodovech** (ca. 481\u2013511) verslaat alle andere Frankische koningen.",{q:"Wie verslaat alle andere Frankische koningen?",o:["Chlodovech","Karel Martel","Pepijn"],a:0}]},{t:"1. Van Merovingers naar Karolingers",p:["Het rijk wordt vaak **verdeeld**: elke prins wil een koninkrijk.","Vanaf de 7e eeuw worden de Merovingers **zwakker**: geen veroveringen, minder land.","Rijke **hofmeiers** besturen in hun plaats.","In **751** nemen de hofmeiers, de **Karolingers**, de troon over.","In **800** wordt **Karel de Grote** door de paus tot keizer gekroond.",{q:"Wanneer nemen de Karolingers de troon over?",o:["751","800","481"],a:0}]},{t:"2. Chlodovech en de Kerk",p:["Omstreeks **500** laat Chlodovech zich **dopen**.","Voordeel 1: hij gebruikt de **organisatie van de Kerk**. Bisschoppen worden zijn raadgevers.","Voordeel 2: \xE9\xE9n godsdienst geeft **eenheid** tussen Franken en Gallo-Romeinen.","Voordeel 3: hij krijgt **respect** van andere christelijke vorsten.","Hij controleert wel zelf de **bisschopsverkiezingen**.",{q:"Welk is een voordeel van de bekering?",o:["Meer eenheid in het rijk","Geen leger meer nodig","Hij wordt paus"],a:0}]},{t:"2. De Karolingers en de paus",p:["**Karel Martel** drijft islamitische invallers terug over de Pyrenee\xEBn.","Zijn zoon **Pepijn de Korte** zet in 751 de laatste Merovinger af, met steun van de bisschoppen.","Pepijn beschermt de **paus** tegen de Longobarden en geeft hem **Midden-Itali\xEB**.","Ruiters met grond van de Kerk betalen elk jaar een tiende van hun oogst: de **tienden**.","**Karel de Grote** (768\u2013814) beschermt de paus. In 800 kroont de paus hem tot keizer.",{q:"Wat krijgt de paus van Pepijn?",o:["Bescherming en Midden-Itali\xEB","De keizerskroon","Het hele Frankische Rijk"],a:0}]},{t:"3. Het bestuur",p:["De koning heeft **alle macht**. Het rijk is zijn **priv\xE9bezit**; na zijn dood wordt het verdeeld.","Er is geen vaste hoofdstad: het hof **reist** van domein naar domein.","Het rijk bestaat uit **gouwen**, bestuurd door een **gouwgraaf** of **hertog**.","Aan de grens liggen **marken**, bestuurd door een **markgraaf**.","**Zendgraven** controleren of iedereen de bevelen van de koning volgt.",{q:"Wie bestuurt een mark?",o:["Een markgraaf","Een zendgraaf","Een bisschop"],a:0},"De **Lex Salica** (Salische wet) is vooral een lijst met boetes per misdaad."]},{t:"4. De economie",p:["Heren en abdijen bezitten grote **domeinen**.","Een domein heeft 3 delen: het **vroonhof** (van de heer), de **tenures** (van de boeren) en de **woeste gronden** (bos, weide).","Boeren krijgen bescherming en een tenure. Ze werken en betalen **in natura**.","Men probeert alles zelf te maken: een **zelfvoorzienende** of gesloten economie.",{q:"Wat is het vroonhof?",o:["De boerderij van de heer","Het bos","De hoeve van een boer"],a:0},"In het noorden drijven de **Friezen** handel langs Schelde, Maas en Rijn."]},{t:"5. Culturele heropleving",p:["Alle abdijen moeten de **regel van Benedictus** volgen.","Geleerden schrijven boeken en verzamelen **klassieke teksten**.","Scholen onderwijzen de **zeven vrije kunsten**.","Bouwmeesters bouwen naar **Romeins voorbeeld**.","Beperking: buiten het hof en de abdijen zijn er **weinig geleerden**.",{q:"Welke regel volgen alle abdijen?",o:["De regel van Benedictus","De Lex Salica","De tienden"],a:0}]},{t:"6. Het rijk valt uiteen",p:["Karel de Grote voert **oorlog**: zijn krijgers kunnen plunderen en blijven hem trouw.","Zijn zoon **Lodewijk de Vrome** voert weinig oorlog en controleert de graven minder.","Het rijk is **te groot** en de wegen zijn slecht.","Zijn zonen maken ruzie. **Verdrag van Verdun (843)**: het rijk wordt in drie verdeeld.","**West-Franci\xEB** \u2192 Frankrijk. **Oost-Franci\xEB** \u2192 Duitsland. Midden-Franci\xEB valt uiteen.","Door ruzies en **Vikingen** worden graven en hertogen onafhankelijker. Hun ambt wordt erfelijk.",{q:"Wat gebeurt er in 843?",o:["Verdrag van Verdun: het rijk wordt verdeeld","Karel wordt keizer","Chlodovech wordt gedoopt"],a:0}]}],lees:[{t:"Merovingers en Karolingers",x:"De Merovingers verliezen macht aan de [[hofmeier]]. In 751 nemen de [[Karolingers]] de troon over. Pepijn verovert land voor de paus en de ruiters betalen [[tienden]] aan de Kerk.",k:{hofmeier:"Beheert aanvankelijk de koninklijke bezittingen, maar misbruikt zijn positie en laat zich belonen met steeds meer bezittingen en macht. Uiteindelijk plaatsvervanger van de koning.",Karolingers:"Machtige Frankische familie die opklimt tot het ambt van hofmeier (ook Pepiniden). Vanaf Karel Martel spreken we van Karolingers.",tienden:"Ruiters die grond van de Kerk kregen, moeten elk jaar een tiende van hun oogst aan de Kerk afstaan."}},{t:"Het bestuur",x:"Het rijk is verdeeld in gouwen ([[gouw]]) onder een [[gouwgraaf]] of [[hertog]]. Aan de grens ligt een [[mark]] onder een [[markgraaf]]. [[Zendgraven|zendgraaf]] controleren hen.",k:{gouw:"Een provincie van het rijk.",gouwgraaf:"Bestuurt een gouw in opdracht van de vorst.",hertog:"Vanaf de Frankische tijd een militaire bestuurder van een bepaald gebied (gouw).",mark:"Graafschap aan de grens dat beschermd moet worden tegen invallers.",markgraaf:"Bestuurt een mark in opdracht van de vorst en voert het bevel over een Frankisch leger.",zendgraaf:"Controleert of de plaatselijke bestuurders de bevelen van de vorst opvolgen."}},{t:"De economie",x:"Een [[domein]] bestaat uit het [[vroonhof]], de [[woeste gronden]] en de [[tenures|tenure]]. Men streeft naar een [[zelfvoorzienende economie]].",k:{domein:"Groot landbouwbedrijf van een heer of abdij, tussen Loire en Rijn.",vroonhof:"De centrale boerderij die de heer zelf uitbaat.","woeste gronden":"Gronden niet voor landbouw of bewoning: bos, weide, sprokkelhout.",tenure:"Een mansus (boerderij) met landbouwgrond voor een boer. In ruil levert hij diensten en belastingen in natura.","zelfvoorzienende economie":"Ook gesloten economie: de opbrengsten van het domein dienen vooral voor de eigen bewoners."}},{t:"Kerk en cultuur",x:"Chlodovech strijdt tegen [[ketters|ketter]] die het [[arianisme]] aanhangen. Abdijen volgen de [[regel van Benedictus]] en onderwijzen de [[zeven vrije kunsten]].",k:{ketter:"Iemand die door de Kerk vervolgd wordt omdat hij een verkeerde visie op het christendom en de Kerk verkondigt.",arianisme:"Christelijke godsdienst die Christus als belangrijkste mens beschouwt, maar niet als god (priester Arius).","regel van Benedictus":"Leefregel voor monniken, door Benedictus van Nursia (480\u2013547). Pepijn de Korte legt hem op aan alle abdijen.","zeven vrije kunsten":"Filosofie, redenaarskunde, literatuur, meetkunde, rekenkunde, muziek en astronomie."}}],vocab:[["hofmeier","Beheert de koninklijke bezittingen en wordt plaatsvervanger van de koning."],["tienden","Een tiende van de oogst die men elk jaar aan de Kerk afstaat."],["gouw","Een provincie van het Frankische Rijk."],["mark","Graafschap aan de grens, te beschermen tegen invallers."],["gouwgraaf","Bestuurt een gouw in opdracht van de vorst."],["markgraaf","Bestuurt een mark en voert het bevel over een leger."],["hertog","Militaire bestuurder van een gebied (gouw)."],["domein","Groot landbouwbedrijf: vroonhof, woeste gronden en tenures."],["zelfvoorzienende economie","Het domein produceert vooral voor de eigen bewoners."],["zendgraaf","Controleert of graven en hertogen de bevelen van de koning uitvoeren."],["tenure","Boerderij (mansus) met grond voor een boer, in ruil voor diensten."],["ketter","Iemand met een verkeerde visie op het christendom, vervolgd door de Kerk."]],quiz:[{t:"mc",q:"Wie is de Merovinger die alle andere Frankische koningen verslaat?",o:["Chlodovech","Karel Martel","Pepijn de Korte","Lodewijk de Vrome"],a:0,e:"Chlodovech (reg. ca. 481\u2013511), zoon van Childerik."},{t:"mc",q:"Waarom neemt de macht van de Merovingers af vanaf de 7e eeuw?",o:["Geen veroveringen en prestige meer, en ze verarmen door hun medewerkers te belonen met land","De paus zet hen af","De Vikingen veroveren hun rijk","Ze bekeren zich niet"],a:0,e:"Rijke hofmeiers besturen steeds vaker de vorstendommen."},{t:"mc",q:"In welk jaar nemen de Karolingers de troon over?",o:["751","800","481","843"],a:0,e:"Pepijn III de Korte zet de laatste Merovingische koning af."},{t:"mc",q:"Wanneer wordt Karel de Grote tot keizer gekroond?",o:["800","751","814","843"],a:0,e:"Door de paus, in Rome."},{t:"mc",q:"Rond welk jaar laat Chlodovech zich dopen?",o:["Omstreeks 500","Omstreeks 400","In 751","In 800"],a:0,e:"De bekering van Chlodovech omstreeks 500 is een hoogtepunt van de samenwerking met de Kerk."},{t:"mc",q:"Welk voordeel biedt de bekering NIET aan Chlodovech?",o:["Hij hoeft geen leger meer te hebben","Hij kan de organisatie van de Kerk gebruiken","Meer eenheid tussen Franken en Gallo-Romeinen","Respect van andere christelijke vorsten"],a:0,e:"De drie voordelen: organisatie van de Kerk, eenheid door \xE9\xE9n godsdienst, respect van christelijke vorsten."},{t:"mc",q:"Wat krijgt de paus van Pepijn de Korte?",o:["Bescherming tegen de Longobarden en Midden-Itali\xEB","De keizerskroon","De tienden van alle Franken","Het recht om koningen te kiezen"],a:0,e:"In ruil zalft de paus Pepijn en zijn zonen: een bondgenootschap."},{t:"mc",q:"Wat zijn tienden?",o:["Een tiende van de oogst die men aan de Kerk afstaat","Belastingen voor de koning","Tien soldaten per domein","Een wetboek"],a:0,e:"Ruiters die grond van de Kerk kregen, moeten elk jaar een tiende van hun oogst afstaan."},{t:"tf",q:"De Frankische koning regeert vanuit \xE9\xE9n vaste hoofdstad.",a:!1,e:"Fout. De hofhouding reist van domein naar domein; Karel de Grote verblijft wel veel in Aken."},{t:"mc",q:"Wat is een mark?",o:["Een graafschap aan de grens","Een munt","Een abdij","Een markt"],a:0,e:"Een mark beschermt het rijk tegen invallers en wordt bestuurd door een markgraaf."},{t:"mc",q:"Wat doen de zendgraven?",o:["Ze controleren of graven en hertogen de bevelen van de koning uitvoeren","Ze zenden boodschappen naar de paus","Ze innen de tienden","Ze leiden de abdijscholen"],a:0,e:"Inspecteurs onder Karel de Grote."},{t:"mc",q:"Wat staat er vooral in de Lex Salica?",o:["Een opsomming van schadevergoedingen (weergeld) per misdaad","De regels voor monniken","De grenzen van het rijk","De namen van alle koningen"],a:0,e:"Chlodovech laat de Salische wet opschrijven."},{t:"mc",q:"Uit welke drie delen bestaat een domein?",o:["Vroonhof, woeste gronden, tenures","Abdij, markt, haven","Gouw, mark, hertogdom","Akker, wijngaard, olijfgaard"],a:0,e:"Vroonhof: centrale boerderij van de heer. Woeste gronden: bos, weide. Tenures: hoeven van de boeren."},{t:"mc",q:"Wat betekent 'zelfvoorzienende economie'?",o:["De opbrengsten van het domein dienen vooral voor de eigen bewoners","Iedereen handelt met het buitenland","Er wordt niets geproduceerd","De koning betaalt alles"],a:0,e:"Ook gesloten economie genoemd."},{t:"mc",q:"Wie drijft in het noorden van het rijk een actieve handel?",o:["De Friezen","De Hunnen","De Vandalen","De Byzantijnen"],a:0,e:"Langs Schelde, Maas en Rijn (Dorestad, Tiel); via de Vikingen verwerven ze luxegoederen."},{t:"mc",q:"Welk kenmerk hoort bij de regel van Benedictus (bron 11)?",o:["Niemand heeft iets in eigendom","Monniken trekken van klooster naar klooster","Monniken mogen niet werken","Monniken moeten de abt niet gehoorzamen"],a:0,e:"Ook: handenarbeid en gewijde lezing, de abt gehoorzamen, luiheid is de vijand van de ziel.",b:[["Bron 11 \xB7 De kloosterregel van Benedictus","Monniken mogen niet rondtrekken van klooster naar klooster. Niemand heeft iets in eigendom. Luiheid is de vijand van de ziel: op bepaalde uren handenarbeid, op andere uren gewijde lezing. Iedereen gehoorzaamt de abt en luistert naar elkaar."]]},{t:"mc",q:"Welke beperking heeft de Karolingische heropleving?",o:["Buiten het hof en de abdijen zijn er weinig geleerden","Er worden geen boeken meer geschreven","De Kerk verbiedt scholen","Alleen boeren leren lezen"],a:0,e:"Ook worden de zeven vrije kunsten aangepast (zangles, kalenderberekeningen)."},{t:"mc",q:"Wat krijgt Karel de Kale in het Verdrag van Verdun (843)?",o:["West-Franci\xEB","Oost-Franci\xEB","Midden-Franci\xEB en de keizerstitel","Itali\xEB"],a:0,e:"Lodewijk de Duitser krijgt Oost-Franci\xEB, Lotharius Midden-Franci\xEB en de keizerstitel."},{t:"mc",q:"Waarom worden de plaatselijke bestuurders onafhankelijker?",o:["De strijdende erfgenamen hebben hun steun nodig, en de koningen beschermen niet tegen de invallers","De paus benoemt hen","Ze worden allemaal koning","Karel de Grote geeft hen meer macht"],a:0,e:"Graven en hertogen maken hun ambt erfelijk; de bevolking zoekt bescherming bij hen."},{t:"mc",q:"Bron 2: Gregorius van Tours schrijft over Chlodovech. Waarom moet je oppassen?",o:["Hij baseert zich soms op geruchten en vindt christelijk zijn heel belangrijk","Hij schrijft in het Arabisch","Hij leefde in de 19e eeuw","Hij was een Frankische krijger"],a:0,e:"Toch gebruiken historici zijn werk: het is een van de weinige geschreven bronnen over de Franken.",b:[["Bron 2 \xB7 Gregorius van Tours, Geschiedenis van de Franken (6e eeuw)","Bisschop Gregorius (538\u2013594) beschrijft o.a. de vaas van Soissons (486): Chlodovech vraagt een gestolen vaas terug voor de bisschop; een krijger slaat ze stuk; een jaar later doodt Chlodovech hem met een bijl. Gregorius kende Merovingische koningen, gebruikt ook geruchten en roddels, en vindt christelijk zijn heel belangrijk."]]}],toets:[{k:"KENNEN 1",s:"begrippen bestuur",q:"Leg uit: hofmeier, tienden, gouw, mark, gouwgraaf, markgraaf, hertog.",a:["Hofmeier: beheert de koninklijke bezittingen en wordt plaatsvervanger van de koning.","Tienden: een tiende van de oogst voor de Kerk.","Gouw: provincie; gouwgraaf: bestuurt een gouw.","Mark: grensgraafschap; markgraaf: bestuurt een mark en voert het bevel over een leger.","Hertog: militaire bestuurder van een gebied."]},{k:"KENNEN 1 \xB7 7",s:"domein en economie",q:"Leg uit: domein, zelfvoorzienende economie. Hoe werkt het economisch systeem van het domein?",a:["Domein: vroonhof (heer), woeste gronden, tenures (boeren).","Boeren krijgen een tenure en bescherming; ze leveren diensten en betalen belastingen in natura.","Zelfvoorzienend / gesloten: de opbrengst is vooral voor de eigen bewoners."]},{k:"KENNEN 2",s:"Merovingers",q:"Schets de opkomst en de ondergang van de Merovingische koningen.",a:["Opkomst: Childerik en Chlodovech worden stamhoofd en legeraanvoerder; Chlodovech verslaat de andere Frankische koningen.","Ondergang (vanaf de 7e eeuw): geen veroveringen en prestige meer, verarming door belonen met land; hofmeiers nemen het bestuur over; 751: Karolingers op de troon."]},{k:"KENNEN 3\u20134",s:"Chlodovech, Pepijn en de paus",q:"Geef drie voordelen van de bekering van Chlodovech. Leg het verbond tussen de paus en Pepijn III uit.",a:["Organisatie van de Kerk gebruiken; eenheid tussen Franken en Gallo-Romeinen; respect van christelijke vorsten.","Pepijn wordt met steun van de Kerk koning (gezalfd). Hij beschermt de paus tegen de Longobarden en schenkt hem Midden-Itali\xEB."]},{k:"KENNEN 5",s:"Kerk en koning 5e\u20139e eeuw",q:"Schets de evolutie van de verhouding tussen Kerk en koning (keizer) van de 5e tot de 9e eeuw.",a:["Chlodovech: samenwerking, maar hij controleert de bisschopsverkiezingen.","Pepijn en Karel de Grote: bondgenootschap met de paus; kroning in 800; zij controleren de benoeming van bisschoppen.","Lodewijk de Vrome doet afstand van de voorrang op de paus; daarna speelt de paus een steeds grotere rol in de keizerskeuze."]},{k:"KENNEN 6 \xB7 8",s:"bestuur en handel",q:"Leg de bestuurlijke organisatie uit, en hoe er in het rijk handel gedreven wordt.",a:["De koning: hoogste bestuurder, wetgever en rechter; het rijk is zijn priv\xE9bezit; reizend hof.","Gouwen (gouwgraaf, hertog), marken (markgraaf), zendgraven als controleurs; Lex Salica.","Handel: handelaars leveren wat het domein niet maakt. Friezen in het noorden (Dorestad, Tiel), Marseille en Genua in het zuiden."]},{k:"KENNEN 9\u201311",s:"cultuur",q:"Geef vier kenmerken van de regel van Benedictus, drie voorbeelden van de culturele heropleving en een beperking.",a:["Benedictus: vaste woonplaats, niets in eigendom, handenarbeid en lezing, de abt gehoorzamen.","Heropleving: boeken schrijven en klassieke literatuur verzamelen; abdij- en kathedraalscholen (zeven vrije kunsten); bouwen naar Romeins voorbeeld.","Beperking: weinig geleerden buiten hof en abdijen; aangepaste vrije kunsten."]},{k:"KENNEN 12\u201314",s:"het rijk valt uiteen",q:"Noem vier oorzaken van het uiteenvallen, leg het ontstaan van Frankrijk en Duitsland uit, en waarom plaatselijke bestuurders onafhankelijker worden.",a:["Lodewijk de Vrome voert weinig oorlog en controleert graven en hertogen minder; slechte wegen; het rijk is te groot; ruzie tussen zijn zonen.","Verdun 843: West-Franci\xEB \u2192 Frankrijk, Oost-Franci\xEB \u2192 Duitsland.","De strijdende erfgenamen hebben hun steun nodig; de koningen beschermen niet tegen Vikingen en Hongaren; ambten worden erfelijk."]},{k:"KENNEN 15",s:"vier data",q:"Geef de data: doop van Chlodovech, troonsbestijging van Pepijn III, keizerskroning van Karel de Grote, Verdrag van Verdun.",a:["Doop van Chlodovech: omstreeks 500.","Pepijn III koning: 751.","Keizerskroning: 800.","Verdrag van Verdun: 843."]},{k:"Bron 2",s:"bron 2 Gregorius van Tours",q:"Is Gregorius van Tours een primaire of secundaire bron over Chlodovech? Waarom gebruiken historici hem toch?",a:["Secundair: hij leeft later (538\u2013594) en kende Chlodovech niet persoonlijk.","Hij gebruikt ook geruchten en roddels, en vindt christelijk zijn heel belangrijk.","Toch is zijn werk een van de weinige geschreven bronnen over de Franken in de 6e eeuw."],b:[["Bron 2 \xB7 Gregorius van Tours, Geschiedenis van de Franken (6e eeuw)","Bisschop Gregorius (538\u2013594) beschrijft o.a. de vaas van Soissons (486): Chlodovech vraagt een gestolen vaas terug voor de bisschop; een krijger slaat ze stuk; een jaar later doodt Chlodovech hem met een bijl. Gregorius kende Merovingische koningen, gebruikt ook geruchten en roddels, en vindt christelijk zijn heel belangrijk."]]}]},C={bg:"#0f0e17",card:"#1a1926",card2:"#232234",line:"#2e2d3d",txt:"#fffffe",muted:"#a7a9be",ok:"#2cb67d",bad:"#ef4565",warn:"#ff8906",yel:"#ffd803",ink:"#272343"},QN=12,KEY="gesch-"+M.id+"-v1",DAG=["zo","ma","di","wo","do","vr","za"],MND=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"],RITS=[null,{n:"Rit 1 \xB7 Leren",sub:"Rode draad, kernwoor
