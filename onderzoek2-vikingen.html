var __defProp=Object.defineProperty,__defProps=Object.defineProperties;var __getOwnPropDescs=Object.getOwnPropertyDescriptors;var __getOwnPropSymbols=Object.getOwnPropertySymbols;var __hasOwnProp=Object.prototype.hasOwnProperty,__propIsEnum=Object.prototype.propertyIsEnumerable;var __defNormalProp=(obj,key,value)=>key in obj?__defProp(obj,key,{enumerable:!0,configurable:!0,writable:!0,value}):obj[key]=value,__spreadValues=(a,b)=>{for(var prop in b||(b={}))__hasOwnProp.call(b,prop)&&__defNormalProp(a,prop,b[prop]);if(__getOwnPropSymbols)for(var prop of __getOwnPropSymbols(b))__propIsEnum.call(b,prop)&&__defNormalProp(a,prop,b[prop]);return a},__spreadProps=(a,b)=>__defProps(a,__getOwnPropDescs(b));const{useState,useEffect,useMemo}=React,M={id:"o2",vak:"Geschiedenis",les:"Onderzoek 2",title:"De Vikingen",pages:"Storia 3, p. 43\u201348",color:"#64b5f6",draad:[{t:"Waar gaat dit onderzoek over?",p:["De Vikingen zijn onze geschiedenis ingegaan als woeste plunderaars. Dat beeld is slechts een stukje van het hele verhaal. De Scandinavische landen zijn vandaag juist trots op hun Vikingverleden.","De vragen: wie zijn de Vikingen? Waarom zien wij de Vikingen als woeste plunderaars? Wat leert verder onderzoek ons?","Tijdlijn: ongeveer 800 tot 1050."]},{t:"Bron 1: wie, waar en wanneer?",p:["De Vikingen komen uit Scandinavi\xEB: de landen die we vandaag Noorwegen, Zweden en Denemarken noemen. Tussen 800 en 1050 kennen ze een periode van grote bloei.","Ze bouwen snelle, sterke en wendbare schepen waarmee ze heel Europa afreizen en zelfs verder. Ze verkennen, plunderen en veroveren grondgebied. Rond het jaar 1000 bereikt Leif Eriksson Amerika.","De Vikingen leven in een maritieme ruimte (aan of op zee), niet in een continentale ruimte (landinwaarts, niet gericht op zee)."]},{t:"Bron 2\u20133: het langschip",p:["Skuldelev 2 is een van de vijf schepen die in 1962 in de baai van Roskilde (Denemarken) worden opgegraven. Ze werden rond 1070 tot zinken gebracht om de kust te verdedigen.","Het is een eiken langschip, een oorlogsschip: 30 m lang, 3,8 m breed, met een diepgang van slechts 1 m. Er is plaats voor ongeveer 65 personen, waaronder 60 roeiers. Met een zeil van ca. 112 m\xB2 haalt het 20 knopen (36 km/u).","Een langschip werd dikwijls versierd met een slangenkop of een draak; daarom heet het ook drakar. Tussen 2000 en 2004 bouwt het Vikingschipmuseum een reconstructie van het schip."]},{t:"Bron 4\u20135: het beeld van plunderaars",p:["In 793 vallen de Vikingen het klooster van Lindisfarne aan, een eilandje voor de kust van Noordoost-Engeland. Het tijdperk van de Vikingen start in veel geschiedenisboeken met die plundering.","Alcuinus van York, leraar aan het hof van Karel de Grote, schrijft dat Brittanni\xEB nooit eerder zo'n verschrikking onderging van een 'heidens ras'. De Angelsaksische kroniek (ca. 890, op bevel van koning Alfred de Grote) spreekt van 'heidense mannen' die een ravage aanrichten in de kerk van God.","De Vikingen willen vooral zilver en slaven buitmaken. Daarna vallen ze nog honderden plaatsen aan, zelfs grote steden zoals Parijs, Aken en Constantinopel.","Beide bronnen zijn geschreven door christelijke slachtoffers. De Vikingen zelf hebben nauwelijks schriftelijke bronnen nagelaten."]},{t:"Bron 6\u20137: de hoornhelm",p:["Bron 6 is een tekening van Alphonse de Neuville in 'l'Histoire de France' (1872) van Fran\xE7ois Guizot, een Franse historicus en politicus. Ze illustreert de belegering van Parijs door de Noormannen in 845 en 885.","De Vikingen dragen er helmen met hoorns of vleugels. Dat is een verzinsel uit de 19e eeuw. Bron 7, een echte Vikinghelm in Oslo, heeft geen hoorns.","Het beeld van de maker wordt be\xEFnvloed door zijn eigen tijd: dat is standplaatsgebondenheid. Zo'n vaak herhaald, veralgemeend beeld heet een stereotiep."]},{t:"Bron 8\u20139: een ander beeld",p:["Bron 8: een rijk versierde dierenkoppijler uit het Osebergschip, in 1904 in Noorwegen gevonden. In dat scheepsgraf werden in 834 twee vrouwen begraven. Het grote aantal grafgiften wijst op belangrijke personen; er zijn een houten kar, kledingstukken en vijf dierenkoppijlers gevonden.","Bron 9: een bronzen weegschaal uit een scheepsgraf in Schotland (Vikinggraf van ca. 900). De Vikingen gebruiken weegschalen om zilver en goud te wegen. Zulke vondsten tonen dat de Vikingen succesvolle handelaars zijn, met contacten tot in Constantinopel, Arabi\xEB en Rusland."]},{t:"Bron 10\u201311: krijgsters en DNA",p:["Bron 10: in 1878 wordt in Birka (bij Stockholm) het graf van een Vikingstrijder gevonden, met wapens, twee geofferde paarden en een bordspel. In 2017 bewijst botonderzoek dat het een vrouw is: een Vikingstrijdster. De tekening is een reconstructie door archeoloog Neil Price.","Bron 11 (VRT NWS, 2020): DNA-onderzoek op 442 skeletten toont dat de Vikingen niet uitsluitend Scandinavi\xEBrs waren, met genetische invloeden uit Zuid-Europa en Azi\xEB. Ook het beeld van de Viking met blond haar klopt niet: veel Vikingen hadden bruin haar."]},{t:"Randinfo: Normandi\xEB en de Roes",p:["Het Frankische rijk betaalt de Vikingen grote sommen zilver en goud om de aanvallen te stoppen. In 911 staat koning Karel de Eenvoudige een stuk grondgebied aan de monding van de Seine af aan Vikingaanvoerder Rollo, die nieuwe invallen moet verhinderen. Dat land van de Noormannen heet vandaag Normandi\xEB.","Via de Wolga en de Dnjepr trekken Vikingen naar het oosten en stichten het Rijk van Kiev. De lokale bevolking noemt hen Roes, dat hun naam aan Rusland geeft.","Zelfs in de Hagia Sophia hebben Vikingen runentekens in het marmer gekrast, met de naam Halfdan."]}],lees:[{t:"Wie zijn de Vikingen?",x:"De Vikingen leven in een [[maritieme ruimte]], niet in een [[continentale ruimte]]. Ze zijn plunderaars, maar ook [[handelaars]]. Hun langschip heet ook [[drakar]].",k:{"maritieme ruimte":"Aan of op zee.","continentale ruimte":"Landinwaarts, niet gericht op zee.",handelaars:"De Vikingen wegen zilver en goud met weegschalen en hebben contacten tot in Constantinopel, Arabi\xEB en Rusland.",drakar:"Een langschip versierd met een slangenkop of een draak."}},{t:"Bronnen en beelden",x:"Alcuinus is een [[getuigenis]] van de aanval op Lindisfarne. Bron 10 is een [[reconstructie]]. De hoornhelm is een [[stereotiep]], een voorbeeld van [[stereotypering]].",k:{getuigenis:"Verklaring van iemand over wat hij heeft meegemaakt of gehoord. Alcuinus en de Angelsaksische kroniek zijn christelijke getuigenissen.",reconstructie:"Iets wat op basis van bronnen nagebouwd of nagetekend wordt.",stereotiep:"Clich\xE9: steeds dezelfde omschrijving voor iets gebruiken.",stereotypering:"Historische redeneerwijze: bepaalde kenmerken worden veralgemeend en stereotiepe beelden door veel mensen gebruikt. Veralgemeningen zijn nooit helemaal juist."}},{t:"Archeologie",x:"In een [[scheepsgraf]] liggen veel [[grafgiften|grafgift]]. Het Osebergschip, de weegschaal, het graf van Birka en [[DNA-onderzoek]] stellen het beeld bij.",k:{scheepsgraf:"De overledene wordt begraven in een schip dat met aarde wordt bedekt.",grafgift:"Voorwerp dat men aan de overledene meegeeft in het graf.","DNA-onderzoek":"Toont dat Vikingen niet allemaal Scandinavi\xEBrs waren en niet allemaal blond."}}],vocab:[["maritieme ruimte","Aan of op zee."],["continentale ruimte","Landinwaarts, niet gericht op zee."],["getuigenis","Verklaring van iemand over wat hij heeft meegemaakt of gehoord."],["reconstructie","Iets wat op basis van bronnen wordt nagebouwd of nagetekend."],["scheepsgraf","De dode wordt begraven in een schip, bedekt met aarde."],["grafgift","Voorwerp dat men de overledene meegeeft in het graf."],["stereotiep","Clich\xE9: steeds dezelfde omschrijving voor iets."],["stereotypering","Kenmerken veralgemenen: zulke beelden zijn nooit helemaal juist."]],quiz:[{t:"mc",q:"Uit welke hedendaagse landen komen de Vikingen?",o:["Noorwegen, Zweden en Denemarken","Duitsland, Polen en Rusland","Ierland, Schotland en Engeland","Finland, Estland en Letland"],a:0,e:"Scandinavi\xEB."},{t:"mc",q:"In welke periode kennen de Vikingen hun grote bloei?",o:["Ongeveer 800\u20131050","Ongeveer 500\u2013800","Ongeveer 1050\u20131300","Ongeveer 300\u2013500"],a:0,e:"Rond 1000 bereikt Leif Eriksson zelfs Amerika."},{t:"mc",q:"Wat is een maritieme ruimte?",o:["Aan of op zee","Landinwaarts","In de bergen","In de woestijn"],a:0,e:"Een continentale ruimte ligt landinwaarts, niet gericht op zee."},{t:"mc",q:"Welk voordeel heeft de diepgang van slechts 1 m van het langschip?",o:["Het schip kan ook ondiep water en rivieren op","Het schip zinkt niet","Er past meer vracht in","Het is goedkoper"],a:0,e:"Daarmee konden de Vikingen de rivieren op en verre gebieden verkennen."},{t:"mc",q:"Welke drie voordelen heeft het Vikingschip?",o:["Snel, sterk en wendbaar","Groot, zwaar en traag","Klein, licht en zonder zeil","Van ijzer, met kanonnen"],a:0,e:"Skuldelev 2 haalt 20 knopen (36 km/u) met plaats voor 65 personen."},{t:"mc",q:"Waarom heet een langschip ook 'drakar'?",o:["Het werd versierd met een slangenkop of draak","Het was rood","Het werd door draken getrokken","Het kwam uit Drakar"],a:0,e:"Draken- of slangenkoppen sierden de voorsteven."},{t:"mc",q:"Welke gebeurtenis van 793 markeert het begin van het Vikingtijdperk?",o:["De aanval op het klooster van Lindisfarne","De belegering van Parijs","De stichting van Normandi\xEB","Leif Eriksson bereikt Amerika"],a:0,e:"Lindisfarne is een eilandje voor de kust van Noordoost-Engeland."},{t:"mc",q:"Wat willen de Vikingen vooral buitmaken?",o:["Zilver en slaven","Graan en vee","Boeken","Wapens"],a:0,e:"Afgelegen kloosters en abdijen waren rijk en slecht verdedigd."},{t:"mc",q:"Waarom zijn bron 4 en 5 zo negatief over de Vikingen?",o:["Ze zijn geschreven door christelijke slachtoffers","Ze zijn geschreven door Vikingen","Ze zijn uit de 19e eeuw","Ze zijn vertaald uit het Arabisch"],a:0,e:"Ze noemen de Vikingen een 'heidens ras' of 'heidense mannen'."},{t:"tf",q:"De Vikingen hebben veel schriftelijke bronnen nagelaten.",a:!1,e:"Fout. Daardoor hangt ons beeld vooral af van bronnen van hun slachtoffers."},{t:"tf",q:"Vikingen droegen helmen met hoorns.",a:!1,e:"Fout. Dat is een verzinsel uit de 19e eeuw (tekening van De Neuville, 1872)."},{t:"mc",q:"Waarom tekent De Neuville in 1872 hoornhelmen?",o:["Zijn beeld is be\xEFnvloed door zijn eigen tijd (standplaatsgebondenheid)","Hij heeft ze in een graf gevonden","Alcuinus beschrijft ze","Vikingen tekenden zichzelf zo"],a:0,e:"Zo'n veralgemeend beeld heet een stereotiep."},{t:"mc",q:"Wat werd er in het Osebergschip (834) begraven?",o:["Twee vrouwen, met veel grafgiften","Een koning en zijn paard","Een handelaar met een weegschaal","Niemand, het was leeg"],a:0,e:"Onder meer een houten kar, kleding en vijf dierenkoppijlers: belangrijke personen."},{t:"mc",q:"Wat toont de bronzen weegschaal (bron 9)?",o:["Vikingen waren succesvolle handelaars","Vikingen waren boeren","Vikingen wogen hun buit niet","Vikingen waren monniken"],a:0,e:"Ze wogen zilver en goud, met contacten tot in Constantinopel, Arabi\xEB en Rusland."},{t:"mc",q:"Wat bewijst botonderzoek in 2017 over het graf van Birka?",o:["De strijder was een vrouw","Het was een monnik","Het graf was vals","Het was geen Viking"],a:0,e:"Meer dan een eeuw dacht men dat het een man was."},{t:"mc",q:"Welk stereotiep beeld wordt door het DNA-onderzoek tegengesproken?",o:["Alle Vikingen waren blonde Scandinavi\xEBrs","Vikingen konden zeilen","Vikingen plunderden","Vikingen handelden"],a:0,e:"Er zijn genetische invloeden uit Zuid-Europa en Azi\xEB; veel Vikingen hadden bruin haar."},{t:"mc",q:"Welk gebied geeft Karel de Eenvoudige in 911 aan Rollo?",o:["Land aan de monding van de Seine: Normandi\xEB","Vlaanderen","Het Rijk van Kiev","IJsland"],a:0,e:"Rollo moet in ruil nieuwe invallen via de Seine verhinderen."},{t:"mc",q:"Welk land dankt zijn naam aan Vikingen?",o:["Rusland (de Roes)","Noorwegen","Engeland","Frankrijk"],a:0,e:"De Roes stichten het Rijk van Kiev."}],toets:[{k:"KENNEN 1",s:"maritiem, continentaal, handel",q:"Leg uit: maritieme ruimte, continentale ruimte, handel (bij de Vikingen).",a:["Maritieme ruimte: aan of op zee.","Continentale ruimte: landinwaarts, niet gericht op zee.","Handel: de Vikingen zijn succesvolle handelaars (weegschalen voor zilver en goud), met contacten tot Constantinopel, Arabi\xEB en Rusland."]},{k:"KENNEN 2",s:"getuigenis, reconstructie, scheepsgraf\u2026",q:"Leg uit: getuigenis, reconstructie, scheepsgraf, grafgift, stereotiep, stereotypering.",a:["Getuigenis: verklaring over wat iemand meemaakte (Alcuinus).","Reconstructie: op basis van bronnen nagebouwd of nagetekend (bron 3, bron 10).","Scheepsgraf: begraven in een schip onder aarde; grafgift: voorwerp meegegeven in het graf.","Stereotiep: clich\xE9; stereotypering: kenmerken veralgemenen, nooit helemaal juist."]},{k:"KENNEN 3",s:"ruimte en tijd",q:"Situeer de Vikingen in de ruimte en de tijd.",a:["Uit Scandinavi\xEB (Noorwegen, Zweden, Denemarken).","Bloei \xB1800\u20131050; ze reizen door heel Europa, tot IJsland, Groenland en Amerika (Leif Eriksson rond 1000)."]},{k:"KENNEN 4",s:"voordelen langschip",q:"Geef drie voordelen van de constructie van een Vikingschip.",a:["Snel (20 knopen dankzij het grote zeil en 60 roeiers).","Sterk (eikenhout) en wendbaar.","Slechts 1 m diepgang: ook rivieren en ondiep water op."]},{k:"KENNEN 5",s:"beeld van plunderaars",q:"Geef twee redenen waarom de Vikingen de geschiedenis ingingen als woeste plunderaars.",a:["De bronnen (Alcuinus, de Angelsaksische kroniek) zijn geschreven door christelijke slachtoffers.","De Vikingen zelf lieten nauwelijks schriftelijke bronnen na."]},{k:"KENNEN 6",s:"vier archeologische vondsten",q:"Geef vier voorbeelden van archeologische vondsten die het beeld bijstellen.",a:["Het Osebergschip met zijn rijk versierde dierenkoppijler: kunstzinnige vakmensen.","De bronzen weegschaal: handelaars.","Het graf van Birka: een vrouwelijke strijder.","DNA-onderzoek: niet alleen Scandinavi\xEBrs, niet allemaal blond."]},{k
