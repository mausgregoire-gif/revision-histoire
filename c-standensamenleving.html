(function(){
var __defProp=Object.defineProperty,__defProps=Object.defineProperties;var __getOwnPropDescs=Object.getOwnPropertyDescriptors;var __getOwnPropSymbols=Object.getOwnPropertySymbols;var __hasOwnProp=Object.prototype.hasOwnProperty,__propIsEnum=Object.prototype.propertyIsEnumerable;var __defNormalProp=(obj,key,value)=>key in obj?__defProp(obj,key,{enumerable:!0,configurable:!0,writable:!0,value}):obj[key]=value,__spreadValues=(a,b)=>{for(var prop in b||(b={}))__hasOwnProp.call(b,prop)&&__defNormalProp(a,prop,b[prop]);if(__getOwnPropSymbols)for(var prop of __getOwnPropSymbols(b))__propIsEnum.call(b,prop)&&__defNormalProp(a,prop,b[prop]);return a},__spreadProps=(a,b)=>__defProps(a,__getOwnPropDescs(b));const{useState,useEffect,useMemo}=React,M={id:"c",vak:"Geschiedenis",les:"C",title:"De standensamenleving",pages:"Storia 3, p. 51\u201359",color:"#ffd54f",draad:[{t:"Waar gaat deze les over?",p:["Volgens de Belgische grondwet zijn alle Belgen 'gelijk voor de wet'. Tijdens de middeleeuwen en de vroegmoderne tijd bestaat er w\xE9l een juridisch verschil tussen mensen: afhankelijk van je groep heb je meer of minder rechten. Zo'n samenleving heet een standensamenleving.","De vragen: hoe is ze ontstaan? Is iedereen binnen een stand gelijk? Is er een evolutie in de verhouding tussen de standen? Wanneer en waarom komt er een einde aan?","Tijdlijn: \xB1900 tot 1789 (Franse Revolutie)."]},{t:"1. Het ontstaan (500\u20131000)",p:["Bij de Romeinen en de Germanen bestaat er geen gelijkheid tussen mensen. Beide samenlevingen kennen 'vrije mensen' en onvrije mensen.","Na de val van het West-Romeinse Rijk blijven de tijden roerig: invallen en oorlogen maken de samenleving onveilig. Vrije boeren zoeken bescherming bij lokale krijgsheren, die over een klein legertje beschikken.","De krijgsheer biedt bescherming in ruil voor gehoorzaamheid en eventuele steun in de strijd. De boeren moeten vaak hun grond aan hem overdragen; zo breidt hij zijn grondbezit en macht uit. De boeren verliezen een deel van hun vrijheid: ze krijgen nog meer verplichtingen (karweien, belastingen\u2026) en worden horigen.","Zo ontstaan twee groepen: de krijgsheren (en hun soldaten) zorgen voor veiligheid, de horigen voor het onderhoud (eten)."]},{t:"1. De drie standen (rond 1000)",p:["Door de kerstening neemt de macht en invloed van de geestelijkheid toe. Geestelijken kunnen lezen en schrijven en zijn heel nuttig voor de vorsten. Ze vormen een derde groep.","Rond 1000 is de indeling ingeburgerd. De Kerk stelt ze voor als de wil van God: de samenleving is als een lichaam waarin elke groep zijn eigen taak heeft.","De geestelijkheid of clerus is de eerste stand: ze bidt en staat in voor het zielenheil van de gelovigen. De adel (vooral de krijgsheren) is de tweede stand: ze strijdt en beschermt de andere standen. De rest van de bevolking is de derde stand: ze werkt en voorziet de samenleving van voedsel.","Clerus en adel, die bijna alle grond bezitten, zijn de bevoorrechte standen. De derde stand heeft voornamelijk plichten. Je afkomst (geboorte) bepaalt meestal je stand. Omdat geestelijken niet mogen huwen, wordt niemand in de geestelijke stand geboren. De standensamenleving is een gelaagde samenleving."]},{t:"2. Geen homogene groepen",p:["Binnen de adel: de hoge adel is verwant aan de koning, vervult belangrijke bestuursfuncties en bezit meer grond. De lage adel heeft soms moeite om een 'gepaste' levensstijl te behouden.","Binnen de clerus: de hoge clerus komt vooral uit de (hoge) adel en heeft de belangrijkste functies en inkomsten. De lagere geestelijkheid, zoals parochiepriesters, komt vaak uit de derde stand en leeft op het randje van de armoede.","Binnen de derde stand: de meeste boeren zijn horigen, maar er zijn ook vrije boeren. Een aparte categorie zijn de lijfeigenen: zij zijn eerder een soort slaven, zonder grond of rechten. In West-Europa verdwijnen ze in de tweede helft van de middeleeuwen; in Oost-Europa blijft de lijfeigenschap tot in de 18e eeuw, in Rusland zelfs tot in de 19e eeuw."]},{t:"2. De ridders",p:["Aanvankelijk zijn ridders een afzonderlijke categorie: (meestal) niet-adellijke soldaten te paard van een koning of edelman.","De Kerk dringt de brute vechtersbazen een soort ridderideaal op: ze moeten hun zwaard in dienst stellen van de Kerk en de zwakkeren. Verhalen zoals koning Arthur en de Ronde Tafel versterken dat beeld.","Vanaf de 11e eeuw wordt de ruiterij belangrijker in de oorlog en stijgt het aanzien van de ridders. Steeds meer edelen kiezen het ridderschap. Vanaf de 13e eeuw komen de meeste ridders uit de adel; de kostprijs (paard, harnas, ridderslag) maakt dat alleen edelen erbij kunnen."]},{t:"3. De steden (1000\u20131500)",p:["Vanaf de 11e eeuw herleeft de handel en ontstaan steden (zie D3). Stedelingen eisen rechten: zelfbestuur, zelfverdediging. Zo wordt de stad onafhankelijker tegenover de grondbezitter, die zijn macht ziet verminderen.","De koningen, in een machtsstrijd met de adel, steunen de steden: zo worden adellijke grondbezitters tot gehoorzaamheid gedwongen. Bovendien zoeken de koningen hun medewerkers onder de rijkste (en geschoolde) stedelingen.","Als beloning worden sommige stedelingen in de adel opgenomen: de ambtsadel. De oude zwaardadel of krijgsadel kijkt vaak neer op die nieuwe edelen. Vanaf de 14e eeuw verandert de militaire rol van de adel: vuurwapens en huurlingen worden belangrijker. Daardoor vermindert het belang van de adellijke ridders.","Steden trekken horigen aan; sommigen ontvluchten hun heer. Om die plattelandsvlucht tegen te gaan, doen heren toegevingen. Zo verdwijnt de horigheid in West-Europa geleidelijk; veel voormalige horigen worden pachters."]},{t:"4. De burgerij (1500\u20131800)",p:["Vanaf de 14e\u201315e eeuw ontstaat door ontdekkingsreizen en kolonisatie een wereldhandel. Sommige burgers worden heel rijk; de adel verliest steeds meer macht aan de koning.","De adel ontwikkelt een echte adellijke levensstijl om zich te onderscheiden, maar die kost veel geld. De inkomsten uit grondbezit nemen af; veel edelen raken in financi\xEBle problemen. Handel drijven mag niet (dat kan leiden tot verlies van de adellijke titel). Veel edelen zoeken een oplossing in dienst van de koning.","De rijke burgerij imiteert de adel en probeert adellijke titels te verwerven, zelfs door aankoop. Er zijn steeds meer huwelijken tussen hoge burgerij en (lagere) adel: burgers krijgen een titel, de adel krijgt rijkdom. Tegen de 18e eeuw kan in Frankrijk en Engeland vermoedelijk geen 10 % van de adel zijn afstamming tot in de middeleeuwen terugvoeren."]},{t:"4. Het einde: 1789",p:["In de 18e eeuw winnen nieuwe idee\xEBn veld waarbij de gelijkheid centraal staat. Daarnaast begint ook de industrie belangrijker te worden; het overwicht van de landbouw en dus van de grootgrondbezitters neemt af.","In Frankrijk breekt in 1789 een revolutie uit die nog datzelfde jaar leidt tot de offici\xEBle afschaffing van de standensamenleving. Mensen zijn gelijk in rechten.","Maar dat leidt niet automatisch tot echte gelijkheid: vrouwen krijgen nog lang niet dezelfde rechten als mannen, rijke mannen hebben meer kansen dan arme. De adel verliest haar voorrechten, maar blijft bestaan en speelt nog in de 20e eeuw een rol. Ook de geestelijkheid blijft tot in de 20e en zelfs 21e eeuw een belangrijke positie bekleden."]}],lees:[{t:"Het ontstaan",x:"Vrije boeren worden [[horigen|horige]] van een krijgsheer. Rond 1000 is de samenleving verdeeld in drie [[standen|stand]]: clerus, adel en derde stand. Dat noemen we een [[standensamenleving]], een [[gelaagde samenleving]].",k:{horige:"Boer die bescherming krijgt van een heer, maar zijn grond en een deel van zijn vrijheid verliest; hij 'hoort' bij zijn heer.",stand:"Groep in de samenleving met eigen rechten en plichten, meestal bepaald door geboorte.",standensamenleving:"Samenleving waarin je, afhankelijk van je groep, meer of minder rechten hebt.","gelaagde samenleving":"Samenleving met verschillende groepen of lagen, met een belangrijk verschil in macht en aanzien."}},{t:"Binnen de standen",x:"De standen zijn niet [[homogeen]]. In de derde stand zijn [[lijfeigenen|lijfeigene]] eerder slaven. De [[ridders]] komen vanaf de 13e eeuw vooral uit de adel. Later vervangen [[huurlingen|huurling]] hen.",k:{homogeen:"Gelijksoortig, geen verschil.",lijfeigene:"Boer zonder grond of rechten, eerder een soort slaaf. Verdwijnt in West-Europa, blijft in Oost-Europa tot de 18e eeuw.",ridders:"Eerst niet-adellijke soldaten te paard; de Kerk legt hun een ridderideaal op; door de kostprijs vanaf de 13e eeuw vooral edelen.",huurling:"Soldaat die enkel tegen betaling vecht, voor wie hem kan inhuren."}},{t:"Nieuwe adel",x:"Koningen belonen stedelingen met een titel: de [[ambtsadel]]. De oude [[zwaardadel]] kijkt op hen neer. Van de adel verwacht men [[noblesse oblige]]; handel drijven kan leiden tot [[d\xE9rogeance]].",k:{ambtsadel:"Stedelingen die in de adel worden opgenomen omdat ze een ambt uitoefenen voor de koning.",zwaardadel:"De 'oude' adel of krijgsadel, wiens aantal flink uitgedund wordt door oorlogen.","noblesse oblige":"Het idee dat de adel zich moet onderscheiden met een bepaalde levensstijl (kleding, wonen, vrije tijd).",d\u00E9rogeance:"Het verlies van de adellijke titel en/of privileges, bijvoorbeeld door handel te drijven."}},{t:"Het einde",x:"In de 18e eeuw komen idee\xEBn over [[gelijkheid]]. In [[1789]] wordt de standensamenleving afgeschaft. Vandaag staat de gelijkheid in de [[grondwet]].",k:{1789:"De Franse Revolutie schaft de standensamenleving officieel af. Echte gelijkheid volgt niet automatisch.",gelijkheid:"Nieuwe idee\xEBn in de 18e eeuw, gesteund door de wetenschappelijke vooruitgang en economische ontwikkelingen.",grondwet:"De basiswet van een land: rechten en plichten van de burgers en de overheid."}}],vocab:[["standensamenleving","Samenleving waarin je meer of minder rechten hebt volgens je groep."],["horige","Boer die bescherming krijgt maar zijn grond en een deel van zijn vrijheid verliest."],["lijfeigene","Boer zonder grond of rechten, eerder een soort slaaf."],["ridder","Soldaat te paard; vanaf de 13e eeuw vooral edelen."],["ambtsadel","Stedelingen geadeld omdat ze een ambt uitoefenen voor de koning."],["zwaardadel","De oude adel of krijgsadel."],["clerus","De geestelijkheid: de eerste stand, die bidt."],["derde stand","Iedereen die geen geestelijke of edele is: werkt en zorgt voor voedsel."],["homogeen","Gelijksoortig, zonder verschil."],["pachter","Boer die grond (en werktuigen) huurt van een grootgrondbezitter."],["noblesse oblige","De adel moet zich onderscheiden met een bepaalde levensstijl."],["huurling","Soldaat die enkel tegen betaling vecht."]],quiz:[{t:"mc",q:"Waarom zoeken vrije boeren in de vroege middeleeuwen bescherming bij een krijgsheer?",o:["Invallen en oorlogen maken de samenleving onveilig","Ze willen ridder worden","De Kerk verplicht het","Ze willen naar de stad"],a:0,e:"In ruil worden ze horigen: ze verliezen grond en een deel van hun vrijheid."},{t:"mc",q:"Wat is een horige?",o:["Een boer die bescherming krijgt maar grond en vrijheid verliest","Een rijke stedeling","Een geestelijke","Een soldaat te paard"],a:0,e:"Hij 'hoort' bij zijn heer en heeft extra verplichtingen (karweien, belastingen)."},{t:"mc",q:"Welke stand bidt?",o:["De clerus (eerste stand)","De adel (tweede stand)","De derde stand","De burgerij"],a:0,e:"De adel strijdt, de derde stand werkt."},{t:"mc",q:"Welke taak heeft de adel?",o:["Strijden en de andere standen beschermen","Bidden","Werken en voedsel produceren","Handel drijven"],a:0,e:"De adel bestaat aanvankelijk uit de krijgsheren."},{t:"mc",q:"Hoe verantwoordt de Kerk de indeling in drie standen?",o:["Het is de wil van God: de samenleving is als een lichaam","Het is de wil van de koning","Het staat in de Romeinse wet","Het is toeval"],a:0,e:"Elke groep heeft zijn eigen taak."},{t:"tf",q:"Je kunt geboren worden in de geestelijke stand.",a:!1,e:"Fout. Geestelijken mogen niet huwen; de leden komen uit de adel en de derde stand."},{t:"tf",q:"De standen zijn homogene groepen.",a:!1,e:"Fout. Er is hoge en lage adel, hoge en lage clerus, en in de derde stand horigen, vrije boeren en lijfeigenen."},{t:"mc",q:"Wat is het verschil tussen een horige en een lijfeigene?",o:["Een horige heeft nog een stukje grond, een lijfeigene is eerder een slaaf zonder grond of rechten","Er is geen verschil","Een lijfeigene is rijker","Een horige woont in de stad"],a:0,e:"In West-Europa verdwijnen de lijfeigenen; in Rusland blijft de lijfeigenschap tot in de 19e eeuw."},{t:"order",q:"Zet de evolutie van het ridderschap in volgorde.",o:["Niet-adellijke soldaten te paard","De Kerk legt een ridderideaal op","Vanaf de 11e eeuw: meer aanzien, edelen worden ridder","Vanaf de 13e eeuw: bijna alleen nog edelen"],e:"De kostprijs (paard, harnas, ridderslag) maakt dat alleen edelen erbij kunnen."},{t:"mc",q:"Waarom steunen de koningen de steden?",o:["Om de adel tot gehoorzaamheid te dwingen en om geschoolde medewerkers te vinden","Omdat de paus het vraagt","Om de horigheid te behouden","Om oorlog te voeren tegen de Kerk"],a:0,e:"Twee redenen: machtsstrijd met de adel, en rijke geschoolde stedelingen als medewerkers."},{t:"mc",q:"Wat is de ambtsadel?",o:["Stedelingen die geadeld worden voor hun ambt bij de koning","De oude krijgsadel","De hoge clerus","Huurlingen"],a:0,e:"De oude zwaardadel kijkt vaak op hen neer."},{t:"mc",q:"Waarom verdwijnt de horigheid in West-Europa?",o:["Horigen vluchten naar de steden en de heren doen toegevingen","De koning verbiedt het","De Kerk koopt hen vrij","Er komt een revolutie"],a:0,e:"Veel voormalige horigen worden pachters."},{t:"mc",q:"Waarom vermindert vanaf de 14e eeuw het belang van de adellijke ridders?",o:["Vuurwapens en huurlingen worden belangrijker","Er zijn geen paarden meer","De Kerk verbiedt oorlog","De ridders worden boeren"],a:0,e:"De militaire rol van de adel verandert."},{t:"mc",q:"Waarom komt de oude adel in de vroegmoderne tijd onder druk?",o:["Dure levensstijl en dalende inkomsten uit grondbezit","Te veel macht","Ze mag geen grond bezitten","Ze moet in de stad wonen"],a:0,e:"Ze verliest ook macht aan de koning; handel drijven mag niet."},{t:"mc",q:"Hoe verhouden de rijke burgers en de adel zich in de vroegmoderne tijd?",o:["Burgers imiteren de adel en trouwen met edelen: titel tegen rijkdom","Ze haten elkaar en trouwen nooit","De adel wordt burger","Ze hebben geen contact"],a:0,e:"Beide partijen winnen erbij."},{t:"mc",q:"Welke reden zet de standensamenleving in de 18e eeuw NIET onder druk?",o:["De terugkeer van de lijfeigenschap","Nieuwe idee\xEBn over gelijkheid","De opkomst van de industrie","De instroom van rijke burgers in de adel"],a:0,e:"De drie redenen: idee\xEBn over gelijkheid, de industrie, en de toestroom van burgers (de adel probeert die af te remmen)."},{t:"tf",q:"Na 1789 is er echte gelijkheid tussen alle mensen.",a:!1,e:"Fout. Vrouwen hebben minder rechten, rijken meer kansen; adel en geestelijkheid blijven invloedrijk."},{t:"mc",q:"Bron 1: hoeveel groepen onderscheidt Adalbero van Laon (ca. 1027) uiteindelijk?",o:["Drie: de ene bidt, de andere strijdt, de laatste werkt","Twee: edelen en onvrijen","Vier","E\xE9n: de gemeenschap van gelovigen"],a:0,e:"De drie orden kunnen niet gescheiden worden: ze hebben elkaar nodig."},{t:"mc",q:"Bron 13A 'Le grand abus' (1789): wat klaagt de tekenaar aan?",o:["De derde stand draagt de lasten van clerus en adel","De adel werkt te hard","De koning is te arm","De boeren zijn lui"],a:0,e:"Een oude boer draagt een geestelijke en een edele op zijn rug."}],toets:[{k:"KENNEN 1",s:"begrippen",q:"Leg uit: standensamenleving, horigen, lijfeigenen, ridders, ambtsadel, zwaardadel.",a:["Standensamenleving: meer of minder rechten volgens je groep.","Horige: beschermde boer zonder eigen grond, met extra plichten. Lijfeigene: eerder een slaaf, zonder grond of rechten.","Ridders: soldaten te paard, later vooral edelen.","Ambtsadel: geadeld voor een ambt bij de koning. Zwaardadel: de oude krijgsadel."]},{k:"KENNEN 2",s:"ontstaan ongelijkheid",q:"Leg het ontstaan van de ongelijkheid in de vroegmiddeleeuwse samenleving uit.",a:["Onveiligheid na de val van Rome: vrije boeren zoeken bescherming bij krijgsheren.","Ze dragen hun grond over en worden horigen; de krijgsheer breidt zijn macht uit.","Door de kerstening komt de geestelijkheid erbij als derde groep."]},{k:"KENNEN 3\u20135",s:"drie standen",q:"Noem de drie standen, hun taak, en de belangrijkste verantwoording voor die indeling.",a:["Clerus: bidt (zielenheil). Adel: strijdt (bescherming). Derde stand: werkt (voedsel).","Verantwoording: de wil van God; de samenleving is als \xE9\xE9n lichaam met elk zijn taak."]},{k:"KENNEN 6\u20137",s:"geen homogene groepen, ridders",q:"Leg uit dat de standen geen homogene groepen zijn, en de ontwikkeling van het ridderschap.",a:["Hoge en lage adel; hoge en lage clerus; horigen, vrije boeren en lijfeigenen.","Ridders: eerst niet-adellijke ruiters \u2192 ridderideaal van de Kerk \u2192 vanaf de 11e eeuw meer aanzien \u2192 vanaf de 13e eeuw vooral edelen (kostprijs)."]},{k:"KENNEN 8\u201310",s:"steden en horigheid",q:"Waarom zet de opkomst van de steden de standensamenleving onder druk? Geef twee redenen waarom koningen de burgerij steunen. Hoe verdwijnt de horigheid?",a:["Steden krijgen rechten en worden onafhankelijker van de grondbezitters.","Koningen: de adel tot gehoorzaamheid dwingen; rijke, geschoolde medewerkers vinden (\u2192 ambtsadel).","Horigen vluchten naar de steden; heren doen toegevingen; de horigheid verdwijnt, velen worden pachters."]},{k:"KENNEN 11\u201312",s:"oude adel en burgerij",q:"Geef twee redenen waarom de oude adel in de vroegmoderne tijd onder druk komt, en beschrijf de verhouding tussen rijke burgers en adel.",a:["Dure adellijke levensstijl; dalende inkomsten uit grondbezit (en verlies van macht aan de koning).","Rijke burgers imiteren de adel, kopen titels en trouwen met edelen; de adel krijgt zo rijkdom."]},{k:"KENNEN 13\u201314",s:"einde in 1789",q:"Geef drie redenen voor de druk op de standensamenleving in de 18e eeuw, en leg uit waarom de afschaffing geen echte gelijkheid bracht.",a:["Nieuwe idee\xEBn over gelijkheid; de opkomst van de industrie (minder overwicht van de landbouw en de grootgrondbezitters); de instroom van burgers in de adel.","Na 1789: vrouwen minder rechten, rijken meer kansen; adel en geestelijkheid blijven invloedrijk."]},{k:"Bron 1",s:"bron 1 Adalbero",q:"Adalbero van Laon (ca. 1027): welke groepen onderscheidt hij, met welke taak, en hoe vormen ze een geheel?",a:["Drie orden: de ene bidt (geestelijkheid), de andere strijdt (adel), de laatste werkt (onvrijen).","Ze kunnen niet gescheiden worden: de diensten van de ene maken het werk van de andere twee mogelijk.","Niet gelijk: de onvrijen zijn 'een ongelukkig mensenras'."]},{k:"Bron 13",s:"bron 13 spotprenten 1789",q:"Bron 13A en 13B (1789): wie zijn de figuren, wat klaagt de tekenaar aan, en wat is het verschil?",a:["13A: een oude boer (derde stand) draagt een geestelijke en een edele: hij draagt de lasten.","13B: de rollen zijn omgedraaid: de boer zit op de rug van de anderen ('Ik wist wel dat het ooit onze beurt zou zijn').","In 1789 breekt de Franse Revolutie uit."]}]},C={bg:"#0f0e17",card:"#1a1926",card2:"#232234",line:"#2e2d3d",txt:"#fffffe",muted:"#a7a9be",ok:"#2cb67d",bad:"#ef4565",warn:"#ff8906",yel:"#ffd803",ink:"#272343"},QN=12,KEY="gesch-"+M.id+"-v1",DAG=["zo","ma","di","wo","do","vr","za"],MND=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"],RITS=[null,{n:"Rit 1 \xB7 Leren",sub:"Rode draad, kernwoorden en woordenschat",ph:[["draad","Rode draad",5],["lees","Lees & markeer",5],["woord","Woordenschat",4]]},{n:"Rit 2 \xB7 Testen",sub:"Quiz en proeftoets",ph:[["quiz","Quiz",6],["toets","Proeftoets",9]]}];function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}functi
