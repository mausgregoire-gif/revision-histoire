(function(){
var __defProp=Object.defineProperty,__defProps=Object.defineProperties;var __getOwnPropDescs=Object.getOwnPropertyDescriptors;var __getOwnPropSymbols=Object.getOwnPropertySymbols;var __hasOwnProp=Object.prototype.hasOwnProperty,__propIsEnum=Object.prototype.propertyIsEnumerable;var __defNormalProp=(obj,key,value)=>key in obj?__defProp(obj,key,{enumerable:!0,configurable:!0,writable:!0,value}):obj[key]=value,__spreadValues=(a,b)=>{for(var prop in b||(b={}))__hasOwnProp.call(b,prop)&&__defNormalProp(a,prop,b[prop]);if(__getOwnPropSymbols)for(var prop of __getOwnPropSymbols(b))__propIsEnum.call(b,prop)&&__defNormalProp(a,prop,b[prop]);return a},__spreadProps=(a,b)=>__defProps(a,__getOwnPropDescs(b));const{useState,useEffect,useMemo}=React,M={id:"b1",vak:"Geschiedenis",les:"B1",title:"De ondergang van het West-Romeinse Rijk",pages:"Storia 3, p. 14\u201319",color:"#4fc3f7",draad:[{t:"Waar gaat deze les over?",p:["Rond 500 begint in Europa een nieuwe periode: de middeleeuwen. De beginperiode noemen we de vroege middeleeuwen (500\u2013900). De klassieke samenleving verandert langzaamaan; dat proces start al in de 4e eeuw.","De 'val' van het West-Romeinse Rijk spreekt 1 500 jaar later nog tot de verbeelding. Veel wetenschappers zien de ondergang als het resultaat van een langdurige crisis.","De vragen: wanneer en waarom komt het rijk in een crisis? Hoe proberen heersers die op te lossen? Waarom komt er een einde aan de Romeinse heerschappij in het Westen? Hoe kijkt men achteraf op die gebeurtenissen terug?"]},{t:"1. Spanningen aan de grenzen",p:["Na het einde van de veroveringen in de 2e eeuw ontstaan er spanningen met buurvolkeren. In het noordoosten bedreigen Germaanse volkeren de grens langs de Rijn en de Donau. In het oosten vormen eerst de Parthen (tot 226) en daarna de Sassanieden een bedreiging.","Rome zet veel legioenen in bij de grenzen. De aanvoerders en soldaten beseffen dat Rome niet zonder hen kan. Ze vragen steeds meer geld en stellen hogere eisen aan de keizerlijke regering."]},{t:"1. De soldatenkeizers (235\u2013284)",p:["In 192 wordt keizer Commodus vermoord. Generaals trekken met hun legioenen naar Rome: een burgeroorlog. Septimius Severus wint; zijn familie blijft aan de macht tot 235.","Dan breekt een lange periode van politieke instabiliteit aan: de periode van de soldatenkeizers of de crisis van de 3e eeuw. Een keizer die aan de macht wil blijven, moet de steun van de legioenen kopen, en dat kost veel geld.","Daarom verhogen de keizers telkens de belastingen en verminderen ze het zilver in de munten. Die muntontwaarding veroorzaakt economische problemen en dalende belastinginkomsten.","Generaals die hun troepen meer geld beloven, nemen de macht over (staatsgreep). De legioenen verlaten daarvoor de grenzen; buurvolkeren profiteren om te plunderen. Invallen en burgeroorlogen ontregelen de economie, vooral de landbouw.","Geweld, honger en epidemie\xEBn doen de bevolking dalen, dus ook de belastingopbrengsten. Sommige gebiedsdelen scheuren zich (tijdelijk) af."]},{t:"2. Diocletianus en Constantijn",p:["Een bekwame keizer kan soms de vrede en eenheid herstellen. Diocletianus (reg. 284\u2013305) ontneemt de senaat haar laatste restje macht. Hij beseft dat het rijk te groot is voor \xE9\xE9n man: hij splitst het in een Oostelijk en een Westelijk deel, elk met een keizer en een medekeizer. Dat systeem heet de tetrarchie (viermansbestuur). Het lost ook het probleem van de opvolging op. Na Diocletianus loopt het toch weer mis.","Constantijn (keizer in 306, alleenheerser 324\u2013337) trekt alle macht naar zich toe. Hij verleent in 313 de christenen godsdienstvrijheid.","Hij verplaatst de hoofdstad naar het veiligere en rijkere Oosten, bij het Griekse stadje Byzantium aan de Bosporus. Dat 'Nieuwe Rome' wordt al snel Constantinopel genoemd."]},{t:"3. De volksverhuizingen",p:["Constantijns opvolgers krijgen af te rekenen met dezelfde problemen: opstandige legioenen en invallen. Nu gaat het niet om plundertochten maar om grootschalige migraties: echte volksverhuizingen. Vooral Germaanse volkeren trekken het rijk binnen om er zich te vestigen.","Interne oorzaken bij de Germanen: uitgeputte landbouwgronden, overbevolking, een slechter klimaat. Externe oorzaak: ze worden westwaarts gedreven door de Hunnen, een Centraal-Aziatisch ruitervolk. De slecht verdedigde grenzen vormen geen echte hindernis.","Sommige Germanen mogen zich binnen de grenzen vestigen als bondgenoten (foederati) tegen andere invallers. Maar beide partijen houden zich niet altijd aan de afspraken: spanningen en conflicten."]},{t:"3. Van 395 tot 476",p:["395: bij de dood van keizer Theodosius wordt het rijk opnieuw gesplitst.","410: de Visigoten, voordien nog bondgenoten, plunderen Rome. Rome is dan al lang niet meer de hoofdstad; de laatste keizers verblijven in Milaan en later in Ravenna.","455: de Vandalen, die kort daarvoor Noord-Afrika veroverden, plunderen Rome opnieuw en grondiger. Ook elders ontstaan Germaanse koninkrijken; het rijk bestaat eigenlijk alleen nog in Itali\xEB.","476: de Germaanse legeraanvoerder Odoaker zet de 15-jarige keizer Romulus Augustulus af en roept zichzelf uit tot koning van Itali\xEB."]},{t:"3. Is 476 echt het einde?",p:["476 wordt later gezien als 'het einde van het Romeinse Rijk'. Maar in het oosten blijft het rijk gewoon bestaan: vanuit Constantinopel regeren Romeinse keizers nog bijna 1 000 jaar door.","Voor de bevolking in het Westen, zeker in Itali\xEB, betekent de afzetting eigenlijk geen keerpunt. Ze leven hun 'Romeinse' leven verder: wagenrennen in het circus, ontspanning in de thermen. De Romeinse senaat komt nog meer dan een eeuw samen op het Forum Romanum."]},{t:"4. De invloed tot vandaag",p:["Het Romeinse Rijk blijft een grote aantrekkingskracht uitoefenen. Veel West-Europese landen en heersers zien zich als opvolgers van het Romeinse Rijk en de Romeinse keizers.","Tegelijk groeit de angst om net als Rome ten onder te gaan. Vanaf de 19e eeuw wordt de 'val van Rome' vaak gezien als een waarschuwing. Sommige historici, politici en kunstenaars zien overeenkomsten met hun eigen tijd. Of die vergelijkingen kloppen, blijft een onderwerp van discussie.","Bronnen 2 en 3 (Streckfuss, 1868, en Couture, 1847) tonen zo'n beeld: de Romeinen zouden ten onder gegaan zijn door luiheid, weelde en verwildering van de zeden (decadentie)."]}],lees:[{t:"De crisis van de 3e eeuw",x:"Van 235 tot 284 regeren de [[soldatenkeizers]]. Om de legioenen te betalen, zorgen ze voor [[muntontwaarding]]. Generaals nemen de macht over met een [[staatsgreep]]. Geweld, honger en een [[epidemie]] doen de bevolking dalen.",k:{soldatenkeizers:"Keizers die aan de macht komen en blijven dankzij de steun (en het geld) van de legioenen: periode van politieke instabiliteit (235\u2013284).",muntontwaarding:"Daling van de werkelijke waarde van munten ten opzichte van de waarde die op de munt staat (minder zilver).",staatsgreep:"Illegale afzetting van de heersende regering of illegale overname van de macht in een land.",epidemie:"Besmettelijke ziekte die zich heel snel uitbreidt en een groot deel van de bevolking treft."}},{t:"Een tijdelijke heropleving",x:"Diocletianus voert de [[tetrarchie]] in. Constantijn geeft in [[313]] de christenen godsdienstvrijheid en maakt van Byzantium [[Constantinopel]].",k:{313:"Constantijn verleent de christenen godsdienstvrijheid.",tetrarchie:"Viermansbestuur: het rijk in twee delen (Oost en West), elk met een keizer en een medekeizer. Lost ook het opvolgingsprobleem op.",Constantinopel:"Het 'Nieuwe Rome' bij Byzantium aan de Bosporus, in het veiligere en rijkere Oosten."}},{t:"De volksverhuizingen",x:"De [[volksverhuizingen]] hebben interne oorzaken en een externe: de [[Hunnen]]. Sommige Germanen worden [[foederati]], maar ook die [[bondgenoten|bondgenoot]] plunderen in 410 Rome.",k:{volksverhuizingen:"Grootschalige migraties van vooral Germaanse volkeren die zich in het rijk willen vestigen.",Hunnen:"Centraal-Aziatisch ruitervolk dat de Germanen westwaarts drijft (externe oorzaak).",foederati:"Bondgenoten van het Romeinse Rijk die zich in ruil voor militaire opdrachten in het rijk mogen vestigen.",bondgenoot:"Medestander. Twee landen die vechten tegen een gemeenschappelijke vijand zijn bondgenoten."}},{t:"476: einde of niet?",x:"In 476 zet [[Odoaker]] de laatste West-Romeinse keizer af. Toch blijft het [[Oost-Romeinse Rijk]] bestaan, en in het Westen is er [[continu\xEFteit]] in het dagelijkse leven. Later spreekt men van [[decadentie]].",k:{Odoaker:"Germaanse legeraanvoerder die de 15-jarige Romulus Augustulus afzet en zich koning van Itali\xEB noemt.","Oost-Romeinse Rijk":"Vanuit Constantinopel regeren Romeinse keizers nog bijna 1 000 jaar (tot 1453).",continu\u00EFteit:"Zaken die hetzelfde blijven: de mensen gaan nog naar de wagenrennen en de thermen, de senaat komt nog samen.",decadentie:"Verval, verwildering van de zeden, nastreven van bizar genot en overdadige luxe. Een populair thema in de 19e-eeuwse kunst."}}],vocab:[["soldatenkeizers","Keizers die aan de macht blijven dankzij de steun van de legioenen (235\u2013284)."],["muntontwaarding","Munten bevatten minder edelmetaal en zijn minder waard dan wat erop staat."],["staatsgreep","Illegale overname van de macht in een land."],["tetrarchie","Viermansbestuur: twee keizers en twee medekeizers (Diocletianus)."],["volksverhuizingen","Grootschalige migraties van Germaanse volkeren die zich in het rijk vestigen."],["Hunnen","Centraal-Aziatisch ruitervolk dat de Germanen westwaarts drijft."],["foederati","Germaanse bondgenoten die zich in het rijk mogen vestigen in ruil voor militaire hulp."],["epidemie","Besmettelijke ziekte die zich snel uitbreidt en een groot deel van de bevolking treft."],["dynastie","Vorstenhuis: opeenvolgende heersers uit dezelfde familie."],["Constantinopel","Nieuwe hoofdstad van Constantijn, bij Byzantium aan de Bosporus."],["decadentie","Verval, verwildering van de zeden en overdadige luxe."],["monarchie","Bestuursvorm, vaak een koninkrijk, waarin \xE9\xE9n persoon de macht heeft."]],quiz:[{t:"mc",q:"Met welke twee volkeren hebben de Romeinen aan het einde van de 2e eeuw geregeld conflicten?",o:["Germanen en Parthen (later Sassanieden)","Grieken en Egyptenaren","Hunnen en Vikingen","Franken en Arabieren"],a:0,e:"Germanen in het noordoosten (Rijn en Donau), in het oosten de Parthen en daarna de Sassanieden."},{t:"mc",q:"Waarom komen de legioenen vanaf het einde van de 2e eeuw geregeld in opstand?",o:["Ze beseffen dat Rome niet zonder hen kan en eisen steeds meer geld","Ze willen terug naar huis","De keizer verbiedt hun godsdienst","Ze worden door de Hunnen betaald"],a:0,e:"Aanvoerders en soldaten vragen meer geld en stellen hogere eisen aan de keizer."},{t:"mc",q:"Welke periode noemt men de periode van de soldatenkeizers?",o:["235\u2013284","192\u2013235","284\u2013305","395\u2013476"],a:0,e:"De crisis van de 3e eeuw: een lange periode van politieke instabiliteit."},{t:"mc",q:"Wat is een nadelig gevolg van de opstanden van de legioenen?",o:["De grenzen blijven onverdedigd, buurvolkeren plunderen","Er komen meer soldaten aan de grens","De belastingen dalen","De senaat krijgt meer macht"],a:0,e:"Legioenen verlaten hun kamp om een generaal aan de macht te brengen; buurvolkeren profiteren daarvan."},{t:"mc",q:"Hoe leidt een politiek probleem tot een economisch probleem?",o:["Keizers kopen steun met geld en verminderen het zilver in munten: muntontwaarding","De keizer verbiedt handel met Germanen","De senaat schaft de belastingen af","De keizer verhuist naar Ravenna"],a:0,e:"En omgekeerd: dalende belastinginkomsten maken het moeilijker om de legioenen te betalen."},{t:"tf",q:"Muntontwaarding betekent dat munten minder waard worden dan wat erop staat.",a:!0,e:"Juist. Er zit minder edelmetaal (zilver) in."},{t:"mc",q:"Welke twee keizers herstellen eind 3e \u2013 begin 4e eeuw tijdelijk de situatie?",o:["Diocletianus en Constantijn","Commodus en Septimius Severus","Theodosius en Romulus Augustulus","Justinianus en Odoaker"],a:0,e:"Diocletianus (284\u2013305) en Constantijn (306\u2013337)."},{t:"mc",q:"Wat is de tetrarchie?",o:["Een viermansbestuur: twee keizers en twee medekeizers","Een Germaans koninkrijk","Een belasting op zilver","Een verdrag met de Hunnen"],a:0,e:"Diocletianus splitst het rijk in Oost en West, elk met een keizer en een medekeizer."},{t:"mc",q:"Welke maatregel neemt Constantijn in 313?",o:["Hij geeft de christenen godsdienstvrijheid","Hij splitst het rijk definitief","Hij schaft de legioenen af","Hij verhuist naar Ravenna"],a:0,e:"Daarnaast verplaatst hij de hoofdstad naar Byzantium: Constantinopel."},{t:"mc",q:"Waarom verplaatst Constantijn de hoofdstad naar het Oosten?",o:["Het Oosten is veiliger en rijker","Rome is verwoest door de Hunnen","De paus vraagt het","Er is te veel handel in Rome"],a:0,e:"Bij het Griekse stadje Byzantium, aan de Bosporus."},{t:"mc",q:"Welke is een INTERNE oorzaak van de Germaanse migraties?",o:["Uitgeputte landbouwgronden en overbevolking","De komst van de Hunnen","Uitnodiging door de keizer","De pest"],a:0,e:"Ook een verslechtering van het klimaat. De komst van de Hunnen is de externe oorzaak."},{t:"mc",q:"Wat is de externe oorzaak van de Germaanse migraties?",o:["De Hunnen drijven hen westwaarts","Overbevolking","Een slechter klimaat","Uitgeputte landbouwgronden"],a:0,e:"De Hunnen zijn een Centraal-Aziatisch ruitervolk."},{t:"mc",q:"Wie zijn de foederati?",o:["Germaanse bondgenoten die zich in het rijk mogen vestigen","Romeinse senatoren","Keizers uit het Oosten","Belastingontvangers"],a:0,e:"In ruil voor militaire opdrachten. Afspraken worden niet altijd nagekomen."},{t:"order",q:"Zet deze gebeurtenissen in de juiste volgorde.",o:["395: het rijk wordt opgesplitst","410: de Visigoten plunderen Rome","455: de Vandalen plunderen Rome","476: Odoaker zet de laatste keizer af"],e:"Vier belangrijke gebeurtenissen tussen 395 en 476."},{t:"tf",q:"In 410 is Rome nog de hoofdstad van het West-Romeinse Rijk.",a:!1,e:"Fout. De laatste keizers verblijven in Milaan en later in Ravenna."},{t:"mc",q:"Welke Germaanse groep heeft zich in Noord-Afrika gevestigd?",o:["De Vandalen","De Franken","De Visigoten","De Angelen"],a:0,e:"Ze plunderen Rome in 455 opnieuw en grondiger."},{t:"mc",q:"Waarom is 476 niet het einde van het Romeinse Rijk?",o:["In het oosten blijft het rijk nog bijna 1 000 jaar bestaan","Odoaker wordt zelf keizer van Rome","De Hunnen worden verslagen","De senaat kiest een nieuwe keizer"],a:0,e:"Vanuit Constantinopel regeren Romeinse keizers verder (tot 1453)."},{t:"mc",q:"Waarom is 476 voor veel mensen in het Westen geen grote breuk?",o:["Ze leven hun 'Romeinse' leven gewoon verder","Ze vluchten allemaal naar het Oosten","Ze worden allemaal Germanen","Ze weten het niet"],a:0,e:"Ze gaan nog naar de wagenrennen en de thermen; de senaat komt nog meer dan een eeuw samen."},{t:"mc",q:"Bron 2\u20133: welk beeld schetsen Streckfuss (1868) en Couture (1847) van de Romeinen?",o:["Negatief: lui, weelderig, decadent","Positief: dapper en sterk","Neutraal","Ze tonen alleen de keizers"],a:0,e:"Volgens hen ging Rome ten onder door luiheid en weelde. Ze willen hun eigen tijdgenoten waarschuwen."},{t:"tf",q:"Bron 2 en 3 leren ons meer over de 19e eeuw dan over de val van Rome.",a:!0,e:"Juist (KUNNEN 3): de beeldvorming over de 'val van Rome' leert soms meer over de tijd van de beeldvorming."}],toets:[{k:"KENNEN 1",s:"begrippen",q:"Leg uit: soldatenkeizers, tetrarchie, volksverhuizingen, Hunnen, foederati.",a:["Soldatenkeizers: keizers die aan de macht blijven dankzij de legioenen (235\u2013284).","Tetrarchie: viermansbestuur (Oost en West, telkens keizer + medekeizer).","Volksverhuizingen: grootschalige migraties van Germaanse volkeren die zich in het rijk vestigen.","Hunnen: Centraal-Aziatisch ruitervolk dat de Germanen westwaarts drijft.","Foederati: bondgenoten die zich in het rijk mogen vestigen in ruil voor militaire opdrachten."]},{k:"KENNEN 2\u20134",s:"conflicten en opstanden",q:"Met welke twee volkeren zijn er eind 2e eeuw conflicten? Waarom komen legioenen in opstand? Geef een nadelig gevolg.",a:["Germanen (noordoosten) en Parthen / Sassanieden (oosten).","Rome kan niet zonder de legioenen: ze eisen steeds meer geld.","Gevolg: de grenzen blijven onverdedigd, buurvolkeren plunderen; burgeroorlogen ontregelen de economie."]},{k:"KENNEN 5",s:"politiek en economie",q:"Leg uit hoe politieke oorzaken economische gevolgen hebben, en omgekeerd.",a:["Politiek \u2192 economie: keizers kopen de steun van de legioenen; ze verhogen de belastingen en ontwaarden de munten.","Economie \u2192 politiek: muntontwaarding leidt tot dalende belastinginkomsten; legioenen eisen nog meer en generaals nemen de macht over."]},{k:"KENNEN 6\u20138",s:"Diocletianus en Constantijn",q:"Welke twee keizers herstellen tijdelijk de situatie? Geef een maatregel van Diocletianus en twee van Constantijn.",a:["Diocletianus en Constantijn.","Diocletianus: de tetrarchie (en de senaat verliest haar laatste macht).","Constantijn: godsdienstvrijheid voor de christenen (313); de hoofdstad naar Byzantium (Constantinopel)."]},{k:"KENNEN 9\u201310",s:"oorzaken migraties",q:"Noem twee interne oorzaken en \xE9\xE9n externe oorzaak van de Germaanse migraties.",a:["Intern: uitgeputte landbouwgronden, overbevolking, verslechtering van het klimaat.","Extern: de Hunnen drijven hen westwaarts."]},{k:"KENNEN 11",s:"395\u2013476",q:"Noem vier belangrijke gebeurtenissen tussen 395 en 476.",a:["395: definitieve splitsing van het rijk (dood van Theodosius).","410: de Visigoten plunderen Rome.","455: de Vandalen plunderen Rome.","476: Odoaker zet Romulus Augustulus af."]},{k:"KENNEN 12\u201313",s:"476 geen einde, geen breuk",q:"Waarom is 476 niet het einde van het Romeinse Rijk? Waarom is het in het Westen aanvankelijk geen grote breuk?",a:["In het oosten regeren Romeinse keizers vanuit Constantinopel nog bijna 1 000 jaar.","In het Westen leven mensen hun 'Romeinse' leven verder (circus, thermen); de senaat k
