var __defProp=Object.defineProperty,__defProps=Object.defineProperties;var __getOwnPropDescs=Object.getOwnPropertyDescriptors;var __getOwnPropSymbols=Object.getOwnPropertySymbols;var __hasOwnProp=Object.prototype.hasOwnProperty,__propIsEnum=Object.prototype.propertyIsEnumerable;var __defNormalProp=(obj,key,value)=>key in obj?__defProp(obj,key,{enumerable:!0,configurable:!0,writable:!0,value}):obj[key]=value,__spreadValues=(a,b)=>{for(var prop in b||(b={}))__hasOwnProp.call(b,prop)&&__defNormalProp(a,prop,b[prop]);if(__getOwnPropSymbols)for(var prop of __getOwnPropSymbols(b))__propIsEnum.call(b,prop)&&__defNormalProp(a,prop,b[prop]);return a},__spreadProps=(a,b)=>__defProps(a,__getOwnPropDescs(b));const{useState,useEffect,useMemo}=React,M={id:"b4",vak:"Geschiedenis",les:"B4",title:"Het Romeinse Rijk houdt stand in het Oosten",pages:"Storia 3, p. 39\u201342",color:"#ba68c8",draad:[{t:"Waar gaat deze les over?",p:["In 395 wordt het Romeinse Rijk gesplitst in een westelijk en een oostelijk deel. De Germanen lopen in de 5e eeuw het West-Romeinse Rijk onder de voet.","Het Oost-Romeinse of Byzantijnse Rijk houdt nog meer dan 1 000 jaar stand. Hoe valt dat succes te verklaren? Welke contacten blijven er bestaan met West-Europa?","Tijdlijn: Constantijn (306\u2013337), Justinianus (527\u2013565), val van Constantinopel in 1453."]},{t:"1. Constantijn bouwt een nieuwe hoofdstad",p:["Keizer Constantijn (reg. 306\u2013337) kiest de Griekse stad Byzantium als nieuwe hoofdstad: Constantinopel, 'stad van Constantijn'.","Zijn redenen: het oostelijke deel van het rijk is dichtbevolkt en welvarend, en hij rekruteert zijn soldaten vooral in Klein-Azi\xEB. Vanuit Constantinopel kan hij makkelijker de bedreigde Donaugrens beschermen en de aanvallen van de Perzische Sassanieden afweren. De stad ligt op een schiereiland met makkelijk te verdedigen havens, en vandaar kunnen de Romeinen de handel met de gebieden rond de Zwarte Zee controleren.","In 330 huldigt hij de stad in. Volgende keizers breiden ze uit en beveiligen ze met nieuwe muren (bron 1\u20132: de muren van Theodosius, vanaf 413). Onder Justinianus telt de stad al een half miljoen inwoners."]},{t:"1. Waarom het Oosten standhoudt",p:["Het Oost-Romeinse Rijk overleeft de volksverhuizingen van de 5e eeuw dankzij de strategische ligging van Constantinopel en de behendige diplomatie van de keizers.","Zo sluit keizer Zeno (reg. 474\u2013491) een overeenkomst met de Ostrogoot Theoderik: die mag Itali\xEB binnenvallen, waardoor de plunderende Ostrogoten geen bedreiging meer vormen voor het Oosten.","Het Oost-Romeinse Rijk kent ook niet dezelfde economische en demografische achteruitgang als het West-Romeinse Rijk aan het einde van de klassieke oudheid."]},{t:"2. Justinianus legt het Romeinse recht vast",p:["Constantinopel is een Griekse stad; de Griekse cultuur overheerst het Oost-Romeinse Rijk. In de 6e eeuw spreekt men in Illyri\xEB nog Latijn. Daar komt keizer Justinianus vandaan.","Hij laat het Romeinse recht tussen 528 en 534 vastleggen in een 'codex': het Corpus Iuris Civilis. Het bevat leerboeken voor studenten, een overzicht van de keizerlijke wetten en opinies van Romeinse rechtsgeleerden. De teksten zijn in het Latijn; zijn latere nieuwe wetten (Novellae) grotendeels in het Grieks.","Vanaf de 7e eeuw spreken we van een Grieks-Byzantijns Rijk. In de 11e eeuw bestuderen West-Europese rechtsgeleerden de codex; in Bologna wordt de studie van het Romeinse recht bekend. Het legt de nadruk op de absolute macht van de keizer: vanaf de 13e eeuw gebruiken westerse vorsten die redenering om hun macht uit te breiden."]},{t:"3. De hereniging van het rijk mislukt",p:["Justinianus droomt van het herstel van het oude Romeinse Rijk. Zijn veldheren Belisarius en Narses veroveren Noord-Afrika, Itali\xEB en het zuiden van Spanje op Germaanse volkeren. De meeste veroveringen gaan kort na zijn dood verloren.","De keizer is in principe almachtig: hij is de staatsmacht, militair leider en hoofd van de Kerk. Toch is die macht vaak onvoldoende: van de ruim 100 keizers worden er 65 vermoord, verminkt, gevangengenomen of opgesloten in een klooster.","De Byzantijnse kunst toont de almacht van de keizer, zoals de moza\xEFeken van Ravenna (bron 4: Justinianus met purperen mantel en aureool). In Constantinopel laat Justinianus de Hagia Sophia (Kerk van de Heilige Wijsheid) bouwen."]},{t:"3. Tot 1453 en daarna",p:["Het Byzantijnse Rijk houdt stand tot 1453. Dan veroveren de Ottomaanse Turken Constantinopel, dat ze later Istanbul zullen noemen. De Hagia Sophia wordt een moskee.","Na de Eerste Wereldoorlog blijven veel Grieken in Constantinopel wonen; een oorlog tussen Griekenland en Turkije zorgt ervoor dat de meeste Grieken Turkije verlaten. De patriarch (aartsbisschop van de oostelijke christelijke Kerk) verblijft nog altijd in Istanbul.","De begrippen 'Byzantijns Rijk' en 'Oost-Romeinse Rijk' worden door elkaar gebruikt. De Byzantijnen noemden zichzelf 'Romaioi' of 'Romeinen'."]}],lees:[{t:"Een nieuwe hoofdstad",x:"Constantijn maakt van Byzantium [[Constantinopel]]. Hij [[rekruteert|rekruteren]] zijn soldaten in Klein-Azi\xEB. Het rijk overleeft dankzij de ligging en de [[diplomatie]] van de keizers.",k:{Constantinopel:"'Stad van Constantijn', ingehuldigd in 330, op een schiereiland met makkelijk te verdedigen havens.",rekruteren:"In dienst nemen van bijvoorbeeld soldaten.",diplomatie:"Onderhandelen en overeenkomsten sluiten, zoals keizer Zeno met de Ostrogoot Theoderik."}},{t:"Justinianus",x:"Justinianus laat het [[Corpus Iuris Civilis]] opstellen. Het [[Byzantijnse Rijk]] blijft meer dan duizend jaar bestaan, een [[millennium]]. De [[demografie]] van het Oosten gaat niet achteruit.",k:{"Corpus Iuris Civilis":"'Verzameling' van het burgerlijk recht (528\u2013534): leerboeken, keizerlijke wetten en opinies van rechtsgeleerden.","Byzantijnse Rijk":"Ook Oost-Romeinse Rijk. Pas na de val van het rijk spreekt men van 'Byzantijns'. De Byzantijnen noemden zich 'Romaioi'.",millennium:"Een periode van duizend jaar.",demografie:"Wetenschap die de ontwikkeling van de bevolkingscijfers en de samenstelling van de bevolking bestudeert."}},{t:"De macht van de keizer",x:"De keizer is [[almachtig]]: staat, leger en Kerk. Een [[aureool]] op het moza\xEFek in Ravenna toont dat. Via [[Bologna]] be\xEFnvloedt het Romeinse recht West-Europa.",k:{almachtig:"De keizer is de staatsmacht, militair leider en hoofd van de Kerk. Toch worden 65 van de ruim 100 keizers vermoord, verminkt of opgesloten.",aureool:"Lichtkrans rond het hoofd van een heilige: de keizerlijke macht komt van God.",Bologna:"Universiteit waar de studie van het Romeinse recht bekend wordt. Vanaf de 13e eeuw gebruiken westerse vorsten het om hun macht uit te breiden."}}],vocab:[["Constantinopel","Nieuwe hoofdstad van Constantijn (330), bij Byzantium."],["Byzantijnse Rijk","Ander woord voor het Oost-Romeinse Rijk."],["millennium","Een periode van duizend jaar."],["rekruteren","In dienst nemen, bijvoorbeeld soldaten."],["demografie","Wetenschap die de bevolkingscijfers en de samenstelling van de bevolking bestudeert."],["Corpus Iuris Civilis","Verzameling van het Romeinse recht, opgesteld onder Justinianus."],["Hagia Sophia","Kerk van de Heilige Wijsheid in Constantinopel, gebouwd onder Justinianus."],["aureool","Lichtkrans rond het hoofd: teken dat de macht van God komt."]],quiz:[{t:"mc",q:"Wat betekent 'millennium'?",o:["Een periode van duizend jaar","Een periode van honderd jaar","Een keizerlijke wet","Een Byzantijnse munt"],a:0,e:"Het Oost-Romeinse Rijk houdt meer dan een millennium stand."},{t:"mc",q:"Welke reden heeft Constantijn NIET om naar Byzantium te verhuizen?",o:["De paus woont er","Het oosten is dichtbevolkt en welvarend","Hij kan de Donaugrens en de grens met de Sassanieden beter beschermen","De stad is makkelijk te verdedigen en controleert de handel op de Zwarte Zee"],a:0,e:"Ook rekruteert hij zijn soldaten vooral in Klein-Azi\xEB."},{t:"mc",q:"Wanneer wordt Constantinopel ingehuldigd?",o:["330","395","476","1453"],a:0,e:"Volgende keizers breiden de stad uit en beveiligen ze met nieuwe muren."},{t:"mc",q:"Waarom overleeft het Oost-Romeinse Rijk de volksverhuizingen?",o:["Strategische ligging van Constantinopel en behendige diplomatie","Er waren geen Germanen in het oosten","De paus beschermde het","Het had geen grenzen"],a:0,e:"Bijvoorbeeld Zeno's overeenkomst met Theoderik. Ook geen economische of demografische achteruitgang zoals in het Westen."},{t:"mc",q:"Wat doet keizer Zeno met de Ostrogoot Theoderik?",o:["Hij laat hem Itali\xEB binnenvallen","Hij laat hem Constantinopel besturen","Hij verbant hem naar Afrika","Hij maakt hem paus"],a:0,e:"Zo vormen de plunderende Ostrogoten geen bedreiging meer voor het Oosten."},{t:"mc",q:"Welke taal overheerst in het Oost-Romeinse Rijk?",o:["Grieks","Latijn","Arabisch","Frankisch"],a:0,e:"Constantinopel is een Griekse stad. Vanaf de 7e eeuw spreken we van een Grieks-Byzantijns Rijk."},{t:"mc",q:"Wat is het Corpus Iuris Civilis?",o:["De verzameling van het Romeinse burgerlijk recht","Een Byzantijns leger","De kerk in Constantinopel","Een vredesverdrag"],a:0,e:"Opgesteld tussen 528 en 534 op bevel van Justinianus."},{t:"mc",q:"Welke drie verwezenlijkingen hoort bij Justinianus?",o:["Het Corpus Iuris Civilis, veroveringen in het Westen, de Hagia Sophia","Constantinopel stichten, de tetrarchie, godsdienstvrijheid","De Lex Salica, de tienden, de gouwen","De muren van Theodosius, Bologna, 1453"],a:0,e:"Zijn veldheren Belisarius en Narses veroveren Noord-Afrika, Itali\xEB en Zuid-Spanje."},{t:"tf",q:"De veroveringen van Justinianus blijven eeuwenlang Byzantijns.",a:!1,e:"Fout. De meeste gaan kort na zijn dood verloren."},{t:"mc",q:"Waarom is de Byzantijnse opvatting over de macht van de vorst belangrijk voor West-Europa?",o:["Vanaf de 13e eeuw gebruiken westerse vorsten het Romeinse recht om hun macht uit te breiden","De paus neemt de keizerstitel over","Ze schaffen de adel af","Ze voeren de democratie in"],a:0
