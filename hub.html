  const [score,setScore]=useState(0);
  const [done,setDone]=useState(false);
  const [order,setOrder]=useState(null);
  const [results,setResults]=useState([]);

  const q=questions[idx];
  const meta=getMeta(q?.lid);

  useEffect(()=>{if(q?.type==="order")setOrder(shuffle([...q.items]));},[idx]);

  function checkMC(i){if(answered!==null)return;const ok=i===q.a;setAnswered(ok?"correct":"wrong");if(ok)setScore(s=>s+1);setResults(r=>[...r,{ok,lid:q.lid}]);}

      React.createElement("div",{style:{flex:1,background:C.red+"18",border:`1px solid ${C.red}44`,borderRadius:8,padding:6,textAlign:"center",fontSize:12,color:C.red,fontWeight:700}},`❌ ${unknown}`)
    ),
    React.createElement("button",{onClick:()=>setFlipped(f=>!f),style:{width:"100%",background:flipped?meta.color+"22":C.card,border:`3px solid ${flipped?meta.color:meta.color+"50"}`,borderRadius:20,padding:"32px 20px",cursor:"pointer",marginBottom:14,minHeight:170,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",transition:"all 0.2s"}},
      React.createElement("div",{style:{fontSize:11,color:meta.color,fontWeight:700,marginBottom:10,letterSpacing:2,textTransform:"uppercase"}},`${flipped?"Betekenis":"Woord"} · ${meta.label}`),
      React.createElement("div",{style:{fontSize:flipped?15:20,fontWeight:900,color:"#fffffe",textAlign:"center",lineHeight:1.4}},flipped?card.fr:card.nl),
      !flipped&&React.createElement("div",{style:{marginTop:14,fontSize:11,color:meta.color,opacity:0.7}},"👆 Tik om te omdraaien")
    ),
    flipped?React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
      React.createElement("button",{onClick:()=>mark(false),style:{padding:16,borderRadius:14,border:`2px solid ${C.red}`,background:C.red+"22",color:C.red,fontWeight:900,fontSize:14,cursor:"pointer"}},"❌ Herhalen"),
      React.createElement("button",{onClick:()=>mark(true),style:{padding:16,borderRadius:14,border:`2px solid ${C.green}`,background:C.green+"22",color:C.green,fontWeight:900,fontSize:14,cursor:"pointer"}},"✅ Gekend!")
    ):React.createElement("div",{style:{textAlign:"center",fontSize:12,color:C.muted,padding:"10px 0"}},"Tik op de kaart om de betekenis te zien")
  );
}

function Btn({color,onClick,children}){
  return React.createElement("button",{onClick,style:{width:"100%",padding:16,borderRadius:14,border:"none",background:color,color:"#0f0e17",fontWeight:900,fontSize:15,cursor:"pointer"},
    onMouseDown:e=>e.currentTarget.style.opacity="0.8",onMouseUp:e=>e.currentTarget.style.opacity="1"},children);
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));

</script>
</body>
